<!DOCTYPE html>
<!--
  Standalone app walkthrough — double-click to open in any browser.
  No server required; video is loaded via a relative file path.
  Regenerate the video with: npm run slideshow (from repo root).
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI in Healthcare — Product Walkthrough</title>
<style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem 1rem;
        background: #0f172a;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #e2e8f0;
    }
    header { text-align: center; max-width: 720px; }
    h1 { margin: 0 0 0.35rem; font-size: 1.6rem; color: #f8fafc; }
    p { margin: 0; color: #94a3b8; font-size: 0.95rem; }
    video {
        width: min(1100px, 92vw);
        border-radius: 12px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.45);
        background: #000;
    }
    footer { color: #64748b; font-size: 0.8rem; }
    footer a { color: #7dd3fc; }
    .speed-row { display: flex; gap: 0.5rem; align-items: center; }
    .speed-row span { color: #94a3b8; font-size: 0.85rem; margin-right: 0.25rem; }
    .speed-row button {
        border: 1px solid #334155; background: #1e293b; color: #e2e8f0;
        border-radius: 6px; padding: 0.3rem 0.75rem; font-size: 0.85rem;
        cursor: pointer;
    }
    .speed-row button:hover { background: #334155; }
    .speed-row button.active { background: #0ea5e9; border-color: #0ea5e9; color: #0f172a; font-weight: 600; }
</style>
</head>
<body>
<header>
    <h1>AI in Healthcare — Product Walkthrough</h1>
    <p>An automated tour of every dashboard, as seen from a subscriber account — daily market intelligence, deal signals, regulatory tracking, sentiment analysis, and more.</p>
</header>
<video id="tour" src="output/app-walkthrough.mp4" controls autoplay muted playsinline>
    Your browser doesn't support inline video —
    open <code>output/app-walkthrough.mp4</code> directly instead.
</video>
<div class="speed-row">
    <span>Playback speed:</span>
    <button data-rate="0.5">0.5x</button>
    <button data-rate="0.75">0.75x</button>
    <button data-rate="1" class="active">1x</button>
    <button data-rate="1.5">1.5x</button>
    <button data-rate="2">2x</button>
</div>
<footer>bigskylabs.ai &middot; generated by <a href="slideshow.js">slideshow.js</a></footer>
<script>
    const video = document.getElementById('tour');
    const buttons = document.querySelectorAll('.speed-row button');
    buttons.forEach((btn) => {
        btn.addEventListener('click', () => {
            video.playbackRate = Number(btn.dataset.rate);
            buttons.forEach((b) => b.classList.remove('active'));
            btn.classList.add('active');
        });
    });
</script>
</body>
</html>
