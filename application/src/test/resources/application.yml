# ---------------------------------------------------------------------------
# Test profile — overrides main application.yml for unit / slice tests.
#
# Uses the local PostgreSQL instance (database: aihealthcaredb_test) instead
# of H2. Production runs on PostgreSQL exclusively, so tests run against the
# same engine to catch dialect-specific SQL (e.g. INSERT ... ON CONFLICT)
# that H2 doesn't support the same way.
# Disables PgVector auto-configuration (tests mock the VectorStore).
# Disables scheduling so @Scheduled methods do not fire during tests.
# ---------------------------------------------------------------------------
spring:
  application:
    name: ai-healthcare

  ai:
    anthropic:
      api-key: test-placeholder
    openai:
      api-key: test-placeholder
    vectorstore:
      pgvector:
        enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/aihealthcaredb_test
    driver-class-name: org.postgresql.Driver
    username: admin
    password: 1454
    # Small pool: Spring's test-context cache keeps several distinct
    # @DataJpaTest contexts (one per @Import'd adapter) alive at once, each
    # with its own pool — a large per-pool size exhausts Postgres's
    # max_connections across a big test run. 2 is enough for sequential tests.
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1

  # @DataJpaTest auto-replaces the configured datasource with an embedded one
  # (H2, since it's still on the classpath for the optional h2 dev profile)
  # unless told not to. This keeps @DataJpaTest on the real PostgreSQL instance
  # configured above.
  test:
    database:
      replace: none

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

  mail:
    host: localhost
    port: 1025
    username: admin
    password: 1454
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

server:
  port: 8080

logging:
  level:
    com.wgblackmon: DEBUG
    org.springframework.web: INFO

aihealthcare:
  base-url: http://localhost:8080
  prompts:
    directory: ""
  feeds:
    sources: []
  embedding:
    schedule: "0 0 0 * * *"
  notebooklm:
    directory: NotebookLMDirectory
  newsletter:
    from-address: newsletter@aihealthcare.local
    schedule: "0 0 8 * * MON"
  wiki:
    lint-cron: "0 0 0 * * *"
    staleness-threshold-days: 30
