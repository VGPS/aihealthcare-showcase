# =============================================================================
# AIHealthcare — Application Configuration
# =============================================================================

spring.application.name=ai-healthcare
server.port=8080

# -----------------------------------------------------------------------------
# Spring AI — provider keys
# Set ANTHROPIC_API_KEY / OPENAI_API_KEY as environment variables (or in .env).
# The application will start with placeholder values but AI calls will fail
# until real keys are supplied.
# -----------------------------------------------------------------------------
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:placeholder-set-ANTHROPIC_API_KEY}
spring.ai.openai.api-key=${OPENAI_API_KEY:placeholder-set-OPENAI_API_KEY}

# -----------------------------------------------------------------------------
# Logging
# DEBUG for our packages enables full entry/exit method tracing.
# Set to INFO in production to suppress tracing output.
# -----------------------------------------------------------------------------
logging.level.com.wgblackmon=DEBUG
logging.level.org.springframework.web=INFO
