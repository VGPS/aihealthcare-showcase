spring:
  application:
    name: ai-healthcare

  # ---------------------------------------------------------------------------
  # Spring AI — provider keys
  # Set ANTHROPIC_API_KEY / OPENAI_API_KEY as environment variables (or .env).
  # The application starts with placeholder values; AI calls fail until real
  # keys are supplied.
  # ---------------------------------------------------------------------------
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:placeholder-set-ANTHROPIC_API_KEY}
    openai:
      api-key: ${OPENAI_API_KEY:placeholder-set-OPENAI_API_KEY}
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1536

  # ---------------------------------------------------------------------------
  # PostgreSQL datasource
  # Requires a running PostgreSQL instance with the pgvector extension.
  # Docker:  docker run -d --name aihealthcare-postgres \
  #            -e POSTGRES_USER=admin -e POSTGRES_PASSWORD=1454 \
  #            -e POSTGRES_DB=aihealthcaredb -p 5432:5432 pgvector/pgvector:pg16
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://localhost:5432/aihealthcaredb
    driver-class-name: org.postgresql.Driver
    username: admin
    password: 1454

  # ---------------------------------------------------------------------------
  # JPA / Hibernate
  # ddl-auto: update creates/updates tables without dropping existing data.
  # defer-datasource-initialization ensures data.sql runs AFTER Hibernate DDL.
  # ---------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  # ---------------------------------------------------------------------------
  # Mail — defaults for local development (no real SMTP server required).
  # Override in application-dev.yml / application-prod.yml for actual delivery.
  # ---------------------------------------------------------------------------
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

server:
  port: 8080

# -----------------------------------------------------------------------------
# Logging
# DEBUG for our packages enables full entry/exit method tracing per CONVENTIONS.
# Set to INFO in production to suppress tracing output.
# -----------------------------------------------------------------------------
logging:
  level:
    com.wgblackmon: DEBUG
    org.springframework.web: INFO

# -----------------------------------------------------------------------------
# Feed harvesting — sources configured here in application.yml for Slice 2a.
# Each entry maps to a FeedSourceConfig record.
# -----------------------------------------------------------------------------
aihealthcare:
  # ---------------------------------------------------------------------------
  # Article query — how far back (in days) to look when fetching articles.
  # Set to 0 for no date restriction.  Change freely for experimentation.
  # ---------------------------------------------------------------------------
  articles:
    days-back: 3

  feeds:
    sources:
      # -----------------------------------------------------------------
      # ACADEMIC RSS feeds — peer-reviewed and research sources
      # -----------------------------------------------------------------
      - topic-id: 1
        name: PubMed AI Healthcare
        url: https://pubmed.ncbi.nlm.nih.gov/rss/search/1iCIuphPfzMUfIkqJ3mOSNQlFJKYJb1xPnBx7XEBOQ1haHy2hW/?limit=20&utm_campaign=pubmed-2&fc=20220101000000
        tier: ACADEMIC
        base-weight: 0.9
        max-items: 20
      - topic-id: 1
        name: PubMed Machine Learning Clinical
        url: https://pubmed.ncbi.nlm.nih.gov/rss/search/1MiuHQ7HGxZ0iqhHwJbLHqaGzKfhEKPFWiPmwM-HadPVdsBX3j/?limit=15&utm_campaign=pubmed-2&fc=20220101000000
        tier: ACADEMIC
        base-weight: 0.9
        max-items: 15
      # -----------------------------------------------------------------
      # REGULATORY RSS feeds — government and regulatory bodies
      # -----------------------------------------------------------------
      - topic-id: 1
        name: FDA Medical Devices News
        url: https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/medical-devices/rss.xml
        tier: REGULATORY
        base-weight: 0.95
        max-items: 15
      - topic-id: 1
        name: WHO News
        url: https://www.who.int/rss-feeds/news-english.xml
        tier: REGULATORY
        base-weight: 0.85
        max-items: 10
      # -----------------------------------------------------------------
      # INDUSTRY RSS feeds — trade news, broad AI healthcare coverage
      # -----------------------------------------------------------------
      - topic-id: 1
        name: Healthcare IT News
        url: https://www.healthcareitnews.com/feed
        tier: INDUSTRY
        base-weight: 0.7
        max-items: 20
      - topic-id: 1
        name: MIT Technology Review AI
        url: https://www.technologyreview.com/feed/
        tier: INDUSTRY
        base-weight: 0.75
        max-items: 15
      - topic-id: 1
        name: Google News AI Healthcare
        url: https://news.google.com/rss/search?q=artificial+intelligence+healthcare&hl=en-US&gl=US&ceid=US:en
        tier: INDUSTRY
        base-weight: 0.6
        max-items: 25
      - topic-id: 1
        name: Google News Clinical AI
        url: https://news.google.com/rss/search?q=clinical+AI+FDA+approval+medical+device&hl=en-US&gl=US&ceid=US:en
        tier: INDUSTRY
        base-weight: 0.65
        max-items: 20
      # -----------------------------------------------------------------
      # Competitor web pages — scraped daily by WebPageHarvester (Slice 5)
      # -----------------------------------------------------------------
      - topic-id: 1
        name: Anthropic Healthcare AI
        url: https://www.anthropic.com/news/healthcare-life-sciences
        tier: COMPETITOR
        base-weight: 0.7
        max-items: 1
      - topic-id: 1
        name: Anthropic Healthcare Webinar
        url: https://www.anthropic.com/webinars/claude-code-in-healthcare-how-physicians-are-building-with-claude
        tier: COMPETITOR
        base-weight: 0.7
        max-items: 1
      - topic-id: 1
        name: Perplexity Health
        url: https://www.perplexity.ai/hub/blog/introducing-perplexity-health
        tier: COMPETITOR
        base-weight: 0.6
        max-items: 1
      - topic-id: 1
        name: Google Health AI
        url: https://ai.google/health/
        tier: COMPETITOR
        base-weight: 0.7
        max-items: 1
      # -----------------------------------------------------------------
      # HuggingFace model discovery — queried daily by HuggingFaceHarvester
      # -----------------------------------------------------------------
      - topic-id: 1
        name: HuggingFace Healthcare LLMs
        url: https://huggingface.co/api/models?search=healthcare+medical&sort=downloads&direction=-1&limit=25
        tier: HUGGINGFACE
        base-weight: 0.5
        max-items: 25

  # ---------------------------------------------------------------------------
  # Embedding scheduler — cron expression for the EmbeddingScheduler job.
  # Default: daily at midnight.  Change freely without recompiling.
  # Examples:
  #   "0 0 0 * * *"   — daily at midnight
  #   "0 0 */2 * * *" — every 2 hours
  #   "0 */30 * * * *"— every 30 minutes
  # ---------------------------------------------------------------------------
  embedding:
    schedule: "0 0 0 * * *"

  # ---------------------------------------------------------------------------
  # NotebookLM export — directory where search-result text files are written.
  # Path is relative to the working directory (project root when running locally).
  # The directory is created automatically if it does not exist.
  # ---------------------------------------------------------------------------
  notebooklm:
    directory: NotebookLMDirectory
    summaries-directory: NotebookLMDirectory/summaries

  # ---------------------------------------------------------------------------
  # Newsletter delivery — from address used in outgoing emails.
  # SMTP connection settings live in the active profile (dev or prod).
  # Schedule used by Slice 3c NewsletterGenerationScheduler (every Monday 8 AM).
  # ---------------------------------------------------------------------------
  newsletter:
    from-address: newsletter@aihealthcare.local
    schedule: "0 0 8 * * MON"
