spring:
  application:
    name: ai-healthcare

  # Load .env file (KEY=VALUE format) so API keys are available as Spring
  # properties without requiring shell env vars.  'optional:' means the app
  # still starts when .env is absent (CI / prod set real env vars instead).
  # Multiple locations are tried: project root (mvn spring-boot:run) and
  # application/ subdirectory (IDE working-dir edge case).
  config:
    import: optional:file:.env[.properties],optional:file:application/.env[.properties]

  profiles:
    active: demo

  # ---------------------------------------------------------------------------
  # Spring AI — provider keys
  # Set ANTHROPIC_API_KEY / OPENAI_API_KEY as environment variables (or .env).
  # The application starts with placeholder values; AI calls fail until real
  # keys are supplied.
  # ---------------------------------------------------------------------------
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:placeholder-set-ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-sonnet-4-6
          max-tokens: 16384
    openai:
      api-key: ${OPENAI_API_KEY:placeholder-set-OPENAI_API_KEY}
    perplexity:
      api-key: ${PERPLEXITY_API_KEY:placeholder-set-PERPLEXITY_API_KEY}
    bedrock:
      aws:
        region: ${AWS_BEDROCK_REGION:us-east-1}
        access-key: ${AWS_ACCESS_KEY_ID:}
        secret-key: ${AWS_SECRET_ACCESS_KEY:}
      converse:
        chat:
          enabled: ${BEDROCK_CHAT_ENABLED:true}
          options:
            model: ${BEDROCK_MODEL_ID:amazon.nova-lite-v1:0}
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1536

  # ---------------------------------------------------------------------------
  # PostgreSQL datasource
  # Requires a running PostgreSQL instance with the pgvector extension.
  # Docker:  docker run -d --name aihealthcare-postgres \
  #            -e POSTGRES_USER=admin -e POSTGRES_PASSWORD=1454 \
  #            -e POSTGRES_DB=aihealthcaredb -p 5432:5432 pgvector/pgvector:pg16
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Caffeine cache — TTL-based in-memory cache for AI search results
  # Entries expire after 10 minutes; max 500 cached queries
  # ---------------------------------------------------------------------------
  cache:
    type: caffeine
    cache-names: ai-search
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

  datasource:
    url: jdbc:postgresql://localhost:5432/aihealthcaredb
    driver-class-name: org.postgresql.Driver
    username: admin
    password: 1454

  # ---------------------------------------------------------------------------
  # JPA / Hibernate
  # ddl-auto: update creates/updates tables without dropping existing data.
  # defer-datasource-initialization ensures data.sql runs AFTER Hibernate DDL.
  # ---------------------------------------------------------------------------
  jpa:
    open-in-view: false   # release DB connection after service layer, not after template render
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  # ---------------------------------------------------------------------------
  # Mail — defaults for local development (no real SMTP server required).
  # Override in application-dev.yml / application-prod.yml for actual delivery.
  # ---------------------------------------------------------------------------
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

  # ---------------------------------------------------------------------------
  # Multipart upload limits — Document Library accepts files up to 50 MB
  # (see DocumentLibraryController.MAX_BYTES). Spring Boot's defaults
  # (1MB file / 10MB request) are too low and cause the servlet container
  # to reject large uploads with a raw HTTP 413 before the controller's own
  # validation ever runs.
  # ---------------------------------------------------------------------------
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB

server:
  port: 8080
  error:
    include-message: always
    include-exception: true

# -----------------------------------------------------------------------------
# Logging
# DEBUG for our packages enables full entry/exit method tracing per CONVENTIONS.
# Set to INFO in production to suppress tracing output.
# -----------------------------------------------------------------------------
logging:
  file:
    name: logs/aihealthcare.log
  level:
    com.wgblackmon: DEBUG
    org.springframework.web: INFO

# -----------------------------------------------------------------------------
# springdoc — Swagger UI for self-service API documentation.
# -----------------------------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# -----------------------------------------------------------------------------
# Claude Intelligence Service — separate Spring Boot app (port 8081)
# Used by IntelligenceConsoleController to proxy admin test requests.
# -----------------------------------------------------------------------------
claude:
  intelligence:
    base-url: ${CLAUDE_INTELLIGENCE_URL:http://localhost:8081}
intelligence:
  api-key: ${INTELLIGENCE_API_KEY:}

# -----------------------------------------------------------------------------
# Feed harvesting — sources configured here in application.yml for Slice 2a.
# Each entry maps to a FeedSourceConfig record.
# -----------------------------------------------------------------------------
aihealthcare:
  # ---------------------------------------------------------------------------
  # Base URL — used for Stripe redirect URLs, wiki links, etc.
  # Override in application-aws.yml for production.
  # ---------------------------------------------------------------------------
  base-url: http://localhost:8080
  # ---------------------------------------------------------------------------
  # Article query — how far back (in days) to look when fetching articles.
  # Set to 0 for no date restriction.  Change freely for experimentation.
  #
  # 7 days matches the paid Newsletter's weekly cadence (aihealthcare.newsletter.
  # schedule) so a Monday run captures the full trailing week instead of just
  # the last 24h. Also used by the /api/v1/articles browse endpoint.
  # ---------------------------------------------------------------------------
  articles:
    days-back: 7
    max-age-days: 30

  # ---------------------------------------------------------------------------
  # Harvest scheduling — consolidated daily pipeline (all times UTC).
  #
  # Daily timeline:
  #   04:00  RSS feeds (ACADEMIC + REGULATORY tiers)
  #   04:00  Research harvest (COMBINED pipeline, 11 topics)
  #   04:00  Company discovery (daily — same time as RSS harvest)
  #   04:30  Regulatory harvest (FDA 510(k), De Novo, CMS rules)
  #   05:00  Competitor web pages (SHA-256 change detection)
  #   05:30  HuggingFace model discovery
  #   06:00  Industry feeds (first run; then every 4 hours)
  #   07:00  Embedding scheduler (vector store refresh)
  #   00:00  Newsletter draft generation (previous day's news, DRAFT only)
  #
  # All cron expressions use Spring 6-field format: second minute hour day month weekday
  # ---------------------------------------------------------------------------
  harvest:
    daily-cron: "0 0 4 * * *"
    industry-rate-ms: "14400000"
    competitor-cron: "0 0 5 * * *"
    huggingface-cron: "0 30 5 * * *"
    company-discovery-cron: "0 0 4 * * *"

  # ---------------------------------------------------------------------------
  # Perplexity-powered company discovery pipeline — discovers AI healthcare
  # companies via Perplexity API, extracts structured fields, cross-validates
  # against curated lists (CB Insights, Rock Health), persists to DB.
  # Schedule: weekly Sunday 06:00 UTC. Uses same PERPLEXITY_API_KEY.
  # ---------------------------------------------------------------------------
  company-discovery:
    schedule: "0 0 6 * * SUN"
    discovery-model: sonar-pro
    extraction-model: sonar-pro
    max-companies-per-run: 30

  # ---------------------------------------------------------------------------
  # Wiki linter — automated quality checks on the knowledge base.
  # Runs after compilation to detect orphans, broken refs, stale pages, etc.
  # ---------------------------------------------------------------------------
  wiki:
    lint-cron: "0 0 8 * * *"
    staleness-threshold-days: 30

  # ---------------------------------------------------------------------------
  # Document Library — browser-uploaded files are saved here before ingestion.
  # Override in application-aws.yml to use a persistent EBS path on EC2.
  # ---------------------------------------------------------------------------
  documents:
    upload-dir: ${DOCUMENTS_UPLOAD_DIR:/tmp/aihealthcare-documents}

  # ---------------------------------------------------------------------------
  # Market Analysis — daily AI-healthcare market digest pipeline.
  # Fires at 07:00 America/Chicago (zone is set in @Scheduled annotation).
  # ---------------------------------------------------------------------------
  market-analysis:
    schedule: "0 0 7 * * *"
    notify-address: "${MARKET_DIGEST_NOTIFY_ADDRESS:newsletter@bigskylabs.ai}"
    dedup:
      similarity-threshold: 0.93
    reaction:
      schedule: "0 0 * * * *"

  # Trend Detection — weekly keyword frequency analysis across rolling windows.
  # Schedule default: Sunday 08:00 UTC (after wiki lint completes).
  # ---------------------------------------------------------------------------
  trends:
    schedule: "0 0 8 ? * SUN"
    min-occurrences: 3
    rising-limit: 20

  # ---------------------------------------------------------------------------
  # Legal Trend Detection — weekly trend analysis for legal/regulatory/policy
  # articles. Schedule default: Sunday 09:00 UTC (1h after general trends).
  # ---------------------------------------------------------------------------
  legal-trends:
    schedule: "0 0 9 ? * SUN"
    max-topics: 15

  # ---------------------------------------------------------------------------
  # Tech Trend Scoring — LLM-based article significance scoring for trends.
  # Adds quality signal to keyword frequency analysis.
  # ---------------------------------------------------------------------------
  tech-trends:
    scoring-enabled: true
    score-threshold: 7
    max-articles-per-keyword: 5

  # ---------------------------------------------------------------------------
  # Perplexity Deep Research — async Sonar Deep Research API for analyst-grade
  # trend summaries. Uses the same PERPLEXITY_API_KEY as the search adapter.
  # Cost control: max-summaries-per-run caps how many keywords get deep-researched
  # per trend detection run (~$3-5 per summary, so 5 = ~$15-25/month on weekly runs).
  # ---------------------------------------------------------------------------
  deep-research:
    max-summaries-per-run: 5
    poll-interval-ms: 5000
    poll-timeout-ms: 300000

  # ---------------------------------------------------------------------------
  # Legislation Source Monitor — weekly source-freshness check for all law
  # source URLs. Re-fetches each URL, computes SHA-256 hash, records change
  # events when content drifts.
  # Schedule default: Monday 10:30 UTC (5:30 AM Chicago).
  # ---------------------------------------------------------------------------
  legislation:
    source-check-schedule: "0 30 10 * * MON"

  # ---------------------------------------------------------------------------
  # Regulatory Alert System — FDA 510(k), De Novo, CMS rule monitoring.
  # Schedule default: daily 04:30 UTC (after RSS feeds, before competitors).
  # ---------------------------------------------------------------------------
  regulatory:
    enabled: true
    schedule: "0 30 4 * * *"
    lookback-days: 365
    ai-keywords:
      - "artificial intelligence"
      - "machine learning"
      - "SaMD"
      - "software as medical device"
      - "clinical decision support"
      - "CADe"
      - "CADx"
      - "algorithm"
      - "deep learning"
      - "neural network"
      - "AI"
      - "computer-aided"
      - "computer aided"
      - "automated detection"
      - "predictive"
      - "diagnostic software"

  # ---------------------------------------------------------------------------
  # Clinical Trial Integration — ClinicalTrials.gov v2 API harvesting.
  # Schedule default: daily 05:00 UTC (after regulatory harvest).
  # ---------------------------------------------------------------------------
  clinical-trials:
    enabled: true
    schedule: "0 0 5 * * *"
    lookback-days: 7
    max-results: 100
    ai-keywords:
      - "artificial intelligence"
      - "machine learning"
      - "deep learning"
      - "neural network"
      - "clinical decision support"
      - "SaMD"
      - "software as medical device"
      - "algorithm"
      - "computer-aided"
      - "natural language processing"

  # ---------------------------------------------------------------------------
  # Research pipeline — controls which pipeline branch POST /api/v1/research uses.
  # LEGACY_GOOGLE:   fetch from ingestion DB only (no API keys required, always safe).
  # STAGED_RESEARCH: AI planning + Perplexity retrieval + AI synthesis.
  # COMBINED:        both DB (historical depth) + Perplexity (current) merged before synthesis.
  # Switch to STAGED_RESEARCH or COMBINED once PERPLEXITY_API_KEY is configured.
  # ---------------------------------------------------------------------------
  research:
    mode: COMBINED
    harvest:
      # -----------------------------------------------------------------------
      # Cron schedule for proactive topic research (default: 04:00 UTC daily).
      # Runs in parallel with RSS daily harvest — different sources, no conflict.
      # Standard Spring cron format: second minute hour day month weekday
      # -----------------------------------------------------------------------
      cron: "0 0 4 * * *"
      # Maximum Perplexity + DB sources retrieved per topic per run.
      max-sources-per-topic: 20
      # -----------------------------------------------------------------------
      # Topics harvested automatically on every scheduled run.
      # Add, remove, or reorder entries here — no code changes required.
      # -----------------------------------------------------------------------
