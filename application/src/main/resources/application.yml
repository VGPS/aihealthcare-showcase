spring:
  application:
    name: ai-healthcare

  # Load .env file from project root (KEY=VALUE format) so API keys are available
  # as Spring properties without requiring shell env vars.  'optional:' means the
  # app still starts when .env is absent (CI / prod set real env vars instead).
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: demo

  # ---------------------------------------------------------------------------
  # Spring AI — provider keys
  # Set ANTHROPIC_API_KEY / OPENAI_API_KEY as environment variables (or .env).
  # The application starts with placeholder values; AI calls fail until real
  # keys are supplied.
  # ---------------------------------------------------------------------------
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:placeholder-set-ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-sonnet-4-6
    openai:
      api-key: ${OPENAI_API_KEY:placeholder-set-OPENAI_API_KEY}
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1536

  # ---------------------------------------------------------------------------
  # PostgreSQL datasource
  # Requires a running PostgreSQL instance with the pgvector extension.
  # Docker:  docker run -d --name aihealthcare-postgres \
  #            -e POSTGRES_USER=admin -e POSTGRES_PASSWORD=1454 \
  #            -e POSTGRES_DB=aihealthcaredb -p 5432:5432 pgvector/pgvector:pg16
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://localhost:5432/aihealthcaredb
    driver-class-name: org.postgresql.Driver
    username: admin
    password: 1454

  # ---------------------------------------------------------------------------
  # JPA / Hibernate
  # ddl-auto: update creates/updates tables without dropping existing data.
  # defer-datasource-initialization ensures data.sql runs AFTER Hibernate DDL.
  # ---------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  # ---------------------------------------------------------------------------
  # Mail — defaults for local development (no real SMTP server required).
  # Override in application-dev.yml / application-prod.yml for actual delivery.
  # ---------------------------------------------------------------------------
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

server:
  port: 8080

# -----------------------------------------------------------------------------
# Logging
# DEBUG for our packages enables full entry/exit method tracing per CONVENTIONS.
# Set to INFO in production to suppress tracing output.
# -----------------------------------------------------------------------------
logging:
  level:
    com.wgblackmon: DEBUG
    org.springframework.web: INFO

# -----------------------------------------------------------------------------
# Feed harvesting — sources configured here in application.yml for Slice 2a.
# Each entry maps to a FeedSourceConfig record.
# -----------------------------------------------------------------------------
aihealthcare:
  # ---------------------------------------------------------------------------
  # Article query — how far back (in days) to look when fetching articles.
  # Set to 0 for no date restriction.  Change freely for experimentation.
  # ---------------------------------------------------------------------------
  articles:
    days-back: 3

  # ---------------------------------------------------------------------------
  # Research pipeline — controls which pipeline branch POST /api/v1/research uses.
  # LEGACY_GOOGLE:   fetch from ingestion DB only (no API keys required, always safe).
  # STAGED_RESEARCH: AI planning + Perplexity retrieval + AI synthesis.
  # COMBINED:        both DB (historical depth) + Perplexity (current) merged before synthesis.
  # Switch to STAGED_RESEARCH or COMBINED once PERPLEXITY_API_KEY is configured.
  # ---------------------------------------------------------------------------
  research:
    mode: COMBINED
    harvest:
      # -----------------------------------------------------------------------
      # Cron schedule for proactive topic research (default: 06:00 UTC daily).
      # Standard Spring cron format: second minute hour day month weekday
      # -----------------------------------------------------------------------
      cron: "0 0 6 * * *"
      # Maximum Perplexity + DB sources retrieved per topic per run.
      max-sources-per-topic: 20
      # -----------------------------------------------------------------------
      # Topics harvested automatically on every scheduled run.
      # Add, remove, or reorder entries here — no code changes required.
      # -----------------------------------------------------------------------
      topics:
        - "General AI Healthcare News"
        - "AI Healthcare Software Development"
        - "Healthcare Outsourcing and Jobs Layoffs"
        - "AI Healthcare Government Policy"
        - "AI Healthcare Legal"
        - "OpenAI Healthcare"
        - "Anthropic Healthcare"
        - "Perplexity Healthcare"
        - "Google Healthcare"
        - "Beckers Hospital Review"

  # ---------------------------------------------------------------------------
  # News listing — ordered topic headers shown on GET /dashboard/news.
  # Each name must match a feed source 'name' so articles group under it.
  # ---------------------------------------------------------------------------
  news:
    topics:
      - "General AI Healthcare News"
      - "AI Healthcare Software Development"
      - "Healthcare Outsourcing and Jobs Layoffs"
      - "AI Healthcare Government Policy"
      - "AI Healthcare Legal"
      - "OpenAI Healthcare"
      - "Anthropic Healthcare"
      - "Perplexity Healthcare"
      - "Google Healthcare"
      - "Beckers Hospital Review"

  feeds:
    sources:
      # -----------------------------------------------------------------
      # General AI Healthcare News — broad coverage from multiple feeds
      # 'topic' groups articles under a section header on /dashboard/news.
      # 'name' identifies the individual feed source in logs and metrics.
      # -----------------------------------------------------------------
      - topic-id: 1
        name: PubMed AI Healthcare
        topic: General AI Healthcare News
        url: https://pubmed.ncbi.nlm.nih.gov/rss/search/1iCIuphPfzMUfIkqJ3mOSNQlFJKYJb1xPnBx7XEBOQ1haHy2hW/?limit=20&utm_campaign=pubmed-2&fc=20220101000000
        tier: ACADEMIC
        base-weight: 0.9
        max-items: 20
      - topic-id: 1
        name: PubMed Machine Learning Clinical
        topic: General AI Healthcare News
        url: https://pubmed.ncbi.nlm.nih.gov/rss/search/1MiuHQ7HGxZ0iqhHwJbLHqaGzKfhEKPFWiPmwM-HadPVdsBX3j/?limit=15&utm_campaign=pubmed-2&fc=20220101000000
        tier: ACADEMIC
        base-weight: 0.9
        max-items: 15
      - topic-id: 1
        name: Healthcare IT News
        topic: General AI Healthcare News
        url: https://www.healthcareitnews.com/feed
        tier: INDUSTRY
        base-weight: 0.7
        max-items: 20
      - topic-id: 1
        name: MIT Technology Review AI
        topic: General AI Healthcare News
        url: https://www.technologyreview.com/feed/
        tier: INDUSTRY
        base-weight: 0.75
        max-items: 15
      - topic-id: 1
        name: Google News AI Healthcare
        topic: General AI Healthcare News
        url: https://news.google.com/rss/search?q=artificial+intelligence+healthcare&hl=en-US&gl=US&ceid=US:en
        tier: INDUSTRY
        base-weight: 0.6
        max-items: 25
      # -----------------------------------------------------------------
      # AI Healthcare Software Development
      # -----------------------------------------------------------------
      - topic-id: 1
        name: Google News AI Software Dev
        topic: AI Healthcare Software Development
        url: https://news.google.com/rss/search?q=AI+healthcare+software+development+EHR+FHIR&hl=en-US&gl=US&ceid=US:en
        tier: INDUSTRY
        base-weight: 0.65
        max-items: 20
      # -----------------------------------------------------------------
      # Healthcare Outsourcing and Jobs Layoffs
      # -----------------------------------------------------------------
      - topic-id: 1
        name: Google News Healthcare Outsourcing
        topic: Healthcare Outsourcing and Jobs Layoffs
        url: https://news.google.com/rss/search?q=healthcare+AI+outsourcing+jobs+layoffs&hl=en-US&gl=US&ceid=US:en
        tier: INDUSTRY
        base-weight: 0.6
        max-items: 20
      # -----------------------------------------------------------------
      # AI Healthcare Government Policy
      # -----------------------------------------------------------------
      - topic-id: 1
        name: FDA Medical Devices News
        topic: AI Healthcare Government Policy
        url: https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/medical-devices/rss.xml
        tier: REGULATORY
        base-weight: 0.95
        max-items: 15
      - topic-id: 1
        name: WHO News
        topic: AI Healthcare Government Policy
        url: https://www.who.int/rss-feeds/news-english.xml
        tier: REGULATORY
        base-weight: 0.85
        max-items: 10
      - topic-id: 1
        name: Google News Clinical AI Policy
        topic: AI Healthcare Government Policy
        url: https://news.google.com/rss/search?q=clinical+AI+FDA+approval+medical+device&hl=en-US&gl=US&ceid=US:en
        tier: INDUSTRY
        base-weight: 0.65
        max-items: 20
      # -----------------------------------------------------------------
      # OpenAI Healthcare
      # -----------------------------------------------------------------
      - topic-id: 1
        name: Google News OpenAI Healthcare
        topic: OpenAI Healthcare
        url: https://news.google.com/rss/search?q=OpenAI+healthcare+GPT+medical&hl=en-US&gl=US&ceid=US:en
        tier: INDUSTRY
        base-weight: 0.65
        max-items: 20
      # -----------------------------------------------------------------
      # Anthropic Healthcare
      # -----------------------------------------------------------------
      - topic-id: 1
        name: Anthropic Healthcare AI
        topic: Anthropic Healthcare
        url: https://www.anthropic.com/news/healthcare-life-sciences
        tier: COMPETITOR
        base-weight: 0.7
        max-items: 1
      # -----------------------------------------------------------------
      # Perplexity Healthcare
      # -----------------------------------------------------------------
      - topic-id: 1
        name: Perplexity Health Blog
        topic: Perplexity Healthcare
        url: https://www.perplexity.ai/hub/blog/introducing-perplexity-health
        tier: COMPETITOR
        base-weight: 0.6
        max-items: 1
      - topic-id: 1
        name: Perplexity Sonar API
        topic: Perplexity Healthcare
        url: https://api.perplexity.ai/chat/completions
        tier: PERPLEXITY
        base-weight: 0.85
        max-items: 20
      # -----------------------------------------------------------------
      # Google Healthcare
      # -----------------------------------------------------------------
      - topic-id: 1
        name: Google Health AI
        topic: Google Healthcare
        url: https://ai.google/health/
        tier: COMPETITOR
        base-weight: 0.7
        max-items: 1
      # -----------------------------------------------------------------
      # Beckers Hospital Review
      # -----------------------------------------------------------------
      - topic-id: 1
        name: Beckers Hospital Review
        topic: Beckers Hospital Review
        url: https://www.beckershospitalreview.com/feed/
        tier: INDUSTRY
        base-weight: 0.7
        max-items: 25
      # -----------------------------------------------------------------
      # AI Healthcare Legal — liability, malpractice, IP, compliance law
      # -----------------------------------------------------------------
      - topic-id: 1
        name: Google News AI Healthcare Legal
        topic: AI Healthcare Legal
        url: https://news.google.com/rss/search?q=AI+healthcare+legal+liability+malpractice+lawsuit&hl=en-US&gl=US&ceid=US:en
        tier: INDUSTRY
        base-weight: 0.7
        max-items: 20
      - topic-id: 1
        name: Google News AI Medical Device Regulation
        topic: AI Healthcare Legal
        url: https://news.google.com/rss/search?q=AI+medical+device+regulation+compliance+HIPAA&hl=en-US&gl=US&ceid=US:en
        tier: INDUSTRY
        base-weight: 0.7
        max-items: 20
      # -----------------------------------------------------------------
      # HuggingFace model discovery
      # -----------------------------------------------------------------
      - topic-id: 1
        name: HuggingFace Healthcare LLMs
        topic: General AI Healthcare News
        url: https://huggingface.co/api/models?search=healthcare+medical&sort=downloads&direction=-1&limit=25
        tier: HUGGINGFACE
        base-weight: 0.5
        max-items: 25

  # ---------------------------------------------------------------------------
  # Perplexity Sonar API — used by PerplexityHarvester.
  # Set PERPLEXITY_API_KEY as an environment variable to enable harvesting.
  # When the key is absent the harvester logs a warning and returns no articles.
  # ---------------------------------------------------------------------------
  perplexity:
    api-key: ${PERPLEXITY_API_KEY:}

  # ---------------------------------------------------------------------------
  # Embedding scheduler — cron expression for the EmbeddingScheduler job.
  # Default: daily at midnight.  Change freely without recompiling.
  # Examples:
  #   "0 0 0 * * *"   — daily at midnight
  #   "0 0 */2 * * *" — every 2 hours
  #   "0 */30 * * * *"— every 30 minutes
  # ---------------------------------------------------------------------------
  embedding:
    schedule: "0 0 0 * * *"

  # ---------------------------------------------------------------------------
  # NotebookLM export — directory where search-result text files are written.
  # Path is relative to the working directory (project root when running locally).
  # The directory is created automatically if it does not exist.
  # ---------------------------------------------------------------------------
  prompts:
    # External directory for prompt template files. When set, templates are loaded
    # from here first; classpath /prompts/ is used as fallback.
    # Leave empty to always use the packaged classpath templates.
    directory: ""

  notebooklm:
    directory: NotebookLMDirectory
    summaries-directory: NotebookLMDirectory/summaries
    # Comma-separated list of source names in desired display order for the HTML summary.
    # Sources not listed here appear alphabetically after the configured ones.
    source-order: "Google News AI Healthcare,Google News Clinical AI,MIT Technology Review AI"

  # ---------------------------------------------------------------------------
  # Market Intelligence — monthly competitive landscape report generation.
  # schedule: cron expression for MarketIntelligenceScheduler (1st of month, 8am).
  # On-demand trigger: POST /api/v1/market-intelligence/refresh
  # Edit the prompt: PUT /api/v1/search-prompts/MARKET_INTELLIGENCE
  # ---------------------------------------------------------------------------
  market-intelligence:
    schedule: "0 0 8 1 * *"

  # ---------------------------------------------------------------------------
  # Newsletter delivery — from address used in outgoing emails.
  # SMTP connection settings live in the active profile (dev or prod).
  # Schedule used by Slice 3c NewsletterGenerationScheduler (every Monday 8 AM).
  # ---------------------------------------------------------------------------
  newsletter:
    from-address: newsletter@aihealthcare.local
    schedule: "0 0 8 * * MON"
