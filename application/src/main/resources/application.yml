      model: ${PERPLEXITY_MARKET_NEWS_MODEL:sonar}

  # ---------------------------------------------------------------------------
  # Alpaca Markets Data API — used by AlpacaMarketDataAdapter for real-time
  # stock quotes and OHLCV price history.
  # Set ALPACA_API_KEY and ALPACA_SECRET_KEY as environment variables.
  # When absent the adapter returns Optional.empty() for all tickers.
  # ---------------------------------------------------------------------------
  alpaca:
    api-key: ${ALPACA_API_KEY_ID:}
    secret-key: ${ALPACA_API_SECRET_KEY:}
    tracked-tickers: ${ALPACA_TRACKED_TICKERS:DOCS,AMWL,EVH,NVCR,ASTH,HIMS,OMCL,PHR}

  # ---------------------------------------------------------------------------
  # Google Gemini API — used by GeminiAiSearchAdapter for AI-enhanced search.
  # Set GEMINI_API_KEY as an environment variable to enable Gemini synthesis.
  # When the key is absent the adapter logs a warning and returns a fallback.
  # ---------------------------------------------------------------------------
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL_ID:gemini-3.5-flash}

  # ---------------------------------------------------------------------------
  # Admin notification — email address for system alerts (model failures, etc.).
  # ---------------------------------------------------------------------------
  admin:
    email: ${ADMIN_EMAIL:admin@aihealthcare.local}

  # ---------------------------------------------------------------------------
  # AWS Bedrock — used by AwsBedrockAiSearchAdapter for AI-enhanced search.
  # Uses standard AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY env vars.
  # Set BEDROCK_CHAT_ENABLED=false to disable Bedrock synthesis.
  # ---------------------------------------------------------------------------
  aws:
    bedrock:
      enabled: ${BEDROCK_CHAT_ENABLED:true}

  # ---------------------------------------------------------------------------
  # PubMed Backfill — historical article harvesting via E-utilities API.
  # No API key needed (rate-limited to 3 req/sec).
  # Trigger manually: POST /monitoring/backfill
  # Custom query:     POST /monitoring/backfill/custom?query=...
  # ---------------------------------------------------------------------------
  backfill:
    from-year: 2022
    to-year: 2026
    max-per-query: 50
    queries:
      - "\"artificial intelligence\" AND \"healthcare\" AND \"legal liability\""
      - "\"artificial intelligence\" AND \"medical device\" AND \"regulation\""
      - "\"AI\" AND \"healthcare\" AND \"malpractice\""
      - "\"machine learning\" AND \"clinical decision\" AND \"liability\""
      - "\"artificial intelligence\" AND \"HIPAA\" AND \"compliance\""
      - "\"AI\" AND \"healthcare\" AND \"FDA\" AND \"approval\""
      - "\"artificial intelligence\" AND \"drug discovery\""
      - "\"AI\" AND \"healthcare\" AND \"bias\" AND \"fairness\""
      - "\"large language model\" AND \"healthcare\""
      - "\"artificial intelligence\" AND \"radiology\" AND \"diagnosis\""
      - "\"Generative Artificial Intelligence\"[MeSH]"

  # ---------------------------------------------------------------------------
  # Embedding scheduler — cron expression for the EmbeddingScheduler job.
  # Default: 07:00 UTC daily — runs AFTER all harvesters complete (04:00-06:00).
  # Examples:
  #   "0 0 7 * * *"   — daily at 07:00 UTC (default)
  #   "0 0 */2 * * *" — every 2 hours
  #   "0 */30 * * * *"— every 30 minutes
  # ---------------------------------------------------------------------------
  embedding:
    schedule: "0 0 7 * * *"

  # ---------------------------------------------------------------------------
  # NotebookLM export — directory where search-result text files are written.
  # Path is relative to the working directory (project root when running locally).
  # The directory is created automatically if it does not exist.
  # ---------------------------------------------------------------------------
  prompts:
    # External directory for prompt template files. When set, templates are loaded
    # from here first; classpath /prompts/ is used as fallback.
    # Leave empty to always use the packaged classpath templates.
    directory: ""

  notebooklm:
    directory: NotebookLMDirectory
    summaries-directory: NotebookLMDirectory/summaries
    # Comma-separated list of source names in desired display order for the HTML summary.
    # Sources not listed here appear alphabetically after the configured ones.
    source-order: "Google News AI Healthcare,Google News Clinical AI,MIT Technology Review AI"

  # ---------------------------------------------------------------------------
  # Newsletter delivery — from address used in outgoing emails.
  # SMTP connection settings live in the active profile (dev or prod).
  #
  # Schedule: weekly, Monday 08:00 UTC. Ingests the full 19-topic feed pool
  # (see aihealthcare.news.topics) over the trailing week, generates a DRAFT,
  # and auto-sends to ENTERPRISE/SUBSCRIBER/DEMO tiers unless overridden via
  # the "Override Auto Send Today" checkbox at /newsletter/runs.
  #
  # The FREE-tier daily digest is a separate pipeline — see aihealthcare.digest
  # below — decoupled so its daily cadence doesn't depend on this schedule.
  # ---------------------------------------------------------------------------
  newsletter:
    from-address: newsletter@aihealthcare.local
    schedule: "0 0 8 * * MON"

  # ---------------------------------------------------------------------------
  # FREE-tier daily digest — independent schedule from the paid newsletter above.
  # Schedule: daily at midnight UTC (unchanged from the digest's prior timing).
  # ---------------------------------------------------------------------------
  digest:
    schedule: "0 0 0 * * *"

  # ---------------------------------------------------------------------------
  # Personalized Daily Briefing — per-subscriber morning email.
  # Schedule: daily at 07:30 UTC — runs AFTER the main harvest pipeline
  # and AFTER the newsletter generation (midnight) and embedding (07:00).
  # lookback-hours: how far back to look for new matches and notes.
  # ---------------------------------------------------------------------------
  briefing:
    schedule: "0 30 7 * * *"
    lookback-hours: 24

  # ---------------------------------------------------------------------------
  # Stripe Billing — paid subscription management.
  # Set STRIPE_API_KEY and STRIPE_WEBHOOK_SECRET env vars.
  # In test mode, use Stripe test-mode keys (sk_test_... / whsec_test_...).
  # Stripe CLI: stripe listen --forward-to localhost:8080/api/v1/stripe/webhook
  # ---------------------------------------------------------------------------
  stripe:
    api-key: ${STRIPE_API_KEY:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    subscriber-price-id: ${STRIPE_SUBSCRIBER_PRICE_ID:}

  # ---------------------------------------------------------------------------
  # Subscription tier feature limits.
  # archive-days: 0 = unlimited archive access.
  # monthly-query-limit: max AI research queries per calendar month.
  # ---------------------------------------------------------------------------
  tiers:
    demo:
      archive-days: 0
      monthly-query-limit: 200
    free-pending:
      archive-days: 0
      monthly-query-limit: 0
    free:
      archive-days: 7
      monthly-query-limit: 15
    subscriber:
      archive-days: 0
      monthly-query-limit: 200
    enterprise:
      archive-days: 0
      monthly-query-limit: 2000

  # ---------------------------------------------------------------------------
  # Enterprise API rate limiting.
  # ---------------------------------------------------------------------------
  api:
    rate-limit-per-minute: 60

  # ---------------------------------------------------------------------------
  # Healthcare Framework Competitive Analysis — companies to track.
  # Adding a new company here is all that's needed — zero code changes.
  # Topics map to feed topic names in the article corpus.
  # ---------------------------------------------------------------------------
  frameworks:
    companies:
      - slug: anthropic
        name: Anthropic
        url: https://www.anthropic.com
        topics:
          - Anthropic Healthcare
      - slug: openai
        name: OpenAI
        url: https://openai.com
        topics:
          - OpenAI Healthcare
      - slug: google
        name: Google
        url: https://health.google
        topics:
          - Google Healthcare
      - slug: amazon-web-services
        name: Amazon Web Services
        url: https://aws.amazon.com/health/
        topics:
          - Amazon Connect Health

  # ---------------------------------------------------------------------------
  # Ingestion — domain denylist for WebPageHarvester robots.txt gate.
  # Domains listed here are blocked regardless of their robots.txt content.
  # ---------------------------------------------------------------------------
  ingestion:
    domain-denylist: []
