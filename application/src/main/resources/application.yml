  # ---------------------------------------------------------------------------
  # Perplexity Sonar API — used by PerplexityHarvester.
  # Set PERPLEXITY_API_KEY as an environment variable to enable harvesting.
  # When the key is absent the harvester logs a warning and returns no articles.
  # ---------------------------------------------------------------------------
  perplexity:
    api-key: ${PERPLEXITY_API_KEY:}

  # ---------------------------------------------------------------------------
  # Embedding scheduler — cron expression for the EmbeddingScheduler job.
  # Default: 07:00 UTC daily — runs AFTER all harvesters complete (04:00-06:00).
  # Examples:
  #   "0 0 7 * * *"   — daily at 07:00 UTC (default)
  #   "0 0 */2 * * *" — every 2 hours
  #   "0 */30 * * * *"— every 30 minutes
  # ---------------------------------------------------------------------------
  embedding:
    schedule: "0 0 7 * * *"

  # ---------------------------------------------------------------------------
  # NotebookLM export — directory where search-result text files are written.
  # Path is relative to the working directory (project root when running locally).
  # The directory is created automatically if it does not exist.
  # ---------------------------------------------------------------------------
  prompts:
    # External directory for prompt template files. When set, templates are loaded
    # from here first; classpath /prompts/ is used as fallback.
    # Leave empty to always use the packaged classpath templates.
    directory: ""

  notebooklm:
    directory: NotebookLMDirectory
    summaries-directory: NotebookLMDirectory/summaries
    # Comma-separated list of source names in desired display order for the HTML summary.
    # Sources not listed here appear alphabetically after the configured ones.
    source-order: "Google News AI Healthcare,Google News Clinical AI,MIT Technology Review AI"

  # ---------------------------------------------------------------------------
  # Market Intelligence — monthly competitive landscape report generation.
  # schedule: cron expression for MarketIntelligenceScheduler (1st of month, 8am).
  # On-demand trigger: POST /api/v1/market-intelligence/refresh
  # Edit the prompt: PUT /api/v1/search-prompts/MARKET_INTELLIGENCE
  # ---------------------------------------------------------------------------
  market-intelligence:
    schedule: "0 0 8 1 * *"

  # ---------------------------------------------------------------------------
  # Newsletter delivery — from address used in outgoing emails.
  # SMTP connection settings live in the active profile (dev or prod).
  #
  # Schedule: daily at midnight UTC.  The scheduler generates a DRAFT newsletter
  # from the previous day's articles but does NOT auto-send.  Review and edit
  # at /newsletter/runs/{runId}/edit (TinyMCE), then click Send when ready.
  # ---------------------------------------------------------------------------
  newsletter:
    from-address: newsletter@aihealthcare.local
    schedule: "0 0 0 * * *"

  # ---------------------------------------------------------------------------
  # Stripe Billing — paid subscription management.
  # Set STRIPE_API_KEY and STRIPE_WEBHOOK_SECRET env vars.
  # In test mode, use Stripe test-mode keys (sk_test_... / whsec_test_...).
  # Stripe CLI: stripe listen --forward-to localhost:8080/api/v1/stripe/webhook
  # ---------------------------------------------------------------------------
  stripe:
    api-key: ${STRIPE_API_KEY:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    member-price-id: ${STRIPE_MEMBER_PRICE_ID:}

  # ---------------------------------------------------------------------------
  # Subscription tier feature limits.
  # archive-days: 0 = unlimited archive access.
  # monthly-query-limit: max AI research queries per calendar month.
  # ---------------------------------------------------------------------------
  tiers:
    free:
      archive-days: 7
      monthly-query-limit: 15
