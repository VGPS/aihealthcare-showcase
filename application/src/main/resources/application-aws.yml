# ---------------------------------------------------------------------------
# AWS production profile — overrides datasource, mail, and logging.
#
# Activated via: --spring.profiles.active=aws
#
# All other config (feeds, schedulers, API keys, Stripe, tier limits) is
# inherited from the base application.yml + environment variables loaded
# from /opt/aihealthcare/.env via spring.config.import.
#
# The 'demo' profile's StartupDemoRunner (full harvest on every boot) is
# NOT activated — the aws profile relies on cron-based schedulers instead.
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/aihealthcaredb
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 50        # match max VU count — 50 VUs each need 1 connection simultaneously
      minimum-idle: 10             # keep 10 warm; down from 5 to absorb concurrent burst without spin-up
      connection-timeout: 10000    # ms — fail fast (10s) rather than blocking 50 threads for 30s each
      idle-timeout: 600000         # 10 min idle before closing a spare connection
      max-lifetime: 1800000        # 30 min — rotate before RDS server-side 8h timeout kills it

  jpa:
    open-in-view: false   # release DB connection after service layer, not after template render
    hibernate:
      ddl-auto: update

  ai:
    vectorstore:
      pgvector:
        initialize-schema: false

  mail:
    host: email-smtp.us-east-1.amazonaws.com
    port: 587
    username: ${SES_USERNAME}
    password: ${SES_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

server:
  tomcat:
    threads:
      max: 200      # Spring Boot default; explicit so load tests don't surprise you
      min-spare: 20 # keep 20 warm to absorb burst traffic without spin-up latency
    connection-timeout: 30000 # ms — drop connections that stall at the TCP layer
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax
        http-only: true

aihealthcare:
  base-url: https://app.bigskylabs.ai
  startup:
    harvest-enabled: false
  newsletter:
    from-address: ${NEWSLETTER_FROM_ADDRESS:noreply@health.bigskylabs.ai}
  documents:
    upload-dir: /opt/aihealthcare/documents
  enterprise:
    data:
      artifact-directory: /var/lib/aihealthcare/data-exports
      log-directory: /var/lib/aihealthcare/data-exports/logs

logging:
  level:
    com.wgblackmon: INFO
    # Adapter-level DEBUG for diagnosing pipeline deserialization and external API calls
    com.wgblackmon.aihealthcare.infrastructure.persistence.TrendSnapshotAdapter: DEBUG
    com.wgblackmon.aihealthcare.infrastructure.ai.PerplexityDeepResearchAdapter: DEBUG
    com.wgblackmon.aihealthcare.infrastructure.ai.DealClassificationAdapter: DEBUG
