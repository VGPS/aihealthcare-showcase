# ---------------------------------------------------------------------------
# H2 profile — overrides PostgreSQL datasource for local testing without Docker.
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: jdbc:h2:mem:aihealthcaredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:sk-ant-placeholder-not-used}
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder-not-used}
    vectorstore:
      pgvector:
        enabled: false

  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
