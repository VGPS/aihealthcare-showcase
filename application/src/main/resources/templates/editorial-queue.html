<!DOCTYPE html>
<!--
/**
 * Admin editorial queue — plan, filter, and advance healthcare AI editorial items.
 *
 * @author  Bill Blackmon
 * @version 1.0
 * @since   2026-10-01
 * @updated 2026-10-01
 */
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Editorial Queue')}">
</head>
<body class="bg-surface font-sans text-on-surface">

<header class="bg-primary-600 text-white px-6 py-4 shadow-md">
    <h1 class="font-display text-2xl font-bold tracking-tight">Editorial Queue</h1>
    <p class="text-primary-200 text-sm mt-0.5">Healthcare AI content pipeline — Oct–Dec 2026</p>
</header>

<nav th:replace="~{fragments/nav :: nav('admin')}"></nav>

<main class="max-w-7xl mx-auto px-4 py-6">

    <!-- Next up banner -->
    <div th:if="${nextItem}" class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6 flex items-start gap-4">
        <span class="text-blue-600 font-bold text-sm mt-0.5 whitespace-nowrap">NEXT UP</span>
        <div>
            <p class="font-semibold text-blue-900" th:text="${nextItem.title()}">Title</p>
            <p class="text-sm text-blue-700 mt-0.5" th:text="${nextItem.hook()}">Hook</p>
            <div class="flex gap-2 mt-2">
                <span class="inline-block bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded font-semibold"
                      th:text="${nextItem.priorityTier()}">P0</span>
                <span class="inline-block bg-gray-100 text-gray-700 text-xs px-2 py-0.5 rounded"
                      th:text="${nextItem.effort()}">M</span>
                <span class="text-xs text-gray-500 self-center"
                      th:text="${nextItem.preferredDate()}">date</span>
            </div>
        </div>
    </div>

    <!-- Filter bar -->
    <form method="get" action="/admin/editorial" class="flex flex-wrap gap-3 mb-5 items-center">
        <span class="text-sm text-gray-600 font-medium">Filter:</span>

        <!-- Priority -->
        <select name="priority" class="text-sm border rounded px-2 py-1">
            <option value="">All priorities</option>
            <option value="P0" th:selected="${filterPriority == 'P0'}">P0 — Immediate</option>
            <option value="P1" th:selected="${filterPriority == 'P1'}">P1 — Strategic</option>
            <option value="P2" th:selected="${filterPriority == 'P2'}">P2 — Evergreen</option>
        </select>

        <!-- Demand signal -->
        <select name="signal" class="text-sm border rounded px-2 py-1">
            <option value="">All signals</option>
            <option value="HOT" th:selected="${filterSignal == 'HOT'}">Hot</option>
            <option value="STEADY" th:selected="${filterSignal == 'STEADY'}">Steady</option>
            <option value="EVERGREEN" th:selected="${filterSignal == 'EVERGREEN'}">Evergreen</option>
        </select>

        <!-- Effort -->
        <select name="effort" class="text-sm border rounded px-2 py-1">
            <option value="">All effort</option>
            <option value="S" th:selected="${filterEffort == 'S'}">S (2–4 h)</option>
            <option value="M" th:selected="${filterEffort == 'M'}">M (4–8 h)</option>
            <option value="L" th:selected="${filterEffort == 'L'}">L (8–14 h)</option>
        </select>

        <button type="submit" class="btn-search text-sm">Apply</button>
        <a href="/admin/editorial" class="text-sm text-gray-500 underline">Clear</a>

        <span class="text-sm text-gray-400 ml-auto"
              th:text="${totalCount} + ' items'">0 items</span>
    </form>

    <!-- Queue table -->
    <div class="overflow-x-auto rounded-lg shadow-sm border border-gray-200">
        <table class="min-w-full text-sm bg-white">
            <thead class="bg-gray-50 text-xs text-gray-500 uppercase tracking-wide">
                <tr>
                    <th class="px-4 py-3 text-left">Priority</th>
                    <th class="px-4 py-3 text-left">Title &amp; Hook</th>
                    <th class="px-4 py-3 text-left">Theme</th>
                    <th class="px-4 py-3 text-left">Effort</th>
                    <th class="px-4 py-3 text-left">Preferred Date</th>
                    <th class="px-4 py-3 text-left">Status</th>
                    <th class="px-4 py-3 text-left">Action</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                <tr th:each="item : ${items}" class="hover:bg-gray-50">

                    <!-- Priority badge -->
                    <td class="px-4 py-3 whitespace-nowrap">
                        <span th:classappend="${item.priorityTier().name() == 'P0'} ? 'bg-red-100 text-red-800'
                                          : (${item.priorityTier().name() == 'P1'} ? 'bg-yellow-100 text-yellow-800'
                                          : 'bg-gray-100 text-gray-700')"
                              class="inline-block px-2 py-0.5 rounded text-xs font-bold"
                              th:text="${item.priorityTier()}">P0</span>
                    </td>

                    <!-- Title + hook -->
                    <td class="px-4 py-3 max-w-sm">
                        <p class="font-medium text-gray-900 leading-snug"
                           th:text="${item.title()}">Title</p>
                        <p class="text-xs text-gray-500 mt-0.5 leading-snug"
                           th:text="${item.hook()}">Hook</p>
                        <div class="flex gap-1 mt-1 flex-wrap">
                            <span th:each="aud : ${item.audiences()}"
                                  class="inline-block bg-blue-50 text-blue-700 text-xs px-1.5 py-0.5 rounded"
                                  th:text="${aud}">audience</span>
                        </div>
                    </td>

                    <!-- Theme -->
                    <td class="px-4 py-3 whitespace-nowrap">
                        <span class="text-xs text-gray-600"
                              th:text="${item.theme() != null ? item.theme().name().replace('_', ' ') : ''}">THEME</span>
                    </td>

                    <!-- Effort -->
                    <td class="px-4 py-3 whitespace-nowrap">
                        <span th:classappend="${item.effort() != null and item.effort().name() == 'L'} ? 'text-orange-600 font-semibold' : 'text-gray-600'"
                              class="text-xs"
                              th:text="${item.effort()}">M</span>
                    </td>

                    <!-- Preferred date -->
                    <td class="px-4 py-3 whitespace-nowrap text-xs text-gray-600"
                        th:text="${item.preferredDate()}">2026-10-06</td>

                    <!-- Status badge -->
                    <td class="px-4 py-3 whitespace-nowrap">
                        <span th:classappend="${item.status().name() == 'PLANNED'} ? 'bg-gray-100 text-gray-600'
                                          : (${item.status().name() == 'RESEARCHING'} ? 'bg-blue-100 text-blue-700'
                                          : (${item.status().name() == 'DRAFTING'} ? 'bg-purple-100 text-purple-700'
                                          : (${item.status().name() == 'REVIEW'} ? 'bg-yellow-100 text-yellow-700'
                                          : (${item.status().name() == 'SCHEDULED'} ? 'bg-teal-100 text-teal-700'
                                          : (${item.status().name() == 'NEEDS_UPDATE'} ? 'bg-red-100 text-red-700'
                                          : 'bg-green-100 text-green-700')))))"
                              class="inline-block px-2 py-0.5 rounded text-xs font-medium"
                              th:text="${item.status()}">PLANNED</span>
                    </td>

                    <!-- Advance action -->
                    <td class="px-4 py-3 whitespace-nowrap">
                        <form th:action="@{/admin/editorial/{id}/advance(id=${item.id()})}"
                              method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}" />
                            <button type="submit"
                                    class="text-xs text-primary-600 hover:text-primary-800 underline">
                                Advance →
                            </button>
                        </form>
                    </td>

                </tr>
                <tr th:if="${#lists.isEmpty(items)}">
                    <td colspan="7" class="px-4 py-8 text-center text-sm text-gray-400">
                        No items match the current filter.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</main>
</body>
</html>
