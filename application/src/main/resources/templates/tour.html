<!DOCTYPE html>
<!--
/**
 * Product tour page — public embedded video walkthrough.
 *
 * Plays the automated dashboard walkthrough (linkedin-posts/slideshow/slideshow.js
 * output) captured from a SUBSCRIBER-tier account. Publicly accessible (no auth
 * required) for sharing a stable branded URL in marketing posts and outreach.
 *
 * @author  Bill Blackmon
 * @version 1.0
 * @since   2026-09-25
 * @updated 2026-09-25
 */
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Product Tour')}">
</head>

<body class="bg-surface font-sans text-on-surface min-h-screen flex flex-col">

<!-- Header -->
<header class="bg-primary-600 text-white px-6 py-4 shadow-md">
    <h1 class="font-display text-2xl font-bold tracking-tight">AIHealthcare</h1>
    <p class="text-primary-200 text-sm mt-0.5">AI-Powered Healthcare Intelligence Platform</p>
</header>

<nav th:replace="~{fragments/public-nav :: public-nav('tour')}"></nav>

<main class="flex-1">

    <section class="max-w-5xl mx-auto px-4 py-10">
        <div class="text-center mb-6">
            <h2 class="font-display text-3xl font-bold text-on-surface mb-2">Product Walkthrough</h2>
            <p class="text-on-surface-variant max-w-2xl mx-auto">
                An automated tour of every dashboard, captured from a subscriber account &mdash;
                daily market intelligence, deal signals, regulatory tracking, sentiment analysis, and more.
            </p>
        </div>

        <video id="tour-video" class="w-full rounded-lg shadow-md border border-outline-variant bg-black"
               src="/videos/app-walkthrough.mp4" controls autoplay muted playsinline>
            Your browser doesn't support inline video &mdash;
            <a href="/videos/app-walkthrough.mp4">download the video</a> instead.
        </video>

        <div class="flex items-center justify-center gap-2 mt-4 flex-wrap">
            <span class="text-sm text-on-surface-variant mr-1">Playback speed:</span>
            <button type="button" data-rate="0.5" class="speed-btn px-3 py-1.5 rounded-md text-sm border border-outline-variant bg-white hover:bg-gray-50">0.5x</button>
            <button type="button" data-rate="0.75" class="speed-btn px-3 py-1.5 rounded-md text-sm border border-outline-variant bg-white hover:bg-gray-50">0.75x</button>
            <button type="button" data-rate="1" class="speed-btn px-3 py-1.5 rounded-md text-sm border border-primary-600 bg-primary-600 text-white font-semibold">1x</button>
            <button type="button" data-rate="1.5" class="speed-btn px-3 py-1.5 rounded-md text-sm border border-outline-variant bg-white hover:bg-gray-50">1.5x</button>
            <button type="button" data-rate="2" class="speed-btn px-3 py-1.5 rounded-md text-sm border border-outline-variant bg-white hover:bg-gray-50">2x</button>
        </div>

        <div class="text-center mt-8">
            <a th:href="@{/pricing}" class="inline-block bg-primary-600 hover:bg-primary-700 text-white font-semibold text-sm px-6 py-3 rounded-md transition-colors">
                Start Free Trial
            </a>
        </div>
    </section>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script>
    const tourVideo = document.getElementById('tour-video');
    const speedButtons = document.querySelectorAll('.speed-btn');
    speedButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
            tourVideo.playbackRate = Number(btn.dataset.rate);
            speedButtons.forEach((b) => {
                b.classList.remove('border-primary-600', 'bg-primary-600', 'text-white', 'font-semibold');
                b.classList.add('bg-white', 'hover:bg-gray-50', 'border-outline-variant');
            });
            btn.classList.remove('bg-white', 'hover:bg-gray-50');
            btn.classList.add('border-primary-600', 'bg-primary-600', 'text-white', 'font-semibold');
        });
    });
</script>

</body>
</html>
