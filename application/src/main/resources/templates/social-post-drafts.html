<!DOCTYPE html>
<!--
/**
 * Social post draft list — saved drafts from the social post generator.
 *
 * Shows all DRAFT-status posts with platform badge, digest date, word count,
 * and quick actions: Edit (TinyMCE), Mark Posted, Delete.
 *
 * @author  Bill Blackmon
 * @version 1.0
 * @since   2026-10-01
 * @updated 2026-10-01
 */
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Post Drafts')}">
</head>

<body class="bg-surface font-sans text-on-surface">

<header class="bg-primary-600 text-white px-6 py-4 shadow-md">
    <h1 class="font-display text-2xl font-bold tracking-tight">Post Drafts</h1>
    <p class="text-primary-200 text-sm mt-0.5">Edit and schedule your saved social post drafts</p>
</header>

<nav th:replace="~{fragments/nav :: nav('social')}"></nav>

<main class="max-w-5xl mx-auto px-4 py-6">

    <!-- Flash messages -->
    <div th:if="${successMsg}" class="mb-4 p-3 bg-green-50 border border-green-200 rounded-lg text-green-700 text-sm"
         th:text="${successMsg}"></div>
    <div th:if="${errorMsg}" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm"
         th:text="${errorMsg}"></div>

    <!-- Header row -->
    <div class="flex items-center justify-between mb-6">
        <div>
            <span class="text-lg font-semibold text-gray-800">Drafts</span>
            <span th:if="${draftCount != null}"
                  class="ml-2 text-xs px-2 py-0.5 bg-gray-100 text-gray-600 rounded-full"
                  th:text="${draftCount} + ' pending'"></span>
        </div>
        <a th:href="@{/dashboard/social}" class="text-sm text-primary-600 hover:underline">← Back to generator</a>
    </div>

    <!-- Tier gate -->
    <div th:if="${fullAccess != null and !fullAccess}" class="bg-amber-50 border border-amber-200 rounded-lg p-6 text-center">
        <p class="text-amber-700 text-sm">Post drafts are a Subscriber feature.
            <a th:href="@{/pricing}" class="underline font-medium">Upgrade</a> to save and edit drafts.</p>
    </div>

    <!-- Empty state -->
    <div th:if="${fullAccess and #lists.isEmpty(drafts)}"
         class="bg-white rounded-lg shadow-card p-8 text-center text-gray-500">
        <p class="text-sm">No drafts yet.</p>
        <p class="text-xs text-gray-400 mt-1">Use the
            <a th:href="@{/dashboard/social}" class="text-primary-600 underline">Social Post Generator</a>
            and click "Save as Drafts" to create some.</p>
    </div>

    <!-- Draft list -->
    <div th:if="${fullAccess and not #lists.isEmpty(drafts)}" class="space-y-3">
        <div th:each="draft : ${drafts}"
             class="bg-white rounded-lg shadow-card p-4 flex items-start gap-4">

            <!-- Platform badge -->
            <div class="flex-shrink-0 pt-0.5">
                <span th:if="${draft.platform.name() == 'LINKEDIN'}"
                      class="inline-block px-2 py-0.5 text-xs font-semibold bg-blue-100 text-blue-700 rounded-full">LI</span>
                <span th:if="${draft.platform.name() == 'FACEBOOK'}"
                      class="inline-block px-2 py-0.5 text-xs font-semibold bg-indigo-100 text-indigo-700 rounded-full">FB</span>
            </div>

            <!-- Content preview -->
            <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1">
                    <span class="text-xs text-gray-500" th:text="${draft.digestDate}"></span>
                    <span th:if="${draft.yourTake != null and not #strings.isEmpty(draft.yourTake)}"
                          class="text-xs px-1.5 py-0.5 bg-emerald-100 text-emerald-700 rounded">has your take</span>
                </div>
                <p class="text-sm text-gray-800 truncate" th:text="${draft.body}"></p>
            </div>

            <!-- Actions -->
            <div class="flex-shrink-0 flex gap-2">
                <a th:href="@{/dashboard/social/drafts/{id}/edit(id=${draft.postId})}"
                   class="px-3 py-1.5 bg-primary-600 text-white text-xs rounded hover:bg-primary-700 transition-colors">
                    Edit
                </a>
                <form th:action="@{/dashboard/social/drafts/{id}/post(id=${draft.postId})}"
                      method="post" class="inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit"
                            class="px-3 py-1.5 bg-green-600 text-white text-xs rounded hover:bg-green-700 transition-colors">
                        Mark Posted
                    </button>
                </form>
                <form th:action="@{/dashboard/social/drafts/{id}/delete(id=${draft.postId})}"
                      method="post" class="inline"
                      onsubmit="return confirm('Delete this draft?')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit"
                            class="px-3 py-1.5 bg-red-100 text-red-700 text-xs rounded hover:bg-red-200 transition-colors">
                        Delete
                    </button>
                </form>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
