<!DOCTYPE html>
<!--
/**
 * Research Run Detail page — full metadata for a single research pipeline run.
 *
 * Displays run ID, original query, pipeline mode badge, timestamp, and citation
 * count for the selected run. Breadcrumb navigates back to run history. No
 * inline HTML content is shown here — this is the metadata view only.
 *
 * @author  Bill Blackmon
 * @version 1.0
 * @since   2026-02-15
 * @updated 2026-07-28
 */
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Research Run Detail')}">
</head>

<body class="bg-surface font-sans text-on-surface">

<header class="bg-primary-600 text-white px-6 py-4 shadow-md">
    <h1 class="font-display text-2xl font-bold tracking-tight">AIHealthcare Analytics</h1>
    <p class="text-primary-200 text-sm mt-0.5">Research Run Detail</p>
</header>

<nav th:replace="~{fragments/nav :: nav('research')}"></nav>

<main class="max-w-4xl mx-auto px-4 py-6">

    <!-- Breadcrumb -->
    <div class="text-sm text-gray-500 mb-4">
        <a th:href="@{/research/runs}" class="text-primary-600 hover:text-primary-700">Research Runs</a>
        &rsaquo; Run Detail
    </div>

    <!-- Detail card -->
    <div class="bg-white rounded-lg shadow-sm p-5 mb-6">
        <h2 class="font-display text-lg font-semibold text-on-surface border-b-2 border-outline-variant pb-2 mb-5">
            Research Run
        </h2>

        <div class="grid grid-cols-[160px_1fr] gap-3 items-baseline">

            <span class="text-xs uppercase tracking-wider text-gray-500 font-semibold">Run ID</span>
            <span class="font-mono text-xs text-gray-400 break-all" th:text="${run.runId()}">uuid-here</span>

            <span class="text-xs uppercase tracking-wider text-gray-500 font-semibold">Query</span>
            <span class="text-base font-semibold text-on-surface leading-relaxed" th:text="${run.query()}">Research question</span>

            <span class="text-xs uppercase tracking-wider text-gray-500 font-semibold">Pipeline Mode</span>
            <span>
                <span th:classappend="${run.mode() == 'COMBINED'} ? 'bg-green-100 text-green-800'
                                   : (${run.mode() == 'STAGED_RESEARCH'} ? 'bg-amber-100 text-amber-800'
                                   : 'bg-gray-200 text-gray-600')"
                      class="inline-block px-2 py-0.5 rounded-full text-xs font-semibold"
                      th:text="${run.mode()}">COMBINED</span>
            </span>

            <span class="text-xs uppercase tracking-wider text-gray-500 font-semibold">Researched At</span>
            <span class="text-sm text-on-surface" th:text="${displayTime}">2026-01-01 06:00 UTC</span>

            <span class="text-xs uppercase tracking-wider text-gray-500 font-semibold">Citations</span>
            <span>
                <div class="inline-block bg-primary-50 border-l-4 border-primary-500 rounded-r-lg px-4 py-2">
                    <span class="text-2xl font-bold text-on-surface" th:text="${run.citationCount()}">0</span>
                    <small class="block text-xs text-gray-500 uppercase tracking-wider mt-0.5">unique sources</small>
                </div>
            </span>

        </div>
    </div>

    <a class="inline-block mt-2 text-primary-600 hover:text-primary-700 text-sm"
       th:href="@{/research/runs}">&larr; Back to Run History</a>

</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
