<!DOCTYPE html>
<!--
/**
 * Admin Panel page — user management and system status dashboard.
 *
 * Displays system statistics (articles, runs, subscribers), user management
 * table with enable/disable and role-change actions. Restricted to ADMIN role.
 * Restyled with Tailwind CSS and shared fragments.
 *
 * @author  Bill Blackmon
 * @version 1.0
 * @since   2025-06-01
 * @updated 2026-07-28
 */
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Admin Panel')}">
</head>
<body class="bg-surface font-sans text-on-surface">

<header class="bg-primary-600 text-white px-6 py-4 shadow-md">
    <h1 class="font-display text-2xl font-bold tracking-tight">Admin Panel</h1>
    <p class="text-primary-200 text-sm mt-0.5">User management &amp; system status</p>
</header>

<nav th:replace="~{fragments/nav :: nav('admin')}"></nav>

<main class="max-w-7xl mx-auto px-4 py-6">

    <!-- System Status -->
    <section class="mb-6">
        <div class="bg-white rounded-lg shadow-sm p-6 mb-5">
            <h2 class="font-display text-lg font-semibold text-on-surface border-b-2 border-gray-100 pb-3 mb-5">System Status</h2>

            <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
                <div class="stat-card">
                    <div class="value" th:text="${ingestion.totalArticles}">0</div>
                    <div class="label">Total Articles</div>
                </div>
                <div class="stat-card green">
                    <div class="value" th:text="${runs.totalRuns}">0</div>
                    <div class="label">Newsletter Runs</div>
                </div>
                <div class="stat-card amber">
                    <div class="value" th:text="${subscriberCount}">0</div>
                    <div class="label">Subscribers</div>
                </div>
                <div class="stat-card slate">
                    <div class="value" th:text="${runs.draftCount}">0</div>
                    <div class="label">Drafts</div>
                </div>
                <div class="stat-card green">
                    <div class="value" th:text="${runs.sentCount}">0</div>
                    <div class="label">Sent</div>
                </div>
            </div>
        </div>
    </section>

    <!-- User Management -->
    <section>
        <div class="bg-white rounded-lg shadow-sm p-6 mb-5">
            <h2 class="font-display text-lg font-semibold text-on-surface border-b-2 border-gray-100 pb-3 mb-5">User Management</h2>

            <div th:if="${successMessage}" class="flash flash-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="flash flash-error" th:text="${errorMessage}"></div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-5">
                <div class="stat-card">
                    <div class="value" th:text="${#lists.size(users)}">0</div>
                    <div class="label">Total Users</div>
                </div>
                <div class="stat-card border-purple-700 bg-purple-50">
                    <div class="value" th:text="${adminCount}">0</div>
                    <div class="label">Admins</div>
                </div>
                <div class="stat-card border-sky-700 bg-sky-50">
                    <div class="value" th:text="${userCount}">0</div>
                    <div class="label">Users</div>
                </div>
                <div class="stat-card red" th:if="${disabledCount > 0}">
                    <div class="value" th:text="${disabledCount}">0</div>
                    <div class="label">Disabled</div>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>Display Name</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.email}">—</td>
                        <td th:text="${user.displayName}">—</td>
                        <td>
                            <span th:if="${user.role == 'ADMIN'}" class="badge badge-admin">ADMIN</span>
                            <span th:if="${user.role != 'ADMIN'}" class="badge badge-user" th:text="${user.role}">USER</span>
                        </td>
                        <td>
                            <span th:if="${user.enabled}" class="badge badge-active">Active</span>
                            <span th:unless="${user.enabled}" class="badge badge-disabled">Disabled</span>
                        </td>
                        <td>
                            <div th:if="${user.email != currentUserEmail}" class="action-forms">
                                <form method="post" th:action="@{/admin/users/{email}/toggle-enabled(email=${user.email})}">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit"
                                            th:class="${user.enabled} ? 'btn-sm btn-disable' : 'btn-sm btn-enable'"
                                            th:text="${user.enabled} ? 'Disable' : 'Enable'">Toggle</button>
                                </form>
                                <form method="post" th:action="@{/admin/users/{email}/change-role(email=${user.email})}">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <input type="hidden" name="role"
                                           th:value="${user.role == 'ADMIN'} ? 'USER' : 'ADMIN'"/>
                                    <button type="submit" class="btn-sm btn-role"
                                            th:text="${user.role == 'ADMIN'} ? 'Make User' : 'Make Admin'">Toggle Role</button>
                                </form>
                            </div>
                            <span th:if="${user.email == currentUserEmail}"
                                  class="text-xs text-gray-400">(you)</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>
</body>
</html>
