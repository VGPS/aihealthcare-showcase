<!DOCTYPE html>
<!--
/**
 * HTMX fragment — enterprise push schedule table rows.
 *
 * Model attributes: schedules (List<DataPushScheduleResponse>).
 *
 * @author  Bill Blackmon
 * @version 1.0
 * @since   2026-09-08
 * @updated 2026-09-08
 */
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="enterprise-schedule-rows">

    <div th:if="${#lists.isEmpty(schedules)}" class="text-center py-8">
        <p class="text-sm text-gray-500">No schedules yet. Create one using the form above.</p>
    </div>

    <div th:unless="${#lists.isEmpty(schedules)}" class="overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
                <tr>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Label</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Feed</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Cron</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Zone</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Next Run</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Last Run</th>
                    <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase">Status</th>
                    <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">Recipients</th>
                    <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                <tr th:each="s : ${schedules}" class="hover:bg-gray-50 transition-colors">
                    <td class="px-4 py-3 text-gray-800 font-medium" th:text="${s.label()}"></td>
                    <td class="px-4 py-3 text-gray-600" th:text="${s.feedId()}"></td>
                    <td class="px-4 py-3 font-mono text-xs text-gray-600" th:text="${s.cronExpression()}"></td>
                    <td class="px-4 py-3 text-xs text-gray-500" th:text="${s.zoneId()}"></td>
                    <td class="px-4 py-3 text-xs text-gray-500"
                        th:text="${s.nextRunAt() != null} ? ${#temporals.format(s.nextRunAt(), 'MMM d HH:mm')} : '—'"></td>
                    <td class="px-4 py-3 text-xs text-gray-500"
                        th:text="${s.lastRunAt() != null} ? ${#temporals.format(s.lastRunAt(), 'MMM d HH:mm')} : '—'"></td>
                    <td class="px-4 py-3 text-center">
                        <span th:if="${s.active()}"
                              class="text-xs px-2 py-0.5 rounded-full font-medium"
                              th:classappend="${s.lastStatus() == 'SUCCEEDED'} ? 'bg-green-100 text-green-700'
                                : (${s.lastStatus() == 'FAILED'} ? 'bg-red-100 text-red-700'
                                : 'bg-blue-100 text-blue-700')"
                              th:text="${s.lastStatus() != null} ? ${s.lastStatus()} : 'ACTIVE'"></span>
                        <span th:unless="${s.active()}"
                              class="text-xs px-2 py-0.5 rounded-full font-medium bg-amber-100 text-amber-700">INACTIVE</span>
                    </td>
                    <td class="px-4 py-3 text-right text-gray-600" th:text="${s.recipients().size()}"></td>
                    <td class="px-4 py-3 text-center space-x-2">
                        <button class="text-xs text-primary-600 hover:underline font-medium"
                                th:attr="onclick='runScheduleNow(\'' + ${s.scheduleId()} + '\')'">Run Now</button>
                        <button class="text-xs text-red-600 hover:underline font-medium"
                                th:attr="onclick='deleteSchedule(\'' + ${s.scheduleId()} + '\')'">Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
