<!DOCTYPE html>
<!--
/**
 * HTMX fragment — enterprise data job preview.
 *
 * Shows KPI tiles (row count, file size, SHA-256), job metadata,
 * and a download link for succeeded jobs.
 *
 * Model attributes: job (DataJobResponse, nullable), isSucceeded (boolean).
 *
 * @author  Bill Blackmon
 * @version 1.0
 * @since   2026-09-08
 * @updated 2026-09-08
 */
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="enterprise-job-preview">

    <div th:if="${job == null}" class="text-sm text-gray-500 text-center py-8">
        Job not found.
    </div>

    <div th:if="${job != null}">
        <!-- KPI Tiles -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-lg shadow-card p-4 text-center">
                <div class="text-2xl font-bold text-primary-700"
                     th:text="${job.rowCount() != null} ? ${job.rowCount()} : '—'"></div>
                <div class="text-xs text-gray-500 mt-1">Rows</div>
            </div>
            <div class="bg-white rounded-lg shadow-card p-4 text-center">
                <div class="text-2xl font-bold text-primary-700"
                     th:text="${job.byteSize() != null} ? ${#numbers.formatDecimal(job.byteSize() / 1024.0, 1, 1)} + ' KB' : '—'"></div>
                <div class="text-xs text-gray-500 mt-1">File Size</div>
            </div>
            <div class="bg-white rounded-lg shadow-card p-4 text-center">
                <span class="text-sm px-3 py-1 rounded-full font-medium"
                      th:classappend="${job.status() == 'SUCCEEDED'} ? 'bg-green-100 text-green-700'
                        : (${job.status() == 'RUNNING'} ? 'bg-blue-100 text-blue-700'
                        : (${job.status() == 'FAILED'} ? 'bg-red-100 text-red-700'
                        : 'bg-gray-100 text-gray-600'))"
                      th:text="${job.status()}"></span>
                <div class="text-xs text-gray-500 mt-1">Status</div>
            </div>
            <div class="bg-white rounded-lg shadow-card p-4 text-center">
                <span class="text-sm font-medium text-gray-700"
                      th:text="${job.format() != null} ? ${job.format()} : '—'"></span>
                <div class="text-xs text-gray-500 mt-1">Format</div>
            </div>
        </div>

        <!-- Job Details -->
        <div class="bg-white rounded-lg shadow-card p-6 mb-6">
            <h3 class="text-sm font-semibold text-gray-700 mb-3">Job Details</h3>
            <dl class="grid grid-cols-2 gap-x-6 gap-y-2 text-sm">
                <dt class="text-gray-500">Job ID</dt>
                <dd class="font-mono text-xs text-gray-700" th:text="${job.jobId()}"></dd>

                <dt class="text-gray-500">Feed</dt>
                <dd class="text-gray-700" th:text="${job.feedId()}"></dd>

                <dt class="text-gray-500">Submitted</dt>
                <dd class="text-gray-700" th:text="${job.submittedAt()}"></dd>

                <dt th:if="${job.completedAt() != null}" class="text-gray-500">Completed</dt>
                <dd th:if="${job.completedAt() != null}" class="text-gray-700" th:text="${job.completedAt()}"></dd>

                <dt th:if="${job.contentSha256() != null}" class="text-gray-500">SHA-256</dt>
                <dd th:if="${job.contentSha256() != null}" class="font-mono text-xs text-gray-500"
                    th:text="${#strings.abbreviate(job.contentSha256(), 20)}"></dd>

                <dt th:if="${job.expiresAt() != null}" class="text-gray-500">Expires</dt>
                <dd th:if="${job.expiresAt() != null}" class="text-gray-700" th:text="${job.expiresAt()}"></dd>
            </dl>
        </div>

        <!-- Error Details -->
        <div th:if="${job.errorType() != null}" class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
            <h3 class="text-sm font-semibold text-red-700 mb-1" th:text="${job.errorType()}"></h3>
            <p class="text-sm text-red-600" th:text="${job.errorMessage()}"></p>
        </div>

        <!-- Download Button -->
        <div th:if="${isSucceeded}" class="text-center">
            <a th:href="@{'/api/v1/enterprise/data/jobs/' + ${job.jobId()} + '/artifact'}"
               class="inline-block bg-primary-600 text-white px-8 py-3 rounded-lg text-sm font-medium hover:bg-primary-700 transition-colors shadow-sm">
                Download Artifact
            </a>
        </div>
    </div>

</div>
</body>
</html>
