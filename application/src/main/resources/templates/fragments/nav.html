<!DOCTYPE html>
<!--
/**
 * Shared navigation fragment for authenticated pages.
 *
 * Renders the full top navigation bar with role-based link visibility via
 * Spring Security's sec:authorize. The active page is highlighted by comparing
 * the activePage parameter to a fixed string per link.
 *
 * Usage: <nav th:replace="~{fragments/nav :: nav('search')}">
 *
 * activePage values: dashboard | news | newsletter | research | vendors | ai-search |
 *                    wiki | trends | regulatory | clinical-trials | companies |
 *                    watchlist | search | pricing | profile | admin
 *
 * @author  Bill Blackmon
 * @version 1.0
 * @since   2026-07-28
 * @updated 2026-07-28
 */
-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<nav th:fragment="nav(activePage)">
    <a th:href="@{/dashboard}"
       th:classappend="${activePage == 'dashboard'} ? ' active'">Dashboard</a>
    <a th:href="@{/dashboard/news}"
       th:classappend="${activePage == 'news'} ? ' active'">News Listing</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/newsletter/runs}"
       th:classappend="${activePage == 'newsletter'} ? ' active'">Newsletter Preview</a>
    <a th:href="@{/research/runs}"
       th:classappend="${activePage == 'research'} ? ' active'">Research Runs</a>
    <a th:href="@{/research/vendors}"
       th:classappend="${activePage == 'vendors'} ? ' active'">Vendor Compare</a>
    <a th:href="@{/research/ai-search}"
       th:classappend="${activePage == 'ai-search'} ? ' active'">AI Search</a>
    <a th:href="@{/wiki}"
       th:classappend="${activePage == 'wiki'} ? ' active'">Wiki</a>
    <a th:href="@{/dashboard/trends}"
       th:classappend="${activePage == 'trends'} ? ' active'">Trends</a>
    <a th:href="@{/dashboard/regulatory}"
       th:classappend="${activePage == 'regulatory'} ? ' active'">Regulatory</a>
    <a th:href="@{/dashboard/clinical-trials}"
       th:classappend="${activePage == 'clinical-trials'} ? ' active'">Clinical Trials</a>
    <a th:href="@{/companies}"
       th:classappend="${activePage == 'companies'} ? ' active'">Companies</a>
    <a th:href="@{/watchlist}"
       th:classappend="${activePage == 'watchlist'} ? ' active'">Watchlist</a>
    <a th:href="@{/dashboard/search}"
       th:classappend="${activePage == 'search'} ? ' active'">Article Search</a>
    <a th:href="@{/pricing}"
       th:classappend="${activePage == 'pricing'} ? ' active'">Pricing</a>
    <a sec:authorize="isAuthenticated()" th:href="@{/profile}"
       th:classappend="${activePage == 'profile'} ? ' active'">Profile</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}"
       th:classappend="${activePage == 'admin'} ? ' active'">Admin</a>
    <a sec:authorize="isAuthenticated()" th:href="@{/logout}"
       style="margin-left:auto; color:#e57373;">Logout</a>
</nav>
</html>
