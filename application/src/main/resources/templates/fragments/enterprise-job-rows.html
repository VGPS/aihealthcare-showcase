<!DOCTYPE html>
<!--
/**
 * HTMX fragment — enterprise data job table rows.
 *
 * Polled every 5 seconds when in-flight jobs exist (QUEUED or RUNNING).
 * Model attributes: jobs (List<DataJobResponse>), hasInFlightJobs (boolean).
 *
 * @author  Bill Blackmon
 * @version 1.0
 * @since   2026-09-08
 * @updated 2026-09-08
 */
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="enterprise-job-rows">

    <div th:if="${#lists.isEmpty(jobs)}" class="bg-white rounded-lg shadow-card p-8 text-center">
        <p class="text-sm text-gray-500">No jobs yet. Submit a job from the Run tab.</p>
    </div>

    <div th:unless="${#lists.isEmpty(jobs)}" class="bg-white rounded-lg shadow-card overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
                <tr>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Job ID</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Feed</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Format</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                    <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">Rows</th>
                    <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">Size</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Submitted</th>
                    <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                <tr th:each="job : ${jobs}" class="hover:bg-gray-50 transition-colors">
                    <td class="px-4 py-3 font-mono text-xs text-gray-600"
                        th:text="${#strings.abbreviate(job.jobId(), 12)}"></td>
                    <td class="px-4 py-3 text-gray-800" th:text="${job.feedId()}"></td>
                    <td class="px-4 py-3">
                        <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded"
                              th:text="${job.format()}"></span>
                    </td>
                    <td class="px-4 py-3">
                        <span class="text-xs px-2 py-0.5 rounded-full font-medium"
                              th:classappend="${job.status() == 'SUCCEEDED'} ? 'bg-green-100 text-green-700'
                                : (${job.status() == 'RUNNING'} ? 'bg-blue-100 text-blue-700'
                                : (${job.status() == 'QUEUED'} ? 'bg-yellow-100 text-yellow-700'
                                : (${job.status() == 'FAILED'} ? 'bg-red-100 text-red-700'
                                : (${job.status() == 'CANCELLED'} ? 'bg-gray-100 text-gray-600'
                                : 'bg-orange-100 text-orange-700'))))"
                              th:text="${job.status()}"></span>
                    </td>
                    <td class="px-4 py-3 text-right text-gray-600"
                        th:text="${job.rowCount() != null} ? ${job.rowCount()} : '—'"></td>
                    <td class="px-4 py-3 text-right text-gray-600"
                        th:text="${job.byteSize() != null} ? ${#numbers.formatDecimal(job.byteSize() / 1024.0, 1, 1)} + ' KB' : '—'"></td>
                    <td class="px-4 py-3 text-xs text-gray-500"
                        th:text="${job.submittedAt() != null} ? ${#temporals.format(job.submittedAt(), 'MMM d HH:mm')} : '—'"></td>
                    <td class="px-4 py-3 text-center">
                        <a th:if="${job.status() == 'SUCCEEDED'}"
                           th:href="@{'/api/v1/enterprise/data/jobs/' + ${job.jobId()} + '/artifact'}"
                           class="text-xs text-primary-600 hover:underline font-medium">Download</a>
                        <form th:if="${job.status() == 'QUEUED' || job.status() == 'RUNNING'}"
                              th:action="@{'/api/v1/enterprise/data/jobs/' + ${job.jobId()} + '/cancel'}"
                              method="post" class="inline">
                            <button type="submit"
                                    class="text-xs text-red-600 hover:underline font-medium">Cancel</button>
                        </form>
                        <span th:if="${job.status() == 'FAILED'}" class="text-xs text-red-500"
                              th:text="${job.errorType() != null} ? ${job.errorType()} : 'Error'"></span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
