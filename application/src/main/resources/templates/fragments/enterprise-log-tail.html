<!DOCTYPE html>
<!--
/**
 * HTMX fragment — enterprise data job log tail.
 *
 * Polled every 3 seconds with an offset parameter. Shows the running
 * log output from a data job in a scrollable monospace pre block.
 *
 * Model attributes: logContent (String), jobId (String), nextOffset (long).
 *
 * @author  Bill Blackmon
 * @version 1.0
 * @since   2026-09-08
 * @updated 2026-09-08
 */
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="enterprise-log-tail"
     th:hx-get="@{'/enterprise/data/jobs/' + ${jobId} + '/log-tail?from=' + ${nextOffset}}"
     hx-trigger="every 3s"
     hx-swap="outerHTML">

    <div class="bg-gray-900 rounded-lg p-4 max-h-96 overflow-y-auto">
        <pre class="text-xs text-green-400 font-mono whitespace-pre-wrap leading-relaxed"
             th:text="${logContent}"></pre>
        <div th:if="${#strings.isEmpty(logContent)}"
             class="text-xs text-gray-500 italic">Waiting for log output...</div>
    </div>

</div>
</body>
</html>
