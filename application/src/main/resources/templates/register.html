<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AIHealthcare — Register</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>

<header>
    <h1>AIHealthcare</h1>
    <p>AI-in-Healthcare Intelligence Platform</p>
</header>

<main>
    <div class="register-card">
        <h2>Start Your Free Trial</h2>
        <p class="subtitle">
            <span class="demo-badge">7-DAY DEMO</span><br/>
            Full access to the platform for 7 days. No credit card required.
        </p>

        <div th:if="${error}" class="alert alert-error" th:text="${error}">
            Error message
        </div>

        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       th:value="${email}"
                       placeholder="you@example.com" required autofocus/>
            </div>

            <div class="form-group">
                <label for="displayName">Display Name</label>
                <input type="text" id="displayName" name="displayName"
                       th:value="${displayName}"
                       placeholder="Your name" required/>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Choose a password" required/>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword"
                       placeholder="Confirm your password" required/>
            </div>

            <button type="submit" class="register-button">Create Account</button>
        </form>

        <div class="register-footer">
            Already have an account? <a th:href="@{/login}">Sign in</a>
        </div>
    </div>
</main>

</body>
</html>
