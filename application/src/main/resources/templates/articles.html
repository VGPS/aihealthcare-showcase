<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="'Articles — ' + ${topic}">Articles</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>

<header>
    <a class="back" th:href="@{/dashboard}">&larr; Dashboard</a>
    <h1 th:text="${topic}">Topic</h1>
    <span class="count" th:text="${#lists.size(articles)} + ' articles'">0 articles</span>
</header>

<main>

    <div class="card" th:if="${accessDenied}">
        <div class="empty" style="padding: 2rem;">
            <strong>This topic is a Subscriber feature.</strong><br/>
            Upgrade to a Subscriber subscription to access New AI Healthcare Companies.<br/><br/>
            <a th:href="@{/pricing}" style="color: #4361ee; text-decoration: none; font-weight: 600;">View Plans &rarr;</a>
        </div>
    </div>

    <div class="card" th:unless="${accessDenied}">
        <div class="empty" th:if="${articles == null or #lists.isEmpty(articles)}">
            No articles found for this topic in the current date window.
        </div>

        <table th:unless="${#lists.isEmpty(articles)}">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Publication Date
                        <a th:href="@{/dashboard/articles(topic=${topic},sort='asc')}"
                           class="sort-arrow" th:classappend="${sort == 'asc' ? 'active' : ''}" title="Oldest first">&uarr;</a>
                        <a th:href="@{/dashboard/articles(topic=${topic},sort='desc')}"
                           class="sort-arrow" th:classappend="${sort != 'asc' ? 'active' : ''}" title="Newest first">&darr;</a>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="article : ${articles}">
                    <td class="title-cell">
                        <a th:href="${article.url}" th:text="${article.title}" target="_blank"
                           rel="noopener noreferrer">—</a>
                        <div class="meta" th:if="${article.author != null}"
                             th:text="${article.author}"></div>
                        <div class="body-preview" th:if="${article.bodyText != null and !article.bodyText.isEmpty()}"
                             th:text="${articleSummaries != null and articleSummaries.containsKey(article.articleId()) ? articleSummaries.get(article.articleId()) : article.bodyText}"></div>
                    </td>
                    <td th:if="${article.publishedAt != null}" class="date-cell"
                        th:text="${#strings.replace(#strings.substring(article.publishedAt.toString(), 0, 16), 'T', ' ')} + ' UTC'">—</td>
                    <td th:if="${article.publishedAt == null}" class="date-cell null-date">unknown</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
