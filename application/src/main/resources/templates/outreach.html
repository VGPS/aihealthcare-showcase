<!DOCTYPE html>
<!--
/**
 * Company Outreach CRM — main list view.
 *
 * Lists all outreach records grouped with add-record form.
 * Restricted to ADMIN role.
 *
 * @author  Bill Blackmon
 * @version 1.0
 * @since   2026-10-03
 * @updated 2026-10-03
 */
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Outreach CRM')}">
</head>
<body class="bg-surface font-sans text-on-surface">

<header class="bg-primary-600 text-white px-6 py-4 shadow-md">
    <h1 class="font-display text-2xl font-bold tracking-tight">Outreach CRM</h1>
    <p class="text-primary-200 text-sm mt-0.5">Track employment and subscription outreach by company</p>
</header>

<nav th:replace="~{fragments/nav :: nav('admin-outreach')}"></nav>

<main class="max-w-7xl mx-auto px-4 py-6">

    <!-- Flash messages -->
    <div th:if="${successMsg}" class="bg-green-50 border-l-4 border-green-500 text-green-800 text-sm p-3 mb-4 rounded"
         th:text="${successMsg}"></div>
    <div th:if="${errorMsg}" class="bg-red-50 border-l-4 border-red-500 text-red-800 text-sm p-3 mb-4 rounded"
         th:text="${errorMsg}"></div>

    <!-- Company name → slug map for JS combo box -->
    <script th:inline="javascript">
        const COMPANY_MAP = /*[[${companyNameToId}]]*/ {};
    </script>

    <!-- Add outreach row form -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-5 mb-6">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">Add Company</h2>
        <form th:action="@{/admin/outreach/add}" method="post" class="flex flex-wrap gap-3 items-end" id="add-outreach-form">

            <!-- Hidden slug field — populated by JS when a company is selected -->
            <input type="hidden" name="slug" id="slug-hidden"/>

            <div class="flex flex-col gap-1 flex-1 min-w-56">
                <label class="text-xs font-medium text-gray-600">Company
                    <span class="text-gray-400 font-normal">(type to search)</span>
                </label>
                <input type="text" id="company-search" list="company-datalist" required
                       autocomplete="off" placeholder="e.g. Tempus AI"
                       class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-400"/>
                <datalist id="company-datalist">
                    <option th:each="c : ${companies}" th:value="${c.name()}"></option>
                </datalist>
                <p id="slug-display" class="text-xs text-gray-400 mt-0.5 hidden">
                    slug: <span id="slug-display-val" class="font-mono"></span>
                </p>
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-xs font-medium text-gray-600">Purpose</label>
                <select name="purpose" class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none">
                    <option th:each="p : ${purposes}" th:value="${p}" th:text="${p}"></option>
                </select>
            </div>

            <div class="flex flex-col gap-1 flex-1 min-w-48">
                <label class="text-xs font-medium text-gray-600">Notes (optional)</label>
                <input type="text" name="notes" placeholder="Initial notes..."
                       class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none"/>
            </div>

            <button type="submit"
                    class="bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium px-5 py-2 rounded transition-colors">
                Add
            </button>
        </form>

        <!-- Contact preview — shown when a known company is selected -->
        <div id="contact-preview" class="hidden mt-5 border-t border-gray-100 pt-4">
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">
                Existing contacts for <span id="preview-company-name" class="text-gray-700 normal-case font-medium"></span>
            </p>
            <div id="contact-preview-body" class="text-sm text-gray-500 italic">Loading…</div>
        </div>
    </div>

    <script>
    (function () {
        const searchInput  = document.getElementById('company-search');
        const slugHidden   = document.getElementById('slug-hidden');
        const slugDisplay  = document.getElementById('slug-display');
        const slugVal      = document.getElementById('slug-display-val');
        const preview      = document.getElementById('contact-preview');
        const previewName  = document.getElementById('preview-company-name');
        const previewBody  = document.getElementById('contact-preview-body');

        function toSlug(text) {
            return text.trim().toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-|-$/g, '');
        }

        function setSlug(slug) {
            slugHidden.value = slug;
            slugVal.textContent = slug;
            slugDisplay.classList.toggle('hidden', !slug);
        }

        function renderContacts(contacts) {
            if (!contacts.length) {
                previewBody.innerHTML = '<span class="text-gray-400">No contacts on file yet.</span>';
                return;
            }
            let html = '<table class="w-full text-xs border-collapse">';
            html += '<thead><tr class="text-gray-400 uppercase text-left">'
                  + '<th class="pb-1 pr-4">Name</th><th class="pb-1 pr-4">Title</th>'
                  + '<th class="pb-1 pr-4">Email</th><th class="pb-1 pr-4">LinkedIn</th>'
                  + '<th class="pb-1">Status</th></tr></thead><tbody>';
            contacts.forEach(c => {
                const li = c.linkedinUrl
                    ? `<a href="${c.linkedinUrl}" target="_blank" class="text-primary-600 hover:underline">↗</a>`
                    : '—';
                html += `<tr class="border-t border-gray-50">
                    <td class="py-1 pr-4 font-medium">${c.fullName}</td>
                    <td class="py-1 pr-4 text-gray-500">${c.jobTitle || '—'}</td>
                    <td class="py-1 pr-4">${c.email ? `<a href="mailto:${c.email}" class="text-primary-600 hover:underline">${c.email}</a>` : '—'}</td>
                    <td class="py-1 pr-4">${li}</td>
                    <td class="py-1 text-gray-500">${c.status}</td>
                </tr>`;
            });
            html += '</tbody></table>';
            previewBody.innerHTML = html;
        }

        function onCompanyInput() {
            const typed = searchInput.value.trim();
            if (!typed) {
                setSlug('');
                preview.classList.add('hidden');
                return;
            }

            // Exact match from known companies map
            const knownSlug = COMPANY_MAP[typed];
            const slug = knownSlug || toSlug(typed);
            setSlug(slug);

            if (knownSlug) {
                // Show contact preview for known companies
                preview.classList.remove('hidden');
                previewName.textContent = typed;
                previewBody.innerHTML = '<span class="text-gray-400 italic">Loading…</span>';
                fetch('/admin/outreach/contacts-json?slug=' + encodeURIComponent(slug))
                    .then(r => r.json())
                    .then(renderContacts)
                    .catch(() => { previewBody.textContent = 'Could not load contacts.'; });
            } else {
                preview.classList.add('hidden');
            }
        }

        // Validate slug is set before submit
        document.getElementById('add-outreach-form').addEventListener('submit', function (e) {
            if (!slugHidden.value) {
                const typed = searchInput.value.trim();
                if (!typed) { e.preventDefault(); return; }
                setSlug(toSlug(typed));
            }
        });

        searchInput.addEventListener('input', onCompanyInput);
        searchInput.addEventListener('change', onCompanyInput);
    })();
    </script>

    <!-- Outreach table -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
            <h2 class="text-lg font-semibold text-gray-800">All Outreach Records</h2>
            <span class="text-sm text-gray-500" th:text="${allOutreach.size()} + ' record(s)'"></span>
        </div>

        <div th:if="${allOutreach.isEmpty()}" class="p-10 text-center text-gray-400 text-sm">
            No outreach records yet. Add one above.
        </div>

        <table th:if="${!allOutreach.isEmpty()}" class="w-full text-sm">
            <thead class="bg-gray-50 text-xs text-gray-500 uppercase tracking-wide">
                <tr>
                    <th class="px-5 py-3 text-left">Company Slug</th>
                    <th class="px-5 py-3 text-left">Purpose</th>
                    <th class="px-5 py-3 text-left">Status</th>
                    <th class="px-5 py-3 text-left">Contacted At</th>
                    <th class="px-5 py-3 text-left">Notes</th>
                    <th class="px-5 py-3 text-left">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                <tr th:each="row : ${allOutreach}" class="hover:bg-gray-50 transition-colors">
                    <td class="px-5 py-3 font-medium">
                        <a th:href="@{/admin/outreach/{slug}(slug=${row.slug()})}"
                           class="text-primary-700 hover:underline" th:text="${row.slug()}"></a>
                    </td>
                    <td class="px-5 py-3">
                        <span th:text="${row.purpose()}" th:classappend="${row.purpose().name() == 'EMPLOYMENT'} ? 'bg-blue-100 text-blue-800' : 'bg-purple-100 text-purple-800'" class="text-xs font-medium px-2 py-0.5 rounded-full"></span>
                    </td>
                    <td class="px-5 py-3">
                        <span th:text="${row.status()}" th:classappend="${row.status().name() == 'NOT_STARTED'} ? 'bg-gray-100 text-gray-700' : (${row.status().name() == 'IN_PROGRESS'} ? 'bg-yellow-100 text-yellow-800' : (${row.status().name() == 'RESPONDED'} ? 'bg-green-100 text-green-800' : (${row.status().name() == 'DECLINED'} ? 'bg-red-100 text-red-800' : 'bg-gray-100 text-gray-600')))" class="text-xs font-medium px-2 py-0.5 rounded-full"></span>
                    </td>
                    <td class="px-5 py-3 text-gray-500">
                        <span th:if="${row.contactedAt() != null}"
                              th:text="${displayFmt.format(row.contactedAt())}"></span>
                        <span th:if="${row.contactedAt() == null}" class="text-gray-300">—</span>
                    </td>
                    <td class="px-5 py-3 text-gray-600 max-w-xs truncate" th:text="${row.notes()}"></td>
                    <td class="px-5 py-3">
                        <a th:href="@{/admin/outreach/{slug}(slug=${row.slug()})}"
                           class="text-primary-600 hover:underline text-xs mr-3">View</a>
                        <form th:action="@{/admin/outreach/{id}/delete(id=${row.id()})}" method="post" class="inline"
                              onsubmit="return confirm('Delete this outreach record?')">
                            <input type="hidden" name="slug" th:value="${row.slug()}"/>
                            <button type="submit" class="text-red-600 hover:underline text-xs">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</main>
</body>
</html>
