<!DOCTYPE html>
<!--
/**
 * Reset password page — centered card layout with Tailwind CSS.
 *
 * No nav bar (unauthenticated). Renders an error state (no form) when the
 * token is missing, expired, or already used; otherwise renders the new
 * password form with an eye toggle on each field.
 *
 * @author  Bill Blackmon
 * @version 1.0
 * @since   2026-08-17
 * @updated 2026-08-17
 */
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Reset Password')}">
</head>

<body class="bg-surface font-sans text-on-surface min-h-screen flex flex-col">

<!-- Header -->
<header class="bg-primary-600 text-white px-6 py-4 shadow-md">
    <h1 class="font-display text-2xl font-bold tracking-tight">AIHealthcare</h1>
    <p class="text-primary-200 text-sm mt-0.5">AI-in-Healthcare Intelligence Platform</p>
</header>

<!-- Centered card -->
<main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-lg shadow-lg p-8">

            <div th:if="${tokenValid == false}">
                <h2 class="font-display text-xl font-semibold text-on-surface mb-1">Link Invalid or Expired</h2>
                <div class="bg-red-50 border-l-4 border-red-500 text-red-800 text-sm p-3 mt-4 mb-4 rounded">
                    This password reset link is invalid or has expired.
                </div>
                <a th:href="@{/forgot-password}" class="text-primary-600 hover:text-primary-700 font-medium text-sm">Request a new link</a>
            </div>

            <div th:if="${tokenValid == true}">
                <h2 class="font-display text-xl font-semibold text-on-surface mb-1">Set a New Password</h2>
                <p class="text-sm text-on-surface-variant mb-6">Choose a new password for your account.</p>

                <!-- Error alert -->
                <div th:if="${error}"
                     class="bg-red-50 border-l-4 border-red-500 text-red-800 text-sm p-3 mb-4 rounded"
                     th:text="${error}">
                    Error message
                </div>

                <form th:action="@{/reset-password}" method="post" class="space-y-4">
                    <input type="hidden" name="token" th:value="${token}"/>

                    <div class="flex flex-col gap-1" x-data="{ show: false }">
                        <label for="newPassword" class="text-sm font-medium text-gray-700">New Password</label>
                        <div class="relative">
                            <input :type="show ? 'text' : 'password'" id="newPassword" name="newPassword"
                                   placeholder="Choose a new password" required autofocus
                                   class="w-full px-3 py-2 pr-10 border border-outline-variant rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-primary-600 focus:border-primary-600"/>
                            <button type="button" @click="show = !show" tabindex="-1"
                                    class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600">
                                <svg x-show="!show" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                </svg>
                                <svg x-show="show" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="flex flex-col gap-1" x-data="{ show: false }">
                        <label for="confirmPassword" class="text-sm font-medium text-gray-700">Confirm New Password</label>
                        <div class="relative">
                            <input :type="show ? 'text' : 'password'" id="confirmPassword" name="confirmPassword"
                                   placeholder="Confirm your new password" required
                                   class="w-full px-3 py-2 pr-10 border border-outline-variant rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-primary-600 focus:border-primary-600"/>
                            <button type="button" @click="show = !show" tabindex="-1"
                                    class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600">
                                <svg x-show="!show" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                </svg>
                                <svg x-show="show" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit"
                            class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-2.5 rounded-md text-sm transition-colors">
                        Reset Password
                    </button>
                </form>
            </div>

            <div class="mt-5 text-center text-sm text-on-surface-variant">
                <a th:href="@{/login}" class="text-primary-600 hover:text-primary-700 font-medium">Back to Sign In</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
