<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AIHealthcare — Access Denied</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f6fa;
            color: #333;
            font-size: 14px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #1a1a2e;
            color: white;
            padding: 1.25rem 2rem;
            display: flex;
            align-items: baseline;
            gap: 1.5rem;
        }
        header h1 { font-size: 1.25rem; font-weight: 600; }
        header p  { font-size: 0.8rem; opacity: 0.6; }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .denied-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            padding: 2.5rem;
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .denied-card .icon {
            font-size: 3rem;
            color: #dc2626;
            margin-bottom: 1rem;
        }

        .denied-card h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 0.5rem;
        }

        .denied-card .message {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .back-link {
            display: inline-block;
            padding: 0.65rem 1.5rem;
            border-radius: 8px;
            background: #0066cc;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
        }
        .back-link:hover { background: #004499; }
    </style>
</head>
<body>

<header>
    <h1>AIHealthcare</h1>
    <p>AI-in-Healthcare Intelligence Platform</p>
</header>

<main>
    <div class="denied-card">
        <div class="icon">&#x26D4;</div>
        <h2>Access Denied</h2>
        <p class="message">
            You do not have permission to view this page.
            This area is restricted to administrators.
        </p>
        <a th:href="@{/dashboard}" class="back-link">Back to Dashboard</a>
    </div>
</main>

</body>
</html>
