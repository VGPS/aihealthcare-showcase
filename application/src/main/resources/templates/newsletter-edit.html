<!DOCTYPE html>
<!--
/**
 * Newsletter Editor page — TinyMCE WYSIWYG editor for newsletter drafts.
 *
 * Displays newsletter metadata (title, week, status, generated date) and a
 * TinyMCE rich text editor for editing the HTML content. Supports save draft
 * and send-to-subscribers actions. Restyled with Tailwind CSS and shared fragments.
 *
 * @author  Bill Blackmon
 * @version 1.0
 * @since   2025-05-01
 * @updated 2026-07-28
 */
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Edit Newsletter')}">
</head>
<body class="bg-surface font-sans text-on-surface">

<header class="bg-primary-600 text-white px-6 py-4 shadow-md">
    <h1 class="font-display text-2xl font-bold tracking-tight">AIHealthcare</h1>
    <p class="text-primary-200 text-sm mt-0.5">Newsletter Editor</p>
</header>

<nav th:replace="~{fragments/nav :: nav('newsletter')}"></nav>

<main class="max-w-7xl mx-auto px-4 py-6">

    <div th:if="${saved}" class="bg-green-50 text-green-800 border border-green-200 rounded-md px-5 py-3 mb-5 text-sm">
        Draft saved successfully.
    </div>

    <!-- Metadata bar -->
    <div class="bg-white rounded-lg shadow-sm px-6 py-4 mb-4 flex flex-wrap gap-8 items-center">
        <div>
            <div class="text-xs uppercase text-gray-400">Title</div>
            <div class="text-sm" th:text="${run.title}">-</div>
        </div>
        <div>
            <div class="text-xs uppercase text-gray-400">Week Of</div>
            <div class="text-sm" th:text="${run.weekOf}">-</div>
        </div>
        <div>
            <div class="text-xs uppercase text-gray-400">Status</div>
            <span class="status-badge"
                  th:classappend="'status-' + ${run.status.name()}"
                  th:text="${run.status.name()}">DRAFT</span>
        </div>
        <div>
            <div class="text-xs uppercase text-gray-400">Generated</div>
            <div class="text-sm" th:text="${generatedAtFormatted}">-</div>
        </div>
    </div>

    <!-- Editor -->
    <div class="bg-white rounded-lg shadow-sm p-6 mb-4">
        <form id="saveForm" method="post"
              th:action="@{/newsletter/runs/{id}/save(id=${run.runId})}">
            <textarea id="htmlEditor" name="htmlContent"
                      th:text="${htmlContent}"
                      class="w-full min-h-[400px]"></textarea>

            <div class="flex gap-3 items-center mt-4 flex-wrap">
                <a th:href="@{/newsletter/runs}"
                   class="inline-block px-5 py-2 rounded-md text-sm font-medium bg-gray-500 text-white hover:bg-gray-600 no-underline text-center">Cancel</a>
                <button type="submit"
                        class="inline-block px-5 py-2 rounded-md text-sm font-medium bg-primary-600 text-white hover:bg-primary-700 cursor-pointer border-none">Save Draft</button>
                <button type="button" id="sendBtn"
                        class="inline-block px-5 py-2 rounded-md text-sm font-medium bg-green-600 text-white hover:bg-green-700 cursor-pointer border-none">Send Newsletter</button>
                <button type="button" onclick="exportNewsletterDoc()"
                        class="inline-block px-5 py-2 rounded-md text-sm font-medium bg-white text-gray-700 hover:bg-gray-50 cursor-pointer border border-gray-300">Save As DOC</button>
                <button type="button" onclick="exportNewsletterTxt()"
                        class="inline-block px-5 py-2 rounded-md text-sm font-medium bg-white text-gray-700 hover:bg-gray-50 cursor-pointer border border-gray-300">Save As TXT</button>
            </div>
        </form>

        <!-- Hidden send form -->
        <form id="sendForm" method="post"
              th:action="@{/newsletter/runs/{id}/send(id=${run.runId})}"
              class="hidden">
        </form>
    </div>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<!-- TinyMCE via WebJars -->
<script th:src="@{/webjars/tinymce/7.9.0/tinymce.min.js}"></script>
<script>
    tinymce.init({
        selector: '#htmlEditor',
        height: 600,
        menubar: false,
        plugins: 'link lists code',
        toolbar: 'undo redo | bold italic underline | h1 h2 h3 | bullist numlist | link | code',
        content_style: 'body { font-family: Arial, sans-serif; max-width: 800px; margin: 0 auto; padding: 10px; }',
        promotion: false,
        license_key: 'gpl'
    });

    document.getElementById('sendBtn').addEventListener('click', function() {
        if (confirm('Send this newsletter to all active subscribers?')) {
            document.getElementById('sendForm').submit();
        }
    });

    function exportNewsletterDoc() {
        var content = tinymce.activeEditor ? tinymce.activeEditor.getContent() : document.getElementById('htmlEditor').value;
        var title   = document.querySelector('[data-title]') ? document.querySelector('[data-title]').textContent : 'AI Healthcare Newsletter';
        var doc = '<html xmlns:o="urn:schemas-microsoft-com:office:office" '
                + 'xmlns:w="urn:schemas-microsoft-com:office:word" '
                + 'xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8">'
                + '<title>' + title + '</title>'
                + '<style>body{font-family:Calibri,Arial,sans-serif;font-size:11pt;line-height:1.6;max-width:700px;margin:0 auto;padding:20px;}'
                + 'strong{font-weight:bold;}a{color:#0066cc;}blockquote{border-left:3px solid #0066cc;padding:8px 16px;margin:12px 0;}</style>'
                + '</head><body>' + content + '</body></html>';
        var blob = new Blob(['﻿' + doc], { type: 'application/msword' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'newsletter-' + new Date().toISOString().slice(0,10) + '.doc';
        a.click();
        URL.revokeObjectURL(a.href);
    }

    function exportNewsletterTxt() {
        var content = tinymce.activeEditor ? tinymce.activeEditor.getContent() : document.getElementById('htmlEditor').value;
        var tmp = document.createElement('div');
        tmp.innerHTML = content;
        var text = tmp.innerText || tmp.textContent || '';
        var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'newsletter-' + new Date().toISOString().slice(0,10) + '.txt';
        a.click();
        URL.revokeObjectURL(a.href);
    }
</script>
</body>
</html>
