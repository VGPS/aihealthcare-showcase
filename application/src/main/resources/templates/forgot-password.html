<!DOCTYPE html>
<!--
/**
 * Forgot password page — centered card layout with Tailwind CSS.
 *
 * No nav bar (unauthenticated). Always shows a generic confirmation on
 * submit, regardless of whether the email is registered, so this page
 * cannot be used to enumerate accounts.
 *
 * @author  Bill Blackmon
 * @version 1.0
 * @since   2026-08-17
 * @updated 2026-08-17
 */
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Forgot Password')}">
</head>

<body class="bg-surface font-sans text-on-surface min-h-screen flex flex-col">

<!-- Header -->
<header class="bg-primary-600 text-white px-6 py-4 shadow-md">
    <h1 class="font-display text-2xl font-bold tracking-tight">AIHealthcare</h1>
    <p class="text-primary-200 text-sm mt-0.5">AI-in-Healthcare Intelligence Platform</p>
</header>

<!-- Centered card -->
<main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-lg shadow-lg p-8">

            <div th:if="${submitted == null}">
                <h2 class="font-display text-xl font-semibold text-on-surface mb-1">Forgot Password?</h2>
                <p class="text-sm text-on-surface-variant mb-6">Enter your account email and we'll send you a link to reset your password.</p>

                <form th:action="@{/forgot-password}" method="post" class="space-y-4">
                    <div class="flex flex-col gap-1">
                        <label for="email" class="text-sm font-medium text-gray-700">Email</label>
                        <input type="email" id="email" name="email"
                               placeholder="you@example.com" required autofocus
                               class="px-3 py-2 border border-outline-variant rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-primary-600 focus:border-primary-600"/>
                    </div>

                    <button type="submit"
                            class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-2.5 rounded-md text-sm transition-colors">
                        Send Reset Link
                    </button>
                </form>
            </div>

            <div th:if="${submitted != null}">
                <h2 class="font-display text-xl font-semibold text-on-surface mb-1">Check Your Email</h2>
                <div class="bg-green-50 border-l-4 border-green-500 text-green-800 text-sm p-3 mt-4 rounded">
                    If an account exists for that email, a password reset link is on its way. It expires in 60 minutes.
                </div>
            </div>

            <div class="mt-5 text-center text-sm text-on-surface-variant">
                <a th:href="@{/login}" class="text-primary-600 hover:text-primary-700 font-medium">Back to Sign In</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
