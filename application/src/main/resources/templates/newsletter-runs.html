<!DOCTYPE html>
<!--
/**
 * Newsletter Runs listing page — displays all newsletter runs with status badges.
 *
 * Shows a table of newsletter runs (DRAFT, SENT, ARCHIVED) with edit links for
 * drafts. Includes flash message for successful newsletter delivery.
 * Restyled with Tailwind CSS and shared fragments.
 *
 * @author  Bill Blackmon
 * @version 1.0
 * @since   2025-05-01
 * @updated 2026-07-28
 */
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Newsletter Runs')}">
</head>
<body class="bg-surface font-sans text-on-surface">

<header class="bg-primary-600 text-white px-6 py-4 shadow-md">
    <h1 class="font-display text-2xl font-bold tracking-tight">AIHealthcare</h1>
    <p class="text-primary-200 text-sm mt-0.5">Newsletter Runs</p>
</header>

<nav th:replace="~{fragments/nav :: nav('newsletter')}"></nav>

<main class="max-w-7xl mx-auto px-4 py-6">

    <div th:if="${param.sent != null}" class="bg-green-50 text-green-800 border border-green-200 rounded-md px-5 py-3 mb-5 text-sm">
        Newsletter delivered to subscribers successfully.
    </div>

    <div class="bg-white rounded-lg shadow-sm p-6 mb-5">
        <div class="border-b-2 border-gray-100 pb-3 mb-5">
            <h2 class="font-display text-lg font-semibold text-on-surface">Newsletter Runs</h2>
        </div>

        <div th:if="${#lists.isEmpty(runs)}" class="text-center py-8 text-gray-400 text-sm">
            No newsletter runs found. Generate a newsletter first via the API.
        </div>

        <table th:if="${!#lists.isEmpty(runs)}">
            <thead>
                <tr>
                    <th>Run ID</th>
                    <th>Title</th>
                    <th>Week Of</th>
                    <th>Status</th>
                    <th>Generated</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="run : ${runs}">
                    <td th:text="${run.runId}">-</td>
                    <td th:text="${run.title}">-</td>
                    <td th:text="${run.weekOf}">-</td>
                    <td>
                        <span class="status-badge"
                              th:classappend="'status-' + ${run.status.name()}"
                              th:text="${run.status.name()}">DRAFT</span>
                    </td>
                    <td th:text="${runTimestamps.getOrDefault(run.runId, '-')}">-</td>
                    <td>
                        <a th:if="${run.status.name() == 'DRAFT'}"
                           th:href="@{/newsletter/runs/{id}/edit(id=${run.runId})}"
                           class="text-primary-600 font-medium no-underline hover:underline">Edit</a>
                        <span th:if="${run.status.name() != 'DRAFT'}"
                              class="text-gray-400 text-xs">View only</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</main>
</body>
</html>
