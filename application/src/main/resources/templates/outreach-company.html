<!DOCTYPE html>
<!--
/**
 * Company Outreach CRM — company detail view.
 *
 * Shows all outreach rows and contacts for a single company slug.
 * Provides inline status/notes editing and add-contact form.
 * Restricted to ADMIN role.
 *
 * @author  Bill Blackmon
 * @version 1.0
 * @since   2026-10-03
 * @updated 2026-10-03
 */
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Outreach — Company Detail')}">
</head>
<body class="bg-surface font-sans text-on-surface">

<header class="bg-primary-600 text-white px-6 py-4 shadow-md">
    <div class="flex items-center gap-3">
        <a th:href="@{/admin/outreach}" class="text-primary-200 hover:text-white text-sm">← Outreach CRM</a>
        <span class="text-primary-300">/</span>
        <h1 class="font-display text-2xl font-bold tracking-tight" th:text="${slug}"></h1>
    </div>
    <p class="text-primary-200 text-sm mt-0.5">Outreach records and contacts</p>
</header>

<nav th:replace="~{fragments/nav :: nav('admin-outreach')}"></nav>

<main class="max-w-7xl mx-auto px-4 py-6 space-y-8">

    <!-- Flash messages -->
    <div th:if="${successMsg}" class="bg-green-50 border-l-4 border-green-500 text-green-800 text-sm p-3 rounded"
         th:text="${successMsg}"></div>
    <div th:if="${errorMsg}" class="bg-red-50 border-l-4 border-red-500 text-red-800 text-sm p-3 rounded"
         th:text="${errorMsg}"></div>

    <!-- ── Outreach rows ── -->
    <section>
        <h2 class="text-lg font-semibold text-gray-800 mb-3">
            Outreach Records for <span th:text="${companyName}" class="text-primary-700"></span>
        </h2>

        <div th:if="${outreachRows.isEmpty()}" class="text-sm text-gray-400 italic">No outreach rows for this company yet.</div>

        <div th:each="row : ${outreachRows}"
             class="bg-white rounded-lg shadow-sm border border-gray-200 p-5 mb-4">
            <div class="flex flex-wrap gap-3 items-center mb-3">
                <span th:text="${row.purpose()}" th:classappend="${row.purpose().name() == 'EMPLOYMENT'} ? 'bg-blue-100 text-blue-800' : 'bg-purple-100 text-purple-800'" class="text-xs font-medium px-2 py-0.5 rounded-full"></span>
                <span th:text="${row.status()}" th:classappend="${row.status().name() == 'NOT_STARTED'} ? 'bg-gray-100 text-gray-700' : (${row.status().name() == 'IN_PROGRESS'} ? 'bg-yellow-100 text-yellow-800' : (${row.status().name() == 'RESPONDED'} ? 'bg-green-100 text-green-800' : (${row.status().name() == 'DECLINED'} ? 'bg-red-100 text-red-800' : 'bg-gray-100 text-gray-600')))" class="text-xs font-medium px-2 py-0.5 rounded-full"></span>
                <span th:if="${row.contactedAt() != null}" class="text-xs text-gray-400"
                      th:text="'Contacted: ' + ${displayFmt.format(row.contactedAt())}"></span>
            </div>

            <!-- Status update -->
            <form th:action="@{/admin/outreach/{id}/status(id=${row.id()})}" method="post"
                  class="flex gap-2 items-center mb-3">
                <input type="hidden" name="slug" th:value="${slug}"/>
                <select name="status" class="border border-gray-300 rounded px-2 py-1 text-sm">
                    <option th:each="s : ${outreachStatuses}" th:value="${s}" th:text="${s}"
                            th:selected="${s == row.status()}"></option>
                </select>
                <button type="submit" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs px-3 py-1.5 rounded transition-colors">
                    Update Status
                </button>
            </form>

            <!-- Notes update -->
            <form th:action="@{/admin/outreach/{id}/notes(id=${row.id()})}" method="post"
                  class="flex gap-2 items-start mb-3">
                <input type="hidden" name="slug" th:value="${slug}"/>
                <textarea name="notes" rows="2" th:text="${row.notes()}"
                          placeholder="Notes..."
                          class="flex-1 border border-gray-300 rounded px-2 py-1 text-sm resize-y focus:outline-none focus:ring-1 focus:ring-primary-400"></textarea>
                <button type="submit" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs px-3 py-1.5 rounded transition-colors mt-0.5">
                    Save Notes
                </button>
            </form>

            <!-- Delete -->
            <form th:action="@{/admin/outreach/{id}/delete(id=${row.id()})}" method="post" class="inline"
                  onsubmit="return confirm('Delete this outreach record?')">
                <input type="hidden" name="slug" th:value="${slug}"/>
                <button type="submit" class="text-red-500 hover:text-red-700 text-xs">Delete Record</button>
            </form>
        </div>

        <!-- Add outreach row for this company -->
        <div class="bg-gray-50 rounded-lg border border-dashed border-gray-300 p-4">
            <p class="text-xs font-medium text-gray-500 mb-2">Add another outreach row for this company</p>
            <form th:action="@{/admin/outreach/add}" method="post" class="flex gap-3 items-end flex-wrap">
                <input type="hidden" name="slug" th:value="${slug}"/>
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-medium text-gray-600">Purpose</label>
                    <select name="purpose" class="border border-gray-300 rounded px-2 py-1.5 text-sm">
                        <option th:each="p : ${purposes}" th:value="${p}" th:text="${p}"></option>
                    </select>
                </div>
                <div class="flex flex-col gap-1 flex-1 min-w-40">
                    <label class="text-xs font-medium text-gray-600">Notes (optional)</label>
                    <input type="text" name="notes" placeholder="Notes..."
                           class="border border-gray-300 rounded px-2 py-1.5 text-sm"/>
                </div>
                <button type="submit"
                        class="bg-primary-600 hover:bg-primary-700 text-white text-sm px-4 py-1.5 rounded transition-colors">
                    Add
                </button>
            </form>
        </div>
    </section>

    <!-- ── Contacts ── -->
    <section>
        <h2 class="text-lg font-semibold text-gray-800 mb-3">
            Contacts
            <span class="text-sm font-normal text-gray-400 ml-2"
                  th:text="${contacts.size()} + ' person(s)'"></span>
        </h2>

        <div th:if="${contacts.isEmpty()}" class="text-sm text-gray-400 italic mb-4">No contacts yet.</div>

        <!-- Contacts table -->
        <div th:if="${!contacts.isEmpty()}"
             class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden mb-6">
            <table class="w-full text-sm">
                <thead class="bg-gray-50 text-xs text-gray-500 uppercase tracking-wide">
                    <tr>
                        <th class="px-4 py-3 text-left">Name</th>
                        <th class="px-4 py-3 text-left">Title</th>
                        <th class="px-4 py-3 text-left">Email</th>
                        <th class="px-4 py-3 text-left">LinkedIn</th>
                        <th class="px-4 py-3 text-left">Source</th>
                        <th class="px-4 py-3 text-left">Status</th>
                        <th class="px-4 py-3 text-left">Notes</th>
                        <th class="px-4 py-3 text-left">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                    <tr th:each="c : ${contacts}" class="hover:bg-gray-50 align-top">
                        <td class="px-4 py-3 font-medium whitespace-nowrap" th:text="${c.fullName()}"></td>
                        <td class="px-4 py-3 text-gray-500 whitespace-nowrap" th:text="${c.jobTitle()}"></td>
                        <td class="px-4 py-3">
                            <a th:if="${c.email() != null}" th:href="'mailto:' + ${c.email()}"
                               class="text-primary-600 hover:underline text-xs" th:text="${c.email()}"></a>
                            <span th:if="${c.email() == null}" class="text-gray-300 text-xs">—</span>
                        </td>
                        <td class="px-4 py-3">
                            <a th:if="${c.linkedinUrl() != null}" th:href="${c.linkedinUrl()}" target="_blank"
                               class="text-primary-600 hover:underline text-xs">LinkedIn ↗</a>
                            <span th:if="${c.linkedinUrl() == null}" class="text-gray-300 text-xs">—</span>
                        </td>
                        <td class="px-4 py-3 text-gray-500 text-xs" th:text="${c.source()}"></td>
                        <td class="px-4 py-3">
                            <form th:action="@{/admin/outreach/contacts/{id}/status(id=${c.id()})}" method="post"
                                  class="flex gap-1 items-center">
                                <input type="hidden" name="slug" th:value="${slug}"/>
                                <select name="status" class="border border-gray-300 rounded px-1.5 py-1 text-xs">
                                    <option th:each="s : ${contactStatuses}" th:value="${s}" th:text="${s}"
                                            th:selected="${s == c.status()}"></option>
                                </select>
                                <button type="submit"
                                        class="bg-gray-100 hover:bg-gray-200 text-gray-600 text-xs px-2 py-1 rounded transition-colors">
                                    ✓
                                </button>
                            </form>
                        </td>
                        <td class="px-4 py-3 text-gray-500 text-xs max-w-xs" th:text="${c.notes()}"></td>
                        <td class="px-4 py-3">
                            <form th:action="@{/admin/outreach/contacts/{id}/delete(id=${c.id()})}" method="post"
                                  class="inline" onsubmit="return confirm('Delete this contact?')">
                                <input type="hidden" name="slug" th:value="${slug}"/>
                                <button type="submit" class="text-red-500 hover:text-red-700 text-xs">Delete</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Add contact form -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-5">
            <h3 class="text-sm font-semibold text-gray-700 mb-4">Add Contact</h3>
            <form th:action="@{/admin/outreach/{slug}/contacts/add(slug=${slug})}" method="post"
                  class="grid grid-cols-2 gap-3 sm:grid-cols-3">
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-medium text-gray-600">Full Name *</label>
                    <input type="text" name="fullName" required
                           class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-primary-400"/>
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-medium text-gray-600">Job Title</label>
                    <input type="text" name="jobTitle"
                           class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none"/>
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-medium text-gray-600">Email</label>
                    <input type="email" name="email"
                           class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none"/>
                </div>
                <div class="flex flex-col gap-1 col-span-2">
                    <label class="text-xs font-medium text-gray-600">LinkedIn URL</label>
                    <input type="url" name="linkedinUrl" placeholder="https://linkedin.com/in/..."
                           class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none"/>
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-medium text-gray-600">Source</label>
                    <select name="source" class="border border-gray-300 rounded px-3 py-2 text-sm">
                        <option th:each="s : ${contactSources}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
                <div class="flex flex-col gap-1 col-span-3">
                    <label class="text-xs font-medium text-gray-600">Notes</label>
                    <input type="text" name="notes" placeholder="Optional notes..."
                           class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none"/>
                </div>
                <div class="col-span-3">
                    <button type="submit"
                            class="bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium px-6 py-2 rounded transition-colors">
                        Add Contact
                    </button>
                </div>
            </form>
        </div>
    </section>

</main>
</body>
</html>
