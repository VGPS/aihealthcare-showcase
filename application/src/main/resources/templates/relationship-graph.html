<!DOCTYPE html>
<!--
/**
 * Company Relationship Graph — interactive force-directed visualization of
 * partnerships, acquisitions, investments, and integrations in AI Healthcare.
 *
 * @author  Bill Blackmon
 * @version 1.0
 * @since   2026-08-30
 * @updated 2026-08-30
 */
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Company Relationship Graph')}">
</head>

<body class="bg-surface font-sans text-on-surface">

<header class="bg-primary-600 text-white px-6 py-4 shadow-md">
    <h1 class="font-display text-2xl font-bold tracking-tight">Company Relationship Graph</h1>
    <p class="text-primary-200 text-sm mt-0.5">Partnerships, acquisitions, investments, and integrations in AI Healthcare</p>
</header>

<nav th:replace="~{fragments/nav :: nav('relationships')}"></nav>

<main class="max-w-7xl mx-auto px-4 py-6">

    <!-- Tab bar: Table | Graph -->
    <div class="flex gap-0 mb-6 border-b border-gray-200">
        <a th:href="@{/dashboard/relationships}"
           class="px-5 py-2.5 text-sm font-medium text-gray-500 hover:text-gray-700 border-b-2 border-transparent">
            Table
        </a>
        <a th:href="@{/dashboard/relationships/graph}"
           class="px-5 py-2.5 text-sm font-medium text-primary-600 border-b-2 border-primary-600">
            Graph
        </a>
    </div>

    <!-- Type filter checkboxes -->
    <div class="bg-white rounded-lg shadow-card p-4 mb-4 flex flex-wrap gap-4 items-center">
        <span class="text-sm font-medium text-gray-700 mr-1">Show:</span>
        <label class="flex items-center gap-1.5 text-sm cursor-pointer select-none">
            <input type="checkbox" value="PARTNERSHIP" checked onchange="onFilterChange(this)"
                   class="rounded border-gray-300 text-blue-500 focus:ring-blue-400"/>
            <span class="inline-block w-2.5 h-2.5 rounded-full flex-shrink-0" style="background:#3B82F6;"></span>
            Partnership
        </label>
        <label class="flex items-center gap-1.5 text-sm cursor-pointer select-none">
            <input type="checkbox" value="ACQUISITION" checked onchange="onFilterChange(this)"
                   class="rounded border-gray-300 text-red-500 focus:ring-red-400"/>
            <span class="inline-block w-2.5 h-2.5 rounded-full flex-shrink-0" style="background:#EF4444;"></span>
            Acquisition
        </label>
        <label class="flex items-center gap-1.5 text-sm cursor-pointer select-none">
            <input type="checkbox" value="INVESTMENT" checked onchange="onFilterChange(this)"
                   class="rounded border-gray-300 text-green-500 focus:ring-green-400"/>
            <span class="inline-block w-2.5 h-2.5 rounded-full flex-shrink-0" style="background:#22C55E;"></span>
            Investment
        </label>
        <label class="flex items-center gap-1.5 text-sm cursor-pointer select-none">
            <input type="checkbox" value="COMPETITOR" checked onchange="onFilterChange(this)"
                   class="rounded border-gray-300 text-orange-500 focus:ring-orange-400"/>
            <span class="inline-block w-2.5 h-2.5 rounded-full flex-shrink-0" style="background:#F97316;"></span>
            Competitor
        </label>
        <label class="flex items-center gap-1.5 text-sm cursor-pointer select-none">
            <input type="checkbox" value="SUPPLIER" checked onchange="onFilterChange(this)"
                   class="rounded border-gray-300 text-gray-500 focus:ring-gray-400"/>
            <span class="inline-block w-2.5 h-2.5 rounded-full flex-shrink-0" style="background:#6B7280;"></span>
            Supplier
        </label>
        <label class="flex items-center gap-1.5 text-sm cursor-pointer select-none">
            <input type="checkbox" value="INTEGRATION" checked onchange="onFilterChange(this)"
                   class="rounded border-gray-300 text-purple-500 focus:ring-purple-400"/>
            <span class="inline-block w-2.5 h-2.5 rounded-full flex-shrink-0" style="background:#A855F7;"></span>
            Integration
        </label>
        <span class="ml-auto text-xs text-gray-400" id="graph-node-count"></span>
    </div>

    <!-- Graph canvas + sidebar -->
    <div class="flex gap-4">
        <div id="network-container"
             class="flex-1 bg-white rounded-lg shadow-card border border-gray-100"
             style="height:620px; min-width:0; position:relative;">
            <div id="graph-loading" class="absolute inset-0 flex items-center justify-center text-gray-400 text-sm">
                Loading graph data…
            </div>
        </div>
        <div id="sidebar"
             class="hidden w-72 flex-shrink-0 bg-white rounded-lg shadow-card p-5 text-sm overflow-y-auto border border-gray-100"
             style="height:620px;">
            <div class="flex justify-between items-start mb-3">
                <span class="text-xs font-medium text-gray-400 uppercase tracking-wide" id="sidebar-type-label">Selection</span>
                <button onclick="hideSidebar()" class="text-gray-300 hover:text-gray-500 text-lg leading-none">&times;</button>
            </div>
            <div id="sidebar-content"></div>
        </div>
    </div>

    <!-- Empty state (shown when graph loads with 0 nodes) -->
    <div id="graph-empty" class="hidden mt-6 bg-white rounded-lg shadow-card p-12 text-center text-gray-400">
        <div class="text-4xl mb-3">&#128257;</div>
        <div class="font-medium text-gray-600 mb-1">No relationship data yet</div>
        <div class="text-sm">Run the detection pipeline to populate the graph.</div>
        <a th:href="@{/admin/pipelines}" class="inline-block mt-4 text-sm text-primary-600 hover:underline">
            Go to Pipelines &rarr;
        </a>
    </div>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<!-- vis-network standalone build (pinned version, CDN) -->
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>

<script>
(function () {
    var EDGE_COLORS = {
        PARTNERSHIP: '#3B82F6',
        ACQUISITION: '#EF4444',
        COMPETITOR:  '#F97316',
        INVESTMENT:  '#22C55E',
        SUPPLIER:    '#6B7280',
        INTEGRATION: '#A855F7'
    };

    var EDGE_VERBS = {
        PARTNERSHIP: 'partners with',
        ACQUISITION: 'acquires',
        COMPETITOR:  'competes with',
        INVESTMENT:  'invests in',
        SUPPLIER:    'supplies',
        INTEGRATION: 'integrates with'
    };

    // Track which types are currently visible
    var activeTypes = {
        PARTNERSHIP: true, ACQUISITION: true, INVESTMENT: true,
        COMPETITOR:  true, SUPPLIER:    true, INTEGRATION: true
    };

    var allNodes = [];
    var allEdges = [];
    var network;
    var nodesDs;
    var edgesDs;

    function esc(s) {
        if (!s) { return ''; }
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    // Load graph data from the REST endpoint
    fetch('/api/v1/relationships/graph')
        .then(function (r) { return r.json(); })
        .then(function (data) {
            document.getElementById('graph-loading').style.display = 'none';
            if (!data.nodes || data.nodes.length === 0) {
                document.getElementById('graph-empty').classList.remove('hidden');
                return;
            }
            allNodes = data.nodes;
            allEdges = data.edges;
            updateNodeCount(data.nodes.length, data.edges.length);
            initNetwork(data.nodes, data.edges);
        })
        .catch(function () {
            var el = document.getElementById('graph-loading');
            if (el) { el.textContent = 'Error loading graph data. Please refresh.'; }
        });

    function updateNodeCount(nodeCount, edgeCount) {
        var el = document.getElementById('graph-node-count');
        if (el) {
            el.textContent = nodeCount + ' companies · ' + edgeCount + ' relationships';
        }
    }

    function buildVisEdges(edges) {
        var result = [];
        for (var i = 0; i < edges.length; i++) {
            var e = edges[i];
            result.push({
                id:          e.id,
                from:        e.from,
                to:          e.to,
                label:       EDGE_VERBS[e.label] || e.label.toLowerCase(),
                typeKey:     e.label,
                value:       e.value,
                width:       2,
                color:       { color: e.color, highlight: e.color, hover: e.color, inherit: false },
                evidenceUrl: e.evidenceUrl,
                summary:     e.summary,
                detectedAt:  e.detectedAt
            });
        }
        return result;
    }

    function buildVisNodes(nodes) {
        var result = [];
        for (var i = 0; i < nodes.length; i++) {
            var n = nodes[i];
            result.push({ id: n.id, label: n.label, value: n.value, size: 22 });
        }
        return result;
    }

    function initNetwork(nodes, edges) {
        var container = document.getElementById('network-container');
        nodesDs = new vis.DataSet(buildVisNodes(nodes));
        edgesDs = new vis.DataSet(buildVisEdges(edges));

        var options = {
            nodes: {
                shape: 'dot',
                size: 22,
                scaling: {
                    min: 18,
                    max: 45,
                    label: { enabled: true, min: 12, max: 18, drawThreshold: 5 }
                },
                font: { size: 13, face: 'Inter, ui-sans-serif, sans-serif', color: '#374151' },
                borderWidth: 2,
                borderWidthSelected: 3,
                color: {
                    background: '#EFF6FF',
                    border: '#3B82F6',
                    highlight: { background: '#DBEAFE', border: '#1D4ED8' },
                    hover:     { background: '#FEF9C3', border: '#CA8A04' }
                }
            },
            edges: {
                scaling: { min: 1, max: 4 },
                arrows: { to: { enabled: true, scaleFactor: 0.5 } },
                smooth: { enabled: true, type: 'dynamic' },
                font: { size: 10, align: 'middle', strokeWidth: 2, strokeColor: '#ffffff' },
                selectionWidth: 3
            },
            physics: {
                stabilization: { enabled: true, iterations: 250, fit: true },
                barnesHut: {
                    gravitationalConstant: -25000,
                    springConstant: 0.04,
                    springLength: 160,
                    damping: 0.09
                }
            },
            interaction: {
                hover: true,
                hoverConnectedEdges: true,
                hideEdgesOnDrag: true,
                navigationButtons: false,
                keyboard: false
            }
        };

        network = new vis.Network(container, { nodes: nodesDs, edges: edgesDs }, options);

        // Use selectNode/selectEdge — more reliable than generic 'click' in vis-network 9.x
        network.on('selectNode', function (params) {
            if (params.nodes.length > 0) { showNodeSidebar(params.nodes[0]); }
        });
        network.on('selectEdge', function (params) {
            if (params.edges.length > 0) { showEdgeSidebar(params.edges[0]); }
        });
        network.on('deselectNode', hideSidebar);
        network.on('deselectEdge', hideSidebar);

        network.on('stabilizationIterationsDone', function () {
            network.setOptions({ physics: { enabled: false } });
        });
    }

    function showNodeSidebar(nodeId) {
        var node = nodesDs.get(nodeId);
        if (!node) { return; }

        var nodeEdges = [];
        var rawEdges = edgesDs.get();
        for (var i = 0; i < rawEdges.length; i++) {
            var e = rawEdges[i];
            if (e.from === nodeId || e.to === nodeId) { nodeEdges.push(e); }
        }

        var html = '<h3 class="font-semibold text-gray-900 text-base mb-1">' + esc(node.label) + '</h3>';
        html += '<div class="text-gray-400 text-xs mb-4">' + nodeEdges.length + ' relationship' + (nodeEdges.length !== 1 ? 's' : '') + '</div>';
        html += '<div class="space-y-4">';

        for (var j = 0; j < nodeEdges.length; j++) {
            html += buildRelCard(nodeEdges[j], nodeId);
        }

        html += '</div>';
        html += '<div class="mt-5 pt-4 border-t border-gray-100">';
        html += '<a href="/dashboard/relationships?company=' + encodeURIComponent(nodeId) + '" ';
        html += 'class="text-xs text-primary-600 hover:underline">View in table &rarr;</a>';
        html += '</div>';

        document.getElementById('sidebar-type-label').textContent = 'Company';
        document.getElementById('sidebar-content').innerHTML = html;
        document.getElementById('sidebar').classList.remove('hidden');
    }

    // Shared card builder used by both edge-click and node-click sidebars.
    // focusNodeId is optional — when set, the sentence bolds that company name.
    function buildRelCard(edge, focusNodeId) {
        var edgeType = edge.typeKey || edge.label;
        var dotColor = EDGE_COLORS[edgeType] || '#6B7280';
        var verb     = EDGE_VERBS[edgeType] || edgeType.toLowerCase();
        var confPct  = Math.round((edge.value || 0) * 100);

        var fromPart = (focusNodeId && edge.from === focusNodeId)
            ? '<strong>' + esc(edge.from) + '</strong>'
            : esc(edge.from);
        var toPart = (focusNodeId && edge.to === focusNodeId)
            ? '<strong>' + esc(edge.to) + '</strong>'
            : esc(edge.to);

        var html = '<div class="border-l-2 pl-3 py-1" style="border-color:' + dotColor + ';">';
        html += '<div class="text-xs font-semibold mb-1" style="color:' + dotColor + ';">' + esc(edgeType) + '</div>';
        html += '<div class="text-sm text-gray-800 mb-2">';
        html += fromPart + ' <span class="italic text-gray-500">' + verb + '</span> ' + toPart;
        html += '</div>';

        // Confidence bar
        html += '<div class="flex items-center gap-2 mb-2">';
        html += '<div class="flex-1 bg-gray-200 rounded-full h-1.5">';
        html += '<div class="h-1.5 rounded-full" style="width:' + confPct + '%;background:' + dotColor + ';"></div>';
        html += '</div>';
        html += '<span class="text-xs font-mono text-gray-500 w-10 text-right">Conf ' + confPct + '%</span>';
        html += '</div>';

        // Detected date
        if (edge.detectedAt) {
            html += '<div class="text-xs text-gray-400 mb-2">Detected: ' + esc(edge.detectedAt) + '</div>';
        }

        // Summary
        if (edge.summary) {
            html += '<div class="text-xs text-gray-600 mb-2 italic">' + esc(edge.summary) + '</div>';
        }

        // Evidence article link (only render as link when it looks like a URL)
        if (edge.evidenceUrl) {
            html += '<div class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-0.5">Evidence Article</div>';
            if (edge.evidenceUrl.indexOf('http') === 0) {
                html += '<a href="' + esc(edge.evidenceUrl) + '" target="_blank" rel="noopener noreferrer" ';
                html += 'class="text-xs text-primary-600 hover:underline break-all">' + esc(edge.evidenceUrl) + '</a>';
            } else {
                html += '<span class="text-xs text-gray-500">' + esc(edge.evidenceUrl) + '</span>';
            }
        }

        html += '</div>';
        return html;
    }

    function showEdgeSidebar(edgeId) {
        var edge = edgesDs.get(edgeId);
        if (!edge) { return; }

        var html = buildRelCard(edge, null);

        document.getElementById('sidebar-type-label').textContent = 'Relationship';
        document.getElementById('sidebar-content').innerHTML = html;
        document.getElementById('sidebar').classList.remove('hidden');
    }

    function hideSidebar() {
        document.getElementById('sidebar').classList.add('hidden');
    }
    window.hideSidebar = hideSidebar;

    function onFilterChange(checkbox) {
        activeTypes[checkbox.value] = checkbox.checked;
        applyFilters();
    }
    window.onFilterChange = onFilterChange;

    function applyFilters() {
        var filteredEdges = [];
        for (var i = 0; i < allEdges.length; i++) {
            if (activeTypes[allEdges[i].label]) {
                filteredEdges.push(allEdges[i]);
            }
        }

        // Only show nodes that appear in at least one visible edge
        var visibleIds = {};
        for (var j = 0; j < filteredEdges.length; j++) {
            visibleIds[filteredEdges[j].from] = true;
            visibleIds[filteredEdges[j].to]   = true;
        }
        var filteredNodes = [];
        for (var k = 0; k < allNodes.length; k++) {
            if (visibleIds[allNodes[k].id]) {
                filteredNodes.push(allNodes[k]);
            }
        }

        nodesDs.clear();
        edgesDs.clear();
        nodesDs.add(buildVisNodes(filteredNodes));
        edgesDs.add(buildVisEdges(filteredEdges));
        updateNodeCount(filteredNodes.length, filteredEdges.length);

        if (network) {
            network.setOptions({ physics: { enabled: true } });
            setTimeout(function () {
                if (network) {
                    network.setOptions({ physics: { enabled: false } });
                }
            }, 1500);
        }
    }
})();
</script>

</body>
</html>
