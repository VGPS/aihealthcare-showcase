  - id: trend-detection
    feature: "Trend Detection"
    menu_path: "Intelligence & Analysis > Trends"
    url: "/dashboard/trends"
    slot: { week: 3, weekday: MONDAY }
    theme: signal
    hook: >
      The useful question about a healthcare-AI buzzword isn't whether it's
      big. It's whether it's still accelerating.
    body: |
      The useful question about any healthcare-AI term isn't whether it's big.
      It's whether it's still accelerating.

      Big and flat means you're late. Small and rising means you're early.
      The word itself tells you nothing — only the derivative does.

      So trend detection runs keyword frequency analysis across 30, 90, and
      180-day windows and sorts the vocabulary of the field into three
      buckets: rising, fading, and genuinely new. Each with a momentum chart
      behind it.

      Fading is the bucket nobody builds and everybody needs. Terms don't get
      formally retired — they just stop showing up, months before anyone
      says so out loud. Watching that happen in a chart is a real edge when
      you're deciding what to invest a quarter in.

      New is the fun one. A term that didn't exist in the corpus 90 days ago
      and now appears weekly is worth ten minutes of your attention.

      Link in the comments.
    live_variant: |
      Fastest-rising term in healthcare AI this window: {{TERM}}. Fastest
      fading: {{TERM_2}}.
    first_comment: |
      Trend analysis: {{site_base_url}}/dashboard/trends
      Free 7-day trial: {{trial_url}}
    hashtags: ["#HealthcareAI", "#TrendAnalysis", "#DigitalHealth", "#DataScience"]
