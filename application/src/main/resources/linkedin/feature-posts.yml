  - id: vendor-compare
    feature: "Vendor Competitive Analysis"
    menu_path: "Research & Search > Vendors"
    url: "/research/vendors"
    slot: { week: 3, weekday: TUESDAY }
    theme: ask-it
    hook: >
      Every healthcare-AI vendor's website says the same six things. None of
      them are comparable.
    body: |
      Every healthcare-AI vendor's site says roughly the same six things.
      Clinically validated. Enterprise-ready. Seamless integration. None of it
      is comparable, because none of it comes from a common source.

      The vendor comparison page builds its assessment from coverage instead
      of marketing copy. Strengths and weaknesses are drawn from what's
      actually been written about each vendor, scored with document frequency
      and TF-IDF relevance, and laid out as a card grid with relevance bars
      you can scan across.

      It won't tell you who to buy. It will tell you what the record says
      about each of them, in the same shape, so you can compare like with
      like — and it'll show you where the record is thin, which is its own
      finding.

      A vendor nobody has written anything substantive about is not
      necessarily bad. But you should know that's the situation before the
      procurement meeting, not during it.

      Link in the comments.
