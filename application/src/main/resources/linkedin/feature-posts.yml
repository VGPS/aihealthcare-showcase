    body: |
      The best intelligence dashboard is the one you never have to remember to
      open.

      Every "check this daily" tool is really asking you to build a habit,
      and habits decay. Two good weeks, then a busy Thursday, then it's a tab
      you close. The information was fine; the delivery model was wrong.

      So there are webhooks. Configure a channel — Slack, Teams, or a custom
      endpoint — and choose what fires it: pipeline events, deal signals,
      regulatory alerts. The intelligence goes to where your team already is
      instead of waiting behind a login.

      For a small team the highest-value config is narrow: one webhook, one
      trigger, the specific regulatory category you actually care about. A
      firehose into Slack gets muted in a week, which puts you right back
      where you started.

      Push beats pull, but only if you're disciplined about what you push.

