  - id: company-relationships
    feature: "Company Relationships"
    menu_path: "Company Intelligence > Relationships"
    url: "/companies/{slug}/relationships"
    slot: { week: 3, weekday: WEDNESDAY }
    theme: companies
    hook: >
      In healthcare AI, the org chart that matters is the one between
      companies, and nobody publishes it.
    body: |
      In healthcare AI, the org chart that matters isn't inside any company.
      It's between them — and nobody publishes it.

      Who integrates with which EHR. Who quietly acquired whose imaging team.
      Who's partnered on paper and competing in practice. All of it exists in
      public coverage, scattered across two years of announcements nobody
      assembled.

      The relationship graph assembles it. Force-directed layout,
      type-colored edges — blue for partnership, red for acquisition, green
      for investment, orange for competitor — and a detail panel when you
      click through an edge.

      What you see immediately is structure the list view hides: the hub
      companies everything routes through, the clusters that will consolidate,
      the isolated node that looks strong alone and fragile on the map.

      Strategy questions are usually graph questions wearing a spreadsheet
      costume.

      Link in the comments.
    live_variant: |
      Most-connected company on the graph right now: {{COMPANY}}, with
      {{N}} mapped relationships.
