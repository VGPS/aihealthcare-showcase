        AIHealthcare framework analysis radar chart comparing companies across
        six competitive dimensions.

  - id: company-discovery
    feature: "Company Discovery Pipeline"
    menu_path: "Company Intelligence > Companies index"
    url: "/companies"
    slot: { week: 6, weekday: WEDNESDAY }
    theme: companies
    hook: >
      The companies worth knowing about are, by definition, the ones not yet
      on anyone's list.
    body: |
      The healthcare AI companies worth knowing about are, almost by
      definition, the ones not yet on anyone's list. Which makes a
      hand-maintained company list obsolete the day you finish it.

      So discovery runs as a pipeline instead. It scrapes YC and startup
      directories, classifies each company into a healthcare-AI subcategory,
      deduplicates against everything already tracked, and renders what's new
      as a report.

      Deduplication is the unglamorous part that makes it work. The same
      company appears as three name variants across two directories, and
      without careful matching your database fills with near-duplicates until
      nobody trusts the count.

      What comes out is a tracked-company list that grows on its own —
      alongside the ones I add by hand when they show up in coverage first.

      The best way to keep a list current is to stop maintaining it and start
      generating it.

      Link in the comments.
    live_variant: |
      Discovery added {{N}} companies this run, {{M}} after dedupe. New
      subcategory that showed up: {{CATEGORY}}.
    first_comment: |
      Tracked companies: {{site_base_url}}/companies
      Public directory (no login): {{directory_url}}
      Free 7-day trial: {{trial_url}}
    hashtags: ["#HealthTech", "#StartupIntel", "#DataEngineering", "#HealthcareAI"]
    screenshot:
      page: "/companies"
      prompt: "None."
      capture: >
        The company index with article counts and trend indicators across
        8-10 rows, so the scale of the tracked set is visible.
      redact: "Your account email in the nav bar."
      alt_text: >
        AIHealthcare company intelligence index listing tracked companies with
        article counts and trend indicators.

  - id: clinical-trials
    feature: "Clinical Trial Monitoring"
    menu_path: "Intelligence & Analysis > Clinical Trials"
    url: "/dashboard/clinical-trials"
    slot: { week: 6, weekday: THURSDAY }
    theme: knowledge
    hook: >
      A press release tells you what a company claims. A trial registration
      tells you what they committed to.
    body: |
      A press release tells you what a company claims. A trial registration
      tells you what they committed to, in advance, in public, with a
      pre-specified endpoint.

      The gap between those two documents is often the whole story.

      So AI-related clinical trials are tracked directly: status, phase, and
      the company behind each one, linked back to the company profile so a
      trial and its sponsor's coverage sit together.

      Phase is the honest signal. A field with a lot of Phase I activity and
      very little Phase III is a field with more announcements than evidence,
      whatever the funding totals say. And a trial that goes quiet between
      phases is information that no press release will ever carry.

      Registries are the least glamorous and most reliable source in
      healthcare AI. Read them before you read the pitch deck.

      Link in the comments.
    live_variant: |
      Current mix of tracked AI trials: {{N}} recruiting, {{M}} completed,
      {{K}} with results posted.
    first_comment: |
      Clinical trial monitoring: {{site_base_url}}/dashboard/clinical-trials
      Free 7-day trial: {{trial_url}}
    hashtags: ["#ClinicalTrials", "#HealthcareAI", "#EvidenceBasedMedicine", "#DigitalHealth"]
    screenshot:
      page: "/dashboard/clinical-trials"
      prompt: "None."
      capture: >
        The trial list showing the status, phase, and company columns
        together across several rows.
      redact: "Your account email in the nav bar."
      alt_text: >
        AIHealthcare clinical trial monitoring page listing AI-related trials
        with status, phase, and sponsoring company.

  - id: prompt-evaluation
    feature: "Prompt Evaluation Framework"
    menu_path: "Craft / behind the scenes"
    url: "/dashboard"
    slot: { week: 6, weekday: FRIDAY }
    theme: craft
    hook: >
      Everyone tweaks prompts. Almost nobody can tell you whether the tweak
      helped.
    body: |
      Everyone tweaks prompts. Almost nobody can tell you whether the tweak
      actually helped, because the evidence is "I read three outputs and they
      felt better."

      That's not nothing. It's also not enough to make a change you'll depend
      on in production.

      So prompt changes go through an evaluation harness: an LLM-as-judge
      scores outputs across five quality dimensions, and A/B variant
      comparison runs the old prompt against the new one on the same inputs.
      A change ships when it wins on the dimensions I care about, not when it
      reads nicely on the first sample.

      The judge is not neutral and I don't pretend otherwise. It's a
      consistent instrument, which is a different and lower claim — it lets me
      detect a regression, and that's most of the value.

      "It seems better" is a hypothesis. Score it before you ship it.

      Link in the comments.
    live_variant: |
      Latest A/B: variant B won on {{N}} of 5 dimensions, lost on
      {{DIMENSION}}. Shipped anyway, and here's why: {{REASON}}.
    first_comment: |
      More on how it's built: {{about_url}}
      Free 7-day trial: {{trial_url}}
    hashtags: ["#PromptEngineering", "#LLMOps", "#SpringAI", "#BuildInPublic"]
    screenshot:
      page: "/dashboard"
      prompt: "None — capture the evaluation panel on the analytics dashboard."
      capture: >
        The evaluation scores section. If an A/B comparison view exists, use
        that instead — two variants side by side is the stronger image.
      redact: "Your account email in the nav bar."
      alt_text: >
        AIHealthcare analytics dashboard showing prompt evaluation scores
        across five quality dimensions.
