  - id: wiki-contradictions
    feature: "Contradiction Detection (Reversal Watch)"
    menu_path: "Wiki > Reversal Watch"
    url: "/wiki/contradictions"
    slot: { week: 1, weekday: THURSDAY }
    theme: knowledge
    hook: >
      In healthcare AI, the most valuable thing you can know is which of last
      year's findings stopped being true.
    body: |
      In healthcare AI, the most valuable thing you can know is which of last
      year's confident findings quietly stopped being true.

      Nobody publishes a retraction notice for a claim that just... faded. A
      model that beat clinicians on a retrospective dataset underperforms
      prospectively. A promising biomarker doesn't replicate. The original
      paper keeps getting cited anyway, because nothing formally overturned
      it.

      Reversal Watch is the page I built for exactly that. When new evidence
      contradicts a claim already recorded in the knowledge wiki, the
      contradiction gets stored as a first-class record — not a footnote —
      and surfaced in a feed with the two claims side by side and their dates.

      You read it as a timeline: here's what we thought, here's what came
      after, here's the gap.

      Most tools optimize for what's new. This one is about what's no longer
      true. In this field that's the rarer and more expensive information.

      Link in the comments.
    live_variant: |
      Newest entry on Reversal Watch: {{CLAIM_THEN}} → {{CLAIM_NOW}}.
    first_comment: |
      Reversal Watch: {{site_base_url}}/wiki/contradictions
      Free 7-day trial of the full platform: {{trial_url}}
    hashtags: ["#HealthcareAI", "#EvidenceBasedMedicine", "#ClinicalAI", "#Research"]
    screenshot:
      page: "/wiki/contradictions"
      prompt: "None — leave the date filter at its widest setting."
      capture: >
        One full side-by-side contradiction card with both claims and both
        dates readable. A single strong card beats a list of truncated ones.
      redact: "Your account email in the nav bar."
      alt_text: >
        AIHealthcare Reversal Watch showing a side-by-side comparison of an
        earlier claim and the later evidence that contradicts it.

  - id: newsletter-generation
    feature: "AI Newsletter Generation"
    menu_path: "Newsletter & Content > Newsletter Runs"
    url: "/newsletter/runs"
    slot: { week: 1, weekday: FRIDAY }
    theme: craft
    hook: >
      The hard part of an AI-written newsletter isn't the writing. It's making
      every sentence traceable.
    body: |
      The hard part of an AI-written newsletter isn't the writing. It's making
      every sentence traceable back to a real article.

      An LLM will happily produce a fluent paragraph about a study that
      doesn't exist. In healthcare that isn't a quirk, it's disqualifying. So
      the generation pipeline is built the other way around: harvest first,
      group into topic sections, summarize only what's in hand, and carry the
      source attribution through to the rendered draft.

      Every run lands in a list with a status badge — DRAFT, SENT, ARCHIVED —
      and opens in a WYSIWYG editor. A human reads it before anyone else
      does. That's the part I'm not automating.

      Retrieval-augmented summarization pulls relevant archived context into
      each section, so a story about a company you covered in March reads
      like it knows about March.

      Generated, then edited. Not generated, then trusted.

      Link in the comments.
    live_variant: |
      Today's draft: {{N}} sections, {{M}} attributed sources, {{T}} minutes
      of editing before it went out.
    first_comment: |
      Newsletter runs and the editor: {{site_base_url}}/newsletter/runs
      Subscribe or start a 7-day trial: {{trial_url}}
    hashtags: ["#SpringAI", "#LLM", "#HealthcareAI", "#BuildInPublic"]
    screenshot:
      page: "/newsletter/runs"
      prompt: "None — then open one run in the editor for the second frame."
      capture: >
        Two frames side by side: the run list with status badges, and the
        editor open on a section with visible source attribution.
      redact: "Subscriber email addresses if any appear in the run detail."
      alt_text: >
        AIHealthcare newsletter run list with DRAFT/SENT status badges beside
        the WYSIWYG editor showing an attributed newsletter section.

