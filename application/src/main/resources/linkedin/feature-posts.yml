  - id: pipeline-orchestrator
    feature: "Self-Maintaining Pipeline Orchestrator"
    menu_path: "Admin > Pipelines"
    url: "/admin/pipelines"
    slot: { week: 2, weekday: FRIDAY }
    theme: craft
    hook: >
      Eleven chained AI pipelines. The design question isn't how to make them
      work — it's what happens when step six doesn't.
    body: |
      Eleven chained pipelines run after every harvest: summarization,
      sentiment, deal classification, regulatory matching, wiki compilation,
      and the rest.

      The interesting design question was never how to make them work. It's
      what happens when step six fails at 4am.

      The naive version fails the whole chain, and you wake up to no
      newsletter. So each step is wrapped in its own isolation boundary: a
      failure is logged, that step's output is skipped, and the orchestrator
      moves on. You get a degraded run instead of no run — and a clear record
      of which step degraded it.

      For a solo operator that difference is everything. A partial newsletter
      I can patch beats a silent 4am failure I discover at noon.

      The admin page exposes every step as a manual trigger, so re-running
      just the one that broke is a click rather than a redeploy.

      Fault isolation isn't a resilience feature. It's a sleep feature.

      Link in the comments.
    live_variant: |
      Last night's run: {{N}} of 11 steps clean, {{M}} degraded, zero manual
      intervention.
    first_comment: |
      More on how it's built: {{about_url}}
      See the platform itself — free 7-day trial: {{trial_url}}
    hashtags: ["#SpringBoot", "#SoftwareArchitecture", "#BuildInPublic", "#SpringAI"]
    screenshot:
