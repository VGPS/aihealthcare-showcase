  - id: framework-analysis
    feature: "Framework Competitive Analysis"
    menu_path: "Intelligence & Analysis > Frameworks"
    url: "/dashboard/frameworks"
    slot: { week: 6, weekday: TUESDAY }
    theme: ask-it
    hook: >
      "Who's the leader in healthcare AI" is an unanswerable question. "Leader
      on which of six dimensions" is a real one.
    body: |
      "Who's the leader in healthcare AI" is an unanswerable question, which
      is why the answer is always whoever raised most recently.

      Break it into six dimensions and it becomes tractable: clinical
      validation, regulatory position, market adoption, technical depth, data
      assets, and partnerships. Now "leader" has to mean something specific,
      and the interesting companies are the ones with a jagged profile rather
      than a high average.

      The frameworks page scores companies across all six and renders them as
      a radar chart. Shape reads faster than numbers — a company strong on
      data assets and thin on regulatory has an unmistakable silhouette, and
      it's a completely different investment than the balanced one beside it.

      The dimensions are config-driven, so the scoring model can be revised
      without touching code. Which is good, because the right dimensions for
      this field in 2027 probably aren't these six.

      Composite scores hide the interesting part. Plot the shape.

      Link in the comments.
