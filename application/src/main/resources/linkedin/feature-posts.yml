  - id: sentiment-risk
    feature: "Sentiment & Risk Scoring"
    menu_path: "Intelligence & Analysis > Risk"
    url: "/dashboard/risk"
    slot: { week: 2, weekday: WEDNESDAY }
    theme: companies
    hook: >
      "Bad press" is a vibe. A sentiment distribution with per-article
      rationale is something you can argue with.
    body: |
      "That company's been getting bad press" is a vibe. It's also how a
      surprising number of vendor decisions actually get made.

      The risk page turns it into something you can argue with. Every
      harvested article gets classified for sentiment by an LLM, with a
      written rationale for the call. Those roll up into a company-level
      distribution and a risk score carrying a confidence metric.

      The overview is a bar chart across tracked companies. Click through to
      one and you get the doughnut breakdown plus the article-level table —
      every classification, with the reasoning next to it.

      That last part is the point. An aggregate score you can't decompose is
      just a number someone else chose. Being able to open the score and read
      "this was rated negative because of X" is what makes it usable in a
      real evaluation.

      Show your work, or don't show a score.

      Link in the comments.
