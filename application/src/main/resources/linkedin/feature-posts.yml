    body: |
      Building the billing layer taught me more about the product than
      building the AI did.

      Because a pricing page is a forcing function. You cannot ship one
      without answering, precisely, what each tier is worth — and every fuzzy
      feature you've been carrying gets exposed the moment you try to put it
      on one side of a line.

      Four tiers ended up mattering: DEMO for the 7-day trial,
      FREE_PENDING through opt-in confirmation, FREE for the daily digest,
      and SUBSCRIBER for the full intelligence layer. Gating runs at the
      feature level with usage metering behind it, not a single boolean, so
      "you get 10 of these, subscribers get 100" is expressible without
      forking the page.

      The uncomfortable question the exercise asked me: which features would
      someone actually pay for, versus which ones I enjoyed building? Those
      two lists were not identical.

      Ship the pricing page early. It's a design review disguised as
      commerce.

      Link in the comments.
