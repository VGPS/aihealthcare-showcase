      After a week away, you don't want the week's news. You want the diff.
    body: |
      Come back from a week off and the last thing you need is the week's
      news. You need the diff.

      Which is a different question. Not "what was published" — that's a
      hundred articles you'll never read. But "what does the knowledge base
      believe now that it didn't believe last Tuesday," which is usually a
      short and interesting list.

      The What Changed digest answers exactly that, over a window you choose:
      new wiki pages created, existing pages updated, and contradictions
      surfaced since your cutoff.

      It's the only page I open after time away. Three sections, five minutes,
      fully caught up on the parts that actually moved — and the
      contradictions section is the one I read first, because a reversal is
      worth ten new announcements.

      Feeds tell you what happened. A diff tells you what's different. Only
      one of those scales with time away.

