  - id: deal-signals
    feature: "Deal Signal Detection"
    menu_path: "Intelligence & Analysis > Deals"
    url: "/dashboard/deals"
    slot: { week: 2, weekday: MONDAY }
    theme: signal
    hook: >
      Funding news is easy to find and almost impossible to compare, because
      it arrives as prose.
    body: |
      Funding news is easy to find and nearly impossible to compare, because
      it arrives as prose.

      "Raised a substantial Series B led by an existing investor" and "closed
      $40M from Acme Ventures" describe the same event at two different
      resolutions. You can't sort prose. You can't chart it. You certainly
      can't spot a pattern across ninety days of it.

      So the pipeline runs every harvested article through deal
      classification and pulls out structured fields: deal type, amount,
      counterparty, and a confidence score on the extraction itself. What was
      a paragraph becomes a row.

      Then it's a feed you can filter by type and sort by amount — funding,
      M&A, partnership — instead of a stack of press releases.

      The confidence score matters as much as the extraction. When the model
      is guessing at an amount, it says so, and you can weight it accordingly.

      Structured beats fluent when you need to count things.

      Link in the comments.
    live_variant: |
      Biggest disclosed deal in the feed this week: {{COMPANY}}, {{AMOUNT}},
      {{TYPE}}.
    first_comment: |
      Deal signal feed: {{site_base_url}}/dashboard/deals
      Free 7-day trial: {{trial_url}}
    hashtags: ["#HealthTech", "#VentureCapital", "#HealthcareAI", "#MarketIntelligence"]
    screenshot:
