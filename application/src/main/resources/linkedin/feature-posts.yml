  - id: wiki-ask
    feature: "Wiki Q&A"
    menu_path: "Wiki & Knowledge Base > Ask"
    url: "/wiki/ask"
    slot: { week: 2, weekday: TUESDAY }
    theme: ask-it
    hook: >
      A general chatbot answers healthcare questions from whatever it
      absorbed in training. It cannot tell you what changed last month.
    body: |
      A general-purpose chatbot answers healthcare questions from whatever it
      absorbed during training. It can't tell you what changed last month, and
      it won't tell you it doesn't know.

      The Wiki Q&A page answers from a different corpus: a knowledge base
      compiled from articles this platform actually harvested — PubMed, FDA,
      industry press — and kept current. Ask a natural-language question, get
      an answer grounded in those pages, with the pages available to open and
      check.

      The distinction that matters isn't answer quality. It's scope. This
      thing knows what it read, and the reading list is inspectable.

      Ask it something narrow — "what's the current state of ambient clinical
      documentation adoption?" — and you get an answer built from this year's
      coverage rather than a confident average of the last decade.

      Retrieval you can audit beats recall you have to trust.

      Link in the comments.
