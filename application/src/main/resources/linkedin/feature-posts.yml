    body: |
      Most healthcare-AI company lists are alphabetical. Which is another way
      of saying they tell you nothing.

      Alphabetical order can't tell you who's actually moving. So the
      directory ranks instead — on a live signal score built from three
      inputs: article velocity over the last 90 days, a bonus for recent
      funding activity, and a penalty for negative sentiment in coverage.

      Sort by Trending, Recently Funded, or Watch List. Filter by sector.
      Each card carries a signal badge — 🔥 moving, 💰 funded, ⚠ under
      scrutiny — so the shape of the market reads at a glance. Export the
      whole thing to CSV if you'd rather work in a spreadsheet.

      No login. It's a public page, deliberately — a ranked map of who is
