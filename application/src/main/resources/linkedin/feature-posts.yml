  - id: article-search
    feature: "Multi-Field Article Search"
    menu_path: "Dashboard & Analytics > Search"
    url: "/dashboard/search"
    slot: { week: 4, weekday: TUESDAY }
    theme: ask-it
    hook: >
      Keyword search finds the word. Semantic search finds the idea. You want
      both, and for different jobs.
    body: |
      Keyword search finds the word. Semantic search finds the idea. Most
      tools pick one and make you live with it.

      The difference shows up fast in healthcare. Search "sepsis prediction"
      by keyword and you miss the paper that says "early warning score for
      infection deterioration." Search only by vector and you lose the ability
      to demand an exact term when the exact term is the point — a device
      name, a trial ID, a specific author.

      So the archive supports both. Structured search across topic, author,
      and date range for when you know what you're looking for; pgvector
      similarity search across the full archive for when you only know the
      shape of it.

      In practice you use the second to find the neighborhood and the first to
      pin down the address.

      Precision and recall are different tools. Keep both on the bench.

      Link in the comments.
    live_variant: |
      Searched "{{QUERY}}" — {{N}} results, and the best one didn't contain
      the phrase I typed.
