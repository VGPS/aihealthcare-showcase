  - id: research-runs
    feature: "Staged Research Pipeline"
    menu_path: "Research & Search > Research Runs"
    url: "/research/runs"
    slot: { week: 5, weekday: TUESDAY }
    theme: ask-it
    hook: >
      Hard questions don't have answers. They have sub-questions, and a good
      research tool shows you them.
    body: |
      Hard questions don't have answers. They have sub-questions — and a
      research tool that hides that from you is hiding the part you most need
      to check.

      Ask "how is reimbursement policy affecting adoption of AI diagnostics?"
      and no single retrieval will serve it. So the pipeline plans first: an
      LLM decomposes the question into component queries, each one runs
      against multiple sources, citations get assembled, and only then does
      synthesis happen.

      Every run is saved with its mode badge, citation count, and timestamp,
      and opens to the full synthesized answer with its sources.

      The plan is the interesting artifact. When an answer feels off, the
      decomposition usually shows you why — a sub-question that was framed
      badly, or a source tier that came back empty. That's debuggable in a way
      that a single opaque answer never is.

      Show the plan, not just the conclusion.

      Link in the comments.
