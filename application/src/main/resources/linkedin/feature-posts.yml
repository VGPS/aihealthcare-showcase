  - id: source-provenance
    feature: "Source Provenance Tracking"
    menu_path: "Wiki & Knowledge Base > any wiki page"
    url: "/wiki/{slug}"
    slot: { week: 3, weekday: THURSDAY }
    theme: knowledge
    hook: >
      An AI-generated summary you can't trace is a rumor with good grammar.
    body: |
      An AI-generated summary you can't trace back to a source is a rumor with
      good grammar.

      That's tolerable when you're catching up on consumer tech. It is not
      tolerable when the claim is about a diagnostic tool's performance in a
      clinical population, and someone downstream is going to repeat it in a
      meeting.

      So every wiki page carries a provenance table. Each claim links to the
      PubMed paper, FDA record, or industry source it came from. Not a
      bibliography at the bottom — a per-claim mapping you can open and check
      one line at a time.

      This also constrains the compiler. A claim that can't be attributed
      doesn't make the page. Which means the wiki grows more slowly than a
      pure generative approach would, and I'll take that trade every time.

      The measure of a knowledge base isn't how much it says. It's how much
      of it you can verify without leaving your chair.

      Link in the comments.
    live_variant: |
      This page: {{N}} claims, {{N}} linked sources, zero unattributed
      sentences.
