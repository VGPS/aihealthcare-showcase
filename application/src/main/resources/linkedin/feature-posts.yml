  - id: wiki-index
    feature: "LLM-Compiled Knowledge Wiki"
    menu_path: "Wiki & Knowledge Base > Wiki"
    url: "/wiki"
    slot: { week: 2, weekday: THURSDAY }
    theme: knowledge
    hook: >
      A newsletter archive is a pile of articles. A wiki is what you get when
      something reconciles them.
    body: |
      A newsletter archive is a pile of articles in date order. Useful on the
      day, nearly useless a year later — because nothing in it reconciles
      anything.

      The wiki layer is the answer to that. Harvested articles get compiled
      into persistent pages — entities, concepts, comparisons, overviews —
      each with revision history and cross-references to related pages. New
      coverage doesn't get appended to the bottom of a feed; it updates the
      page it belongs to.

      Which means the archive stops decaying. The page on a given company or
      technique is worth more this month than last, because more evidence has
      been folded into it.

      Search it, or filter by page type. Every page carries its own history,
      so you can see how the platform's understanding of a topic moved over
      time.

      Feeds accumulate. Knowledge compounds. Those are different products.

      Link in the comments.
    live_variant: |
      The wiki is at {{N}} compiled pages now. Most-revised this month:
      {{PAGE}}.
    first_comment: |
      Knowledge wiki: {{site_base_url}}/wiki
      Free 7-day trial: {{trial_url}}
