    body: |
      Healthcare AI governance isn't one story. It's litigation, policy
      proposals, and agency action, moving at three different speeds, covered
      by three different sets of publications.

      Read any one of them alone and you get the wrong picture. A court
      filing lands, a state bill moves, an agency issues guidance — separately
      they look like noise. On one timeline they often turn out to be the same
      pressure showing up in three places.

      So the legal timeline merges them: legal articles, policy events, and
      regulatory actions in a single chronological feed. One column, in date
      order, no source-switching.

      The pattern it makes visible is the one that matters for planning —
      whether the direction of travel in your category is tightening, and how
      fast.

      Compliance teams already do this manually in a spreadsheet. It should
      not be manual.

