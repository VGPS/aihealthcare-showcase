# =============================================================================
# AIHealthcare — LinkedIn Feature Post Library
#
# One entry per menu item / feature. Rotated by weekday: five posts per week,
# six weeks per full cycle (30 posts), then the cycle repeats with fresh
# screenshots and fresh live-data numbers.
#
# Voice: reader-payoff first. Each post opens with something a healthcare-AI
# reader can use, then shows the feature as the proof. The product is never
# the headline.
#
# Links: LinkedIn suppresses reach on posts with outbound links in the body,
# so every `body` is link-free and every `first_comment` carries the URLs.
# Post the body, publish, then immediately paste `first_comment` as comment #1.
#
# Placeholders in {{DOUBLE_BRACES}} are live values you fill in from the
# screenshot you just captured. Never post a placeholder unfilled — either
# fill it or use the evergreen `hook` instead of `live_variant`.
#
# @author  Bill Blackmon
# @since   2026-09-05
# =============================================================================

meta:
  site_base_url: "https://app.bigskylabs.ai"
  trial_url: "https://app.bigskylabs.ai/register"
  pricing_url: "https://app.bigskylabs.ai/pricing"
  directory_url: "https://app.bigskylabs.ai/directory"
  about_url: "https://app.bigskylabs.ai/about"
  trial_cta: "7-day free trial — no card."
  max_body_chars: 3000
  screenshot_dir: "sShots-LinkedIn"

# Weekday themes keep the feed varied so six weeks of posts don't read as one
# long product tour.
rotation:
  MONDAY:    "Signal — what moved in healthcare AI (regulatory, deals, trends)"
  TUESDAY:   "Ask it — prompt-driven features with a visible answer"
  WEDNESDAY: "Company intelligence — who's who and how they connect"
  THURSDAY:  "Knowledge & provenance — the wiki layer and its receipts"
  FRIDAY:    "Craft — how the thing is built and how you plug into it"

