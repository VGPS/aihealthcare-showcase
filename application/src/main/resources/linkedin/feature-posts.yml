  - id: regulatory-alerts
    feature: "Regulatory Alert System"
    menu_path: "Intelligence & Analysis > Regulatory"
    url: "/dashboard/regulatory"
    slot: { week: 1, weekday: MONDAY }
    theme: signal
    hook: >
      Most teams find out about an FDA clearance in their space weeks late,
      from a competitor's press release.
    body: |
      Most teams find out about an FDA clearance in their space weeks late —
      from a competitor's press release.

      The primary sources are public and machine-readable. openFDA publishes
      510(k) and De Novo decisions. The Federal Register publishes CMS rules.
      Nobody reads them because they arrive as raw feeds with no healthcare-AI
      filter on top.

      So the platform reads them for you. Every day it pulls new 510(k) and
      De Novo clearances plus CMS rule activity, filters to AI-relevant
      devices and policy, and lands them on one page with color-coded type
      badges and FDA / CMS filter tabs.

      What that changes: "did anything clear in our category this week" stops
      being a research project and becomes a ten-second look.

      If you build, buy, or invest in clinical AI, the regulatory record is
      the closest thing to ground truth you get. It's worth reading on a
      schedule.

      Link in the comments.
    live_variant: |
      {{N}} new AI-related FDA clearances landed this week. Here's the one
      worth your attention: {{CLEARANCE_ONE_LINER}}
    first_comment: |
      Regulatory alerts: {{site_base_url}}/dashboard/regulatory
      Try the whole platform free for 7 days: {{trial_url}}
    hashtags: ["#HealthcareAI", "#FDA", "#RegulatoryAffairs", "#DigitalHealth"]
    screenshot:
      page: "/dashboard/regulatory"
      prompt: "None — set the filter tab to FDA and sort newest first."
      capture: >
        Full alert list from the summary badges down through 5-6 alert rows.
        Include the FDA/CMS filter tabs so the filtering is visible.
      redact: "Nothing — this page shows public regulatory data only."
      alt_text: >
        AIHealthcare regulatory alerts page listing recent FDA 510(k) and CMS
        rule alerts with type badges and filter tabs.

  - id: ai-search
    feature: "Multi-Model AI Search"
    menu_path: "Research & Search > AI Search"
    url: "/research/ai-search"
    slot: { week: 1, weekday: TUESDAY }
    theme: ask-it
    hook: >
      Asking one model a healthcare question gives you one model's blind
      spots, stated with total confidence.
    body: |
      Ask one model a healthcare question and you get one model's blind spots,
      delivered with total confidence.

      Ask four and something more useful happens. Where Claude, GPT, Gemini,
      and Perplexity agree, you can move. Where they diverge, you've found the
      part of the literature that isn't settled — which is usually the part
      worth your afternoon.

      That's the whole idea behind the AI Search page. You pick which models
      to fan out to, ask once, and get a synthesized answer with numbered
      citations back to the underlying sources. Disagreement isn't smoothed
      over; it's the signal.

      I ran "What is the current evidence for AI-assisted sepsis prediction in
      the ICU?" through it. The synthesis was useful. The citation trail was
      more useful.

      Consensus is a feature. So is the lack of it.

      Link in the comments.
    live_variant: |
      I asked it: "{{QUESTION}}" — {{N}} models, {{M}} citations, one answer
      you can actually check.
    first_comment: |
      Multi-model AI search: {{site_base_url}}/research/ai-search
      Try it free for 7 days: {{trial_url}}
    hashtags: ["#HealthcareAI", "#LLM", "#AIResearch", "#ClinicalAI"]
    screenshot:
      page: "/research/ai-search"
      prompt: "What is the current evidence for AI-assisted sepsis prediction in the ICU?"
      capture: >
        Two-part shot: the query box with the model checkboxes visible above,
        and the top of the synthesized answer showing at least three numbered
        citation markers. Crop before the page footer.
      redact: "Your account email in the nav bar."
      alt_text: >
        AIHealthcare multi-model AI search showing a sepsis-prediction query
        fanned out to four LLMs with a synthesized, citation-numbered answer.

