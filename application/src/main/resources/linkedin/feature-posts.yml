  - id: news-topics
    feature: "Topic-Grouped News"
    menu_path: "Dashboard & Analytics > News"
    url: "/dashboard/news"
    slot: { week: 5, weekday: THURSDAY }
    theme: knowledge
    hook: >
      Reverse-chronological is the laziest possible way to organize
      information, and it's the default everywhere.
    body: |
      Reverse-chronological is the laziest possible way to organize
      information. It's also the default in nearly every news product you use.

      It optimizes for one thing — recency — and destroys everything else. A
      regulatory decision, a funding round, and a preprint all land in the
      same undifferentiated column, and you do the sorting in your head every
      single morning.

      The news page groups instead. Thirteen configurable topic sections, each
      with its own AI-generated summary of what happened in that area, so you
      read the summary and drop into the articles only where it's warranted.

      Configurable matters more than thirteen. Topics are data, not code — a
      new one is a config entry with its own feed sources and its own place in
      the layout, no deploy required. That's what makes the structure
      survivable as the field changes.

      Recency is a sort order, not an information architecture.

      Link in the comments.
