          description: Article counts grouped by source tier
        byTopic:
          type: array
          items:
            $ref: '#/components/schemas/CountByLabelResponse'
          description: Article counts grouped by topic, ordered by count descending
        last7DaysCount:
          type: integer
          format: int64
          description: Articles ingested in the last 7 days
        last30DaysCount:
          type: integer
          format: int64
          description: Articles ingested in the last 30 days

    RunAnalyticsResponse:
      type: object
