        lastCheckedAt:
          type: string
          format: date-time
          description: Timestamp of the last content check

    DocumentIngestRequest:
      type: object
      required: [directory, sourceLabel]
      properties:
        directory:
          type: string
          description: Absolute path to the directory containing documents to ingest.
          example: /data/clinical-guidelines
        sourceLabel:
          type: string
          description: Human-readable label applied to all chunks from this ingestion run.
          example: Clinical Guidelines 2026
        chunkSize:
          type: integer
          minimum: 100
          maximum: 5000
          default: 1000
          description: Maximum character length of each text chunk before embedding.

    DocumentIngestResponse:
      type: object
      properties:
        filesProcessed:
          type: integer
          description: Number of files successfully parsed.
        chunksEmbedded:
          type: integer
          description: Total number of text chunks embedded and stored in the vector store.
        failures:
          type: array
          items:
            type: string
          description: List of files that could not be parsed, with error messages.

    SearchPromptResponse:
      type: object
      properties:
        engine:
          type: string
          description: Search engine identifier (e.g. GOOGLE, PERPLEXITY)
          example: PERPLEXITY
        name:
          type: string
          description: Human-readable name for this prompt configuration
          example: Perplexity Deep-Research Prompt
        templateText:
          type: string
          description: Full prompt template sent to the search engine API
        description:
          type: string
          nullable: true
          description: Optional description of this prompt's purpose and strategy
        active:
          type: boolean
          description: Whether this prompt is currently used during harvesting

    MarketIntelligenceRefreshResponse:
      type: object
      properties:
        filePath:
          type: string
          description: Absolute path of the written HTML file.
          example: "C:/workspaces/SpringAIClaude/AIHealthcare/NotebookLMDirectory/summaries/healthcare_ai_market_intelligence_2026_05_02.html"
        reportDate:
          type: string
          description: ISO-8601 date of the report (yyyy-MM-dd).
          example: "2026-05-02"
        htmlLength:
          type: integer
          description: Number of bytes in the generated HTML file.
          example: 48200

    CountByLabelResponse:
      type: object
