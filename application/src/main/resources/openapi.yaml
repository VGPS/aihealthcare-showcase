    VariantScoreResponse:
      type: object
      properties:
        variantId:
          type: string
        variantName:
          type: string
        evaluationCount:
          type: integer
          format: int64
        avgOverall:
          type: number
          format: double
        avgRelevance:
          type: number
          format: double
        avgConciseness:
          type: number
          format: double
        avgCompleteness:
          type: number
          format: double
        avgToneMatch:
          type: number
          format: double
        avgAttributionQuality:
          type: number
          format: double

    EvaluationAnalyticsResponse:
      type: object
      properties:
        totalEvaluations:
          type: integer
          format: int64
        totalComparisons:
          type: integer
          format: int64
        variantScores:
          type: array
          items:
            $ref: '#/components/schemas/VariantScoreResponse'
          description: Per-variant aggregate scores, ordered by avgOverall descending
        bestVariantId:
          type: string
          nullable: true
          description: ID of the variant with the highest average overall score

    ResearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: The research question; must not be blank.
          example: What are the latest AI breakthroughs in clinical diagnostics?
        mode:
          type: string
          enum: [LEGACY_GOOGLE, STAGED_RESEARCH, COMBINED]
          default: LEGACY_GOOGLE
          description: >
            Pipeline mode. LEGACY_GOOGLE uses stored articles (no API keys required).
            STAGED_RESEARCH activates AI planning + Perplexity retrieval + AI synthesis.
            COMBINED runs both retrievers, merges by URL dedup, then AI-synthesizes across
            the full source set for maximum breadth and historical depth.
        topicHint:
          type: string
          nullable: true
          description: Optional narrowing hint to focus retrieval (e.g., "clinical AI").
          example: AI diagnostics
        maxSources:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: Maximum number of source documents to retrieve.

    ResearchAnswer:
      type: object
      properties:
        answerId:
          type: string
          description: UUID assigned to this answer.
        query:
          type: string
          description: The original research question.
        sections:
          type: array
          items:
            $ref: '#/components/schemas/ResearchSection'
          description: Ordered thematic sections; at least one.
        allCitations:
          type: array
          items:
            $ref: '#/components/schemas/SourceCitation'
          description: Deduplicated master citation list across all sections.
        generatedAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp when the answer was generated.

    ResearchSection:
      type: object
      properties:
        heading:
          type: string
          description: Section heading text.
        body:
          type: string
          description: Paragraph body with inline citation markers such as [1], [2].
        citations:
          type: array
          items:
            $ref: '#/components/schemas/SourceCitation'
          description: Citations referenced within this section.

    SourceCitation:
      type: object
      properties:
        citationNumber:
          type: integer
          description: Sequential 1-based citation number.
        title:
          type: string
          description: Title of the cited source.
        url:
          type: string
          description: URL of the cited source.
        retrievedAt:
          type: string
          format: date-time
          nullable: true
          description: When the source was retrieved.

    ResearchRunResponse:
      type: object
      properties:
        runId:
          type: string
          description: UUID of the research run (same as ResearchAnswer.answerId).
        query:
          type: string
          description: The original research question.
        mode:
          type: string
          description: Pipeline mode used — LEGACY_GOOGLE, STAGED_RESEARCH, or COMBINED.
          example: STAGED_RESEARCH
        citationCount:
          type: integer
          description: Number of source citations assembled during this run.
        researchedAt:
          type: string
          format: date-time
          description: Timestamp when the research was conducted.

    AiSearchResponse:
      type: object
      properties:
        searchId:
          type: string
          description: Unique identifier for this search
        query:
          type: string
          description: The original search query
        articleCount:
          type: integer
          description: Number of articles retrieved from the vector store
        syntheses:
          type: array
          items:
            $ref: '#/components/schemas/AiSearchSynthesisDto'
          description: AI syntheses, one per model
        searchedAt:
          type: string
          format: date-time
          description: Timestamp when the search was executed

    AiSearchSynthesisDto:
