openapi: 3.1.0

info:
  title: AIHealthcare Newsletter API
  description: >
    AI-powered newsletter generation API. Ingests articles from configured RSS
    feeds, summarizes them with Spring AI, and produces formatted newsletter
    drafts. Historical runs are stored and retrievable for subscriber archive
    display.
  version: 3.1.0

servers:
  - url: http://localhost:8080
    description: Local development server

paths:

  # ---------------------------------------------------------------------------
  # Article ingestion
  # ---------------------------------------------------------------------------
  /api/v1/ingest:
    post:
      summary: Start an article ingestion run
      operationId: ingestArticles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
      responses:
        '201':
          description: Ingestion accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------------------
  # Articles — query persisted articles
  # ---------------------------------------------------------------------------
  /api/v1/articles:
    get:
      summary: List persisted articles for a topic
      description: >
        Returns articles stored in the database that match the given topic name.
        Use this endpoint to confirm that the feed harvester is persisting
        articles correctly.
      operationId: listArticles
      parameters:
        - name: topic
          in: query
          required: true
          description: Topic name to filter by (e.g. "PubMed AI Healthcare")
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of articles to return (default 20)
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: List of matching articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleResponse'

  # ---------------------------------------------------------------------------
  # Article search — multi-field criteria
  # ---------------------------------------------------------------------------
  /api/v1/articles/search:
    get:
      summary: Search articles by multiple optional criteria
      description: >
        Returns articles matching the AND-combined filter criteria. All parameters
        are optional; text fields use case-insensitive substring matching and
        date fields define inclusive range bounds.
      operationId: searchArticles
      parameters:
        - name: title
          in: query
          required: false
          description: Substring match against article title (case-insensitive)
          schema:
            type: string
        - name: topic
          in: query
          required: false
          description: Substring match against article topic (case-insensitive)
          schema:
            type: string
        - name: author
          in: query
          required: false
          description: Substring match against article author (case-insensitive)
          schema:
            type: string
        - name: sourceName
          in: query
          required: false
          description: Substring match against source name (case-insensitive)
          schema:
            type: string
        - name: bodyText
          in: query
          required: false
          description: Substring match against body text (case-insensitive)
          schema:
            type: string
        - name: publishedFrom
          in: query
          required: false
          description: Inclusive lower bound on publishedAt (ISO-8601)
          schema:
            type: string
            format: date-time
        - name: publishedTo
          in: query
          required: false
          description: Inclusive upper bound on publishedAt (ISO-8601)
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of matching articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleResponse'

  # ---------------------------------------------------------------------------
  # AI-Enhanced Search
  # ---------------------------------------------------------------------------
  /api/v1/search/ai:
    get:
      summary: AI-enhanced search with multi-model LLM synthesis
      description: >
        Retrieves articles via vector similarity search, then synthesizes them
        through multiple LLM models (Claude, GPT, and Perplexity Sonar) for
        side-by-side comparison. Returns the search metadata, retrieved article
        count, and one synthesis entry per model.
      operationId: aiSearch
      parameters:
        - name: q
          in: query
          required: true
          description: Natural-language search query
          schema:
            type: string
        - name: topK
          in: query
          required: false
          description: Maximum number of articles to retrieve (default 10, max 50)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: AI search results with multi-model syntheses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSearchResponse'
        '400':
          description: Missing or blank query parameter

  # ---------------------------------------------------------------------------
  # Newsletter draft generation
  # ---------------------------------------------------------------------------
  /api/v1/drafts:
    post:
      summary: Generate a newsletter draft
      operationId: generateDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ingestion run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/drafts/{draftId}:
    get:
      summary: Retrieve a previously generated draft
      operationId: getDraft
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Draft found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
        '404':
          description: Draft not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------------------
  # Subscriber management
  # ---------------------------------------------------------------------------
  /api/v1/subscribers:
    post:
      summary: Add a newsletter subscriber
      operationId: addSubscriber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriberRequest'
      responses:
        '201':
          description: Subscriber added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriberResponse'
        '400':
          description: Invalid email or name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already subscribed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List all subscribers
      operationId: listSubscribers
      responses:
        '200':
          description: List of subscribers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriberResponse'

  /api/v1/subscribers/{email}:
    delete:
      summary: Remove a subscriber
      operationId: removeSubscriber
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Subscriber removed
        '404':
          description: Subscriber not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------------------
  # Newsletter delivery (manual trigger)
  # ---------------------------------------------------------------------------
  /api/v1/newsletter/deliver:
    post:
      summary: Deliver a newsletter run to all active subscribers
      description: >
        Looks up the specified run, retrieves all active subscribers, and sends
        the HTML newsletter to each recipient via email.  Updates the run status
        to SENT on success.
      operationId: deliverNewsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliverRequest'
      responses:
        '204':
          description: Delivery triggered successfully
        '404':
          description: Run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------------------
  # Prompt variant management
  # ---------------------------------------------------------------------------
  /api/v1/variants:
    post:
      summary: Create a new prompt variant
      operationId: createVariant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariantRequest'
      responses:
        '201':
          description: Variant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariantResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List all prompt variants
      operationId: listVariants
      responses:
        '200':
          description: List of variants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VariantResponse'

  /api/v1/variants/{variantId}:
    get:
      summary: Get a prompt variant by ID
      operationId: getVariant
      parameters:
        - name: variantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Variant found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariantResponse'
        '404':
          description: Variant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a prompt variant
      operationId: deleteVariant
      parameters:
        - name: variantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Variant deleted
        '404':
          description: Variant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------------------
  # Prompt evaluation
  # ---------------------------------------------------------------------------
  /api/v1/evaluations:
    post:
      summary: Evaluate a prompt variant
      description: >
        Summarizes the given articles using the specified prompt variant, then
        scores the output with an AI evaluator on five quality dimensions.
      operationId: evaluatePrompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateRequest'
      responses:
        '201':
          description: Evaluation complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResultResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Variant or articles not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List evaluation results
      description: >
        Returns all evaluation results, optionally filtered by variant ID.
      operationId: listEvaluations
      parameters:
        - name: variantId
          in: query
          required: false
          description: Filter evaluations by variant ID
          schema:
            type: string
      responses:
        '200':
          description: List of evaluation results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvaluationResultResponse'

  /api/v1/evaluations/{evaluationId}:
    get:
      summary: Get an evaluation result by ID
      operationId: getEvaluation
      parameters:
        - name: evaluationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Evaluation found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResultResponse'
        '404':
          description: Evaluation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------------------
  # Prompt comparison
  # ---------------------------------------------------------------------------
  /api/v1/comparisons:
    post:
      summary: Compare prompt variants side by side
      description: >
        Evaluates the same articles against multiple prompt variants and
        groups the results for side-by-side comparison.
      operationId: comparePrompts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompareRequest'
      responses:
        '201':
          description: Comparison complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonResultResponse'
        '400':
          description: Invalid request (fewer than 2 variants, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Variant or articles not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List all comparisons
      operationId: listComparisons
      responses:
        '200':
          description: List of comparison results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComparisonResultResponse'

  /api/v1/comparisons/{comparisonId}:
    get:
      summary: Get a comparison result by ID
      operationId: getComparison
      parameters:
        - name: comparisonId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Comparison found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonResultResponse'
        '404':
          description: Comparison not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------------------
  # Document ingestion to vector store
  # ---------------------------------------------------------------------------
  /api/v1/documents/ingest:
    post:
      summary: Ingest documents from a directory into the vector store
      description: >
        Scans the given directory for supported file types (PDF, DOCX, TXT, MD),
        extracts text, splits it into chunks, embeds each chunk via OpenAI, and
        stores the results in the pgvector database for semantic search.
      operationId: ingestDocuments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentIngestRequest'
      responses:
        '200':
          description: Ingestion completed (partial failures are reported in the response body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIngestResponse'
        '400':
          description: Invalid request (directory missing or unreadable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------------------
  # Search prompt configuration
  # ---------------------------------------------------------------------------
  /api/v1/search-prompts:
    get:
      summary: List all search prompt configurations
      description: >
        Returns the prompt template configured for each search engine (e.g. GOOGLE,
        PERPLEXITY). These prompts are sent to external search/harvest APIs to
        guide article discovery, and are separate from the LLM summarization
        prompt variants managed under /api/v1/variants.
      operationId: listSearchPrompts
      responses:
        '200':
          description: List of search prompt configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchPromptResponse'

  /api/v1/search-prompts/{engine}:
    get:
      summary: Get the search prompt for a specific engine
      description: >
        Returns the prompt template and metadata for the named search engine.
        The engine identifier is case-insensitive (e.g. "google" or "GOOGLE").
      operationId: getSearchPrompt
      parameters:
        - name: engine
          in: path
          required: true
          description: Search engine identifier (e.g. GOOGLE, PERPLEXITY)
          schema:
            type: string
      responses:
        '200':
          description: Search prompt found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPromptResponse'
        '404':
          description: No prompt configured for this engine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------------------
  # Web monitoring (manual triggers + diagnostics)
  # ---------------------------------------------------------------------------
  /api/v1/monitoring/harvest:
    post:
      summary: Trigger competitor page harvest
      description: >
        Manually triggers a scrape of all configured competitor web pages,
        detects content changes via SHA-256 hashing, and persists changed
        pages as articles in the newsletter pipeline.
      operationId: triggerCompetitorHarvest
      responses:
        '200':
          description: Harvest completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarvestResultResponse'

  /api/v1/monitoring/huggingface:
    post:
      summary: Trigger HuggingFace model discovery
      description: >
        Manually triggers a query of the HuggingFace Models API to discover
        healthcare-related LLMs and persist them as articles.
      operationId: triggerHuggingFaceHarvest
      responses:
        '200':
          description: Discovery completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HuggingFaceHarvestResponse'

  /api/v1/monitoring/hashes:
    get:
      summary: List page content hashes
      description: >
        Returns all stored SHA-256 content hashes for monitored competitor
        pages.  Useful for verifying change detection state.
      operationId: listPageHashes
      responses:
        '200':
          description: List of page hash entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PageHashResponse'

  # ---------------------------------------------------------------------------
  # Company discovery — AI-healthcare startups from YC + TopStartups.io
  # ---------------------------------------------------------------------------
  /api/v1/companies/discover:
    post:
      summary: Trigger AI-healthcare startup company discovery
      description: >
        Scrapes Y Combinator and TopStartups.io startup directories, classifies
        companies into AI-healthcare subcategories (scribe, agent, imaging, RCM,
        infra), mixes in anchor incumbents, deduplicates, persists as articles,
        and returns the categorized company list with newsletter markdown.
      operationId: discoverCompanies
      responses:
        '200':
          description: Discovery pipeline completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDiscoveryResponse'

  # ---------------------------------------------------------------------------
  # Market intelligence report
  # ---------------------------------------------------------------------------
  /api/v1/market-intelligence/refresh:
    post:
      summary: Trigger on-demand market intelligence report generation
      description: >
        Sends the MARKET_INTELLIGENCE prompt to the configured AI model and writes
        the resulting HTML to a dated file in the NotebookLM summaries directory.
        The prompt is editable via PUT /api/v1/search-prompts/MARKET_INTELLIGENCE.
        If a file already exists for today's date it is overwritten.
      operationId: refreshMarketIntelligence
      responses:
        '200':
          description: Report generated and written successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketIntelligenceRefreshResponse'
        '500':
          description: Generation or file write failed (prompt not configured or I/O error)

  # ---------------------------------------------------------------------------
  # Analytics dashboard
  # ---------------------------------------------------------------------------
  /api/v1/analytics/ingestion:
    get:
      summary: Get article ingestion analytics
      description: >
        Returns aggregate statistics about harvested articles: total count,
        breakdown by source tier (ACADEMIC, REGULATORY, INDUSTRY, etc.),
        breakdown by topic, and counts for the last 7 and 30 days.
      operationId: getIngestionAnalytics
      responses:
        '200':
          description: Ingestion analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionAnalyticsResponse'

  /api/v1/analytics/runs:
    get:
      summary: Get newsletter run analytics
      description: >
        Returns aggregate statistics about newsletter runs: total count and
        breakdown by status (DRAFT, SENT, ARCHIVED), plus the timestamp of
        the most recently generated run.
      operationId: getRunAnalytics
      responses:
        '200':
          description: Run analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunAnalyticsResponse'

  /api/v1/analytics/evaluations:
    get:
      summary: Get prompt evaluation analytics
      description: >
        Returns aggregate statistics about prompt evaluations: total evaluation
        and comparison counts, per-variant average scores across all quality
        dimensions, and the ID of the best-performing variant by overall score.
      operationId: getEvaluationAnalytics
      responses:
        '200':
          description: Evaluation analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationAnalyticsResponse'

  # ---------------------------------------------------------------------------
  # Newsletter run archive
  # ---------------------------------------------------------------------------
  /api/v1/runs:
    get:
      summary: List all newsletter runs (subscriber archive)
      description: >
        Returns a summary list of all persisted newsletter runs. Does not include
        htmlContent or plainTextContent — use GET /api/v1/runs/{runId} for the
        full rendered content.
      operationId: listRuns
      responses:
        '200':
          description: List of run summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunSummaryResponse'

  /api/v1/runs/{runId}:
    get:
      summary: Get full detail for a newsletter run
      description: >
        Returns the complete newsletter run including the HTML-formatted email
        body (for rendering in a styled div) and the plain-text version
        (for display in a textarea).
      operationId: getNewsletterRun
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Run found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetailResponse'
        '404':
          description: Run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------------------
  # Research run history
  # ---------------------------------------------------------------------------
  /api/v1/research/runs:
    get:
      summary: List all persisted research runs
      description: >
        Returns a summary of every research pipeline execution that has been
        persisted.  Each entry records the original query, pipeline mode
        (LEGACY_GOOGLE, STAGED_RESEARCH, or COMBINED), citation count, and timestamp.
      operationId: listResearchRuns
      responses:
        '200':
          description: List of research run summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResearchRunResponse'

  /api/v1/research/runs/{runId}:
    get:
      summary: Get a specific research run by ID
      operationId: getResearchRun
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Research run found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchRunResponse'
        '404':
          description: Run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/research:
    post:
      summary: Conduct a research query
      description: >
        Executes the research pipeline for the given query and returns a structured answer
        with thematic sections and numbered citations.
        LEGACY_GOOGLE uses stored articles from the ingestion database and requires no API keys.
        STAGED_RESEARCH activates AI planning, Perplexity retrieval (with legacy fallback),
        and AI synthesis.
        COMBINED runs both retrievers, merges and deduplicates by URL, then AI-synthesizes
        across the full source set for maximum breadth and historical depth.
      operationId: conductResearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResearchRequest'
      responses:
        '200':
          description: Research answer assembled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchAnswer'
        '400':
          description: Invalid request (blank query)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:

    IngestRequest:
      type: object
      required: [runId, weekOf, topics, maxArticlesPerTopic]
      properties:
        runId:
          type: string
          example: run-2026-04-11
        weekOf:
          type: string
          format: date
          example: 2026-04-11
        topics:
          type: array
          items:
            type: string
          example: ["PubMed AI Healthcare"]
        maxArticlesPerTopic:
          type: integer
          minimum: 1
          example: 20

    IngestResponse:
      type: object
      properties:
        runId:
          type: string
        articleCount:
          type: integer

    GenerateRequest:
      type: object
      required: [runId, draftId, title, tone, maxSectionsPerTopic]
      properties:
        runId:
          type: string
        draftId:
          type: string
        title:
          type: string
          example: AI in Healthcare Weekly
        tone:
          type: string
          enum: [PROFESSIONAL, ACCESSIBLE, TECHNICAL]
        maxSectionsPerTopic:
          type: integer
          minimum: 1
          example: 3
        ragEnabled:
          type: boolean
          default: false
          description: >
            When true, retrieves semantically similar past articles from the
            vector store and injects them as context for each newsletter section,
            enabling retrieval-augmented generation (RAG).
        ragContextCount:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
          description: >
            Number of past articles to retrieve per topic when ragEnabled is true.
            Ignored when ragEnabled is false.

    DraftResponse:
      type: object
      properties:
        draftId:
          type: string
        runId:
          type: string
        title:
          type: string
        weekOf:
          type: string
          format: date
        introduction:
          type: string
        sections:
          type: array
          items:
            $ref: '#/components/schemas/SectionResponse'
        sourceCount:
          type: integer
        generatedAt:
          type: string
          format: date-time

    SectionResponse:
      type: object
      properties:
        sectionId:
          type: string
        sectionType:
          type: string
